---
meta:
  author: "schild-testlab"
  description: "SQL injection detected via libinjection (REQUEST-942). Schild test-lab regression subset in go-ftw format (written for this lab, not copied from CRS)."
rule_id: 942100
tests:
  - test_id: 1
    desc: "tautology in a query argument"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: '/api/items?id=1%27%20OR%20%271%27%3D%271'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
        output:
          status: 403
  - test_id: 2
    desc: "UNION SELECT in a query argument"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: '/api/items?q=x%27%20UNION%20SELECT%20username%2Cpassword%20FROM%20users--'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
        output:
          status: 403
  - test_id: 3
    desc: "tautology in a urlencoded body"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "POST"
          uri: '/api/items'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
            Content-Type: 'application/x-www-form-urlencoded'
          data: 'name=1%27%20OR%20%271%27%3D%271'
        output:
          status: 403
