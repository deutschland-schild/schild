---
meta:
  author: "schild-testlab"
  description: "Negative tests for the inbound anomaly score block (949110): ordinary requests to the shop must pass. Schild test-lab regression subset in go-ftw format (written for this lab, not copied from CRS)."
rule_id: 949110
tests:
  - test_id: 1
    desc: "homepage"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: '/'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
        output:
          status: 200
  - test_id: 2
    desc: "list with paging and sort"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: '/api/items?page=1&sort=name'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
        output:
          status: 200
  - test_id: 3
    desc: "search with German umlauts"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: '/api/items?q=M%C3%BCller%20%26%20S%C3%B6hne'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
        output:
          status: 200
  - test_id: 4
    desc: "search with an apostrophe in a name"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: '/api/items?q=O%27Brien'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
        output:
          status: 200
  - test_id: 5
    desc: "JSON create"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "POST"
          uri: '/api/items'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
            Content-Type: 'application/json'
          data: '{"name":"Stehlampe","owner":"kunde-1"}'
        output:
          status: 201
