---
meta:
  author: "schild-testlab"
  description: "OS file access attempt (REQUEST-930). Schild test-lab regression subset in go-ftw format (written for this lab, not copied from CRS)."
rule_id: 930120
tests:
  - test_id: 1
    desc: "/etc/shadow in a query argument"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: '/api/items?path=/etc/shadow'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
        output:
          status: 403
