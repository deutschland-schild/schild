---
meta:
  author: "schild-testlab"
  description: "XSS detected via libinjection (REQUEST-941). Schild test-lab regression subset in go-ftw format (written for this lab, not copied from CRS)."
rule_id: 941100
tests:
  - test_id: 1
    desc: "script tag in a query argument"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: '/api/items?q=%3Cscript%3Ealert(document.cookie)%3C%2Fscript%3E'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
        output:
          status: 403
  - test_id: 2
    desc: "img onerror in a query argument"
    stages:
      - input:
          dest_addr: "127.0.0.1"
          port: 80
          method: "GET"
          uri: '/api/items?q=%3Cimg%20src%3Dx%20onerror%3Dalert(1)%3E'
          headers:
            Host: 'shop.example'
            User-Agent: 'OWASP CRS test agent'
            Accept: '*/*'
        output:
          status: 403
