# TEST ONLY fail2ban filter as an operator would write it for the Caddy JSON
# access log (fields request.remote_ip / request.client_ip, request.uri, status).
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"uri":"(?:/\.env[^"]*|/\.git/[^"]*|[^"]*/composer\.(?:json|lock)|/wp-login\.php|/xmlrpc\.php|/phpmyadmin[^"]*|/\.aws/[^"]*|/vendor/phpunit[^"]*|[^"]*\.(?:bak|sql))".*"status":404
datepattern = "ts":{EPOCH}
