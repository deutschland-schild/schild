# TEST ONLY local exceptions written after the observe phase, in the runbook's
# pattern (docs/runbook-erster-server.md section 9.4); rule ids and argument
# names taken from the blocked events.
# Livewire snapshots and rich-text updates: no XSS/SQLi checks on these two arguments.
SecRule REQUEST_FILENAME "@streq /livewire/update" "id:1000101,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetById=941100;ARGS:json.components.0.snapshot,ctl:ruleRemoveTargetById=941160;ARGS:json.components.0.snapshot,ctl:ruleRemoveTargetById=942270;ARGS:json.components.0.snapshot,ctl:ruleRemoveTargetById=941100;ARGS:json.components.0.updates.body,ctl:ruleRemoveTargetById=941160;ARGS:json.components.0.updates.body"
# Login: passwords are free text.
SecRule REQUEST_FILENAME "@streq /login" "id:1000102,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetById=942100;ARGS:password"
