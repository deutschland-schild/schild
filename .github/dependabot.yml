# Minor and patch updates come as one pull request per ecosystem. A major
# version comes as a pull request of its own, so that one that needs work does
# not hold back the others.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directories:
      - /tests/adversaries
      - /gateway
      - /contract
      - /lab
      - /relay
      - /tests/testlab
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directories:
      - /dashboard
      - /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
