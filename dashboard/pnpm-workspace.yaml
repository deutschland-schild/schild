packages:
  - packages/*
  - apps/*

# Fixed versions of indirect test and tooling dependencies (GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249).
overrides:
  'glob@>=9 <14.0.2': ^14.0.2
  'minimatch@>=7 <11.0.1': ^11.0.1

allowBuilds:
  esbuild: true
  msw: false
  vue-demi: false

minimumReleaseAgeExclude:
  - eslint-plugin-vue@10.12.0
  - '@tanstack/query-core@5.105.0'
  - '@tanstack/vue-query@5.105.0'
