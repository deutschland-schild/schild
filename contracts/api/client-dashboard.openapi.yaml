openapi: 3.1.0
info:
  title: Schild client dashboard API
  version: 0.6.0
  description: |
    Local API of `schild run` for the client dashboard. Served on the dashboard
    port (default 127.0.0.1:8788) under /api/v0, never on the proxy port. Everything here
    stays on the server: full visitor IPs and locations in plaintext.

    Conventions (contracts/conventions.md):
    - Session cookie `schild_session` (HttpOnly, SameSite=Strict, Secure except plain localhost).
    - Every state-changing request (POST, PATCH, DELETE) sends `X-CSRF-Token` from GET /auth/session.
    - Errors are RFC 9457 problem details (`application/problem+json`); every operation declares them as
      its `default` response. `code` carries a stable machine-readable reason (`unauthenticated` 401,
      `csrf` 403 for a missing or wrong X-CSRF-Token, `forbidden` 403, `not_found` 404, `conflict` 409,
      `invalid` 400/422 with `errors[]` pointing at the offending fields, `rate_limited` 429, or a contract
      error code such as `seclang`), so the UI never parses `detail`.
    - Lists use cursor pagination: `cursor`, `limit` (1..500, default 50) -> `next_cursor` (null at the end).
    - Times are RFC 3339 UTC.

    Sections:
    - `websites`: one entry per website the gateway serves (derived from the Caddyfile site blocks or the proxy
      config, contract/websites) with status (ok, attention "bitte ansehen", disrupted "gestört", unknown), the
      reasons, the numbers of the last 60 s and the server it runs on with its own status and hints, plus the
      website overview. The parameter `site` (a website id, which may contain dots) filters every event,
      incident, behaviour, wave, monitoring and requests list.
    - `hosts` and `agents` (contracts/host-check.md): hosts with their read-only host reports (gateway and
      agents), "Jetzt prüfen" for the local host, agent enrolment and revocation. Host reports stay on the
      operator's servers.
    - `behaviour`: hits of the fixed behaviour scenarios and rate limits, per-scenario modes, rate limit CRUD
      with a Probelauf, releasing a client; distributed attacks ("Wellen") with list and detail, per-detector
      switches and ending a response early (address-free). Counters, blocks and hits stay on this server.
    - `monitoring`: traffic and server monitoring from aggregates, with breakdowns by referrer, browser, os,
      device, bot_category and rule, and detections per path template and per rule id.
    - `requests`: single requests of the request ring (no query string, a visitor key valid for one day),
      "Kontext" around an event, the bot overview with verification and robots.txt behaviour, alert rates per
      rule and per page, possible false positives with a narrow exception to copy.
    - `agent-api`: getAgentAPI and setAgentAPI, the switch of the agent API (D103), and listAgentCalls, the call
      log of its tokens, read only in the dashboard (tokens are managed on the host only).
  license:
    name: see repository
servers:
  - url: /api/v0
security:
  - session: []
tags:
  - name: auth
  - name: overview
  - name: group
    description: The group of gateways this gateway belongs to (contracts/cluster.md), read only. Membership is changed on the host (`schild cluster`), never here.
  - name: events
  - name: incidents
  - name: rules
  - name: allowlist
  - name: settings
  - name: privacy
  - name: hosts
    description: Server check - gateway and app VMs behind it.
  - name: agents
    description: Agent enrolment and revocation.
  - name: behaviour
    description: Behaviour across requests and rate limits, local only.
  - name: monitoring
    description: Traffic and server monitoring; aggregates only, no IP addresses.
  - name: requests
    description: Requests and bots - single requests of the request ring, context around incidents, bot overview, alert rates per rule and page, possible false positives.
  - name: websites
    description: >-
      The websites of this gateway with status, numbers and the server they run on - the start page of the
      website-first dashboard - and the website overview modelled on Plausible: KPI row with the previous period
      (getWebsiteKpis), main chart of traffic and attacks on one axis (queryMetricSeries with site, partial points
      marked), annotations (listAnnotations), Echtzeit (getWebsiteRealtime), panels with click-to-filter
      (getTrafficBreakdown with site and filter; Herkunft = referrer, Seiten = path, Woher = country / net_class / asn,
      Technik = browser / os / device, Bots = bot_category, Angriffe = rule and path by detections) and "Letzte
      Alarme" (listAlerts). "Besucher" are people (like Plausible): distinct clients with a
      browser request schild forwarded (contract/monitoring.Visitor, vectors website-visitor); bots, tools, requests
      without User-Agent and likely automated clients are no visitors and show in the Bots panel (requests per
      bot_category, MetricBucket clients.bots as "Bot-Clients"). Ranges and intervals: Echtzeit 30 min at 10 s (or getWebsiteRealtime at 1 min), 6 h at
      1 min, 24 h and 48 h at 10 min, 7 and 14 days at 30 min (10 min x 3, as 1008 and 2016 points exceed the
      1000-point cap). Single filters work from the aggregates over every range ("Näherungswert" for space-saving
      lists); combined filters and filters on visitors or latency only within the request ring (RequestPage.keep_hours, by default 14 days). Entry pages are
      not provided (they need sessions; open). Net class tabs vpn, proxy and tor appear only when the geo database
      provides them (Overview.geo_db.optional_fields).
  - name: audit
    description: The audit log (contracts/audit.md), read only. Draft (MVP-36), not served yet.
  - name: agent-api
    description: Read-only view of the agent API call log; tokens are created, listed and revoked only on the host.
paths:
  /websites:
    get:
      tags: [websites]
      operationId: listWebsites
      summary: >-
        Start page "Websites" - one entry per website of this gateway in configuration order (Caddyfile site
        blocks, or the one website of proxy mode), with status and reasons (contract/websites.Status over the last
        5 minutes), the numbers of the last 60 s (requests per second, share stopped, response time p95) and runs_on
        (this gateway: node name, server status and server-wide hints). Memory only, no database query; cost
        O(websites + hints). Unprotected websites are listed with status unknown and no numbers; websites beyond the
        first 32 are listed untracked (their traffic is in `other`). Monitoring off: listed with status unknown.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Websites.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebsiteList" }
        "401": { $ref: "#/components/responses/Problem" }
  /websites/{website}:
    get:
      tags: [websites]
      operationId: getWebsite
      summary: >-
        One website ("Überblick" of a website) - the list entry plus its counters of the last 24 hours from
        the monitoring rings and the number of incidents in that time. Unknown id: 404 not_found. The tabs use the other
        operations with `site` = this id (Zugriffe: queryRequests; Angriffe: listEvents, listIncidents,
        listBehaviourHits, listWaves; charts: queryMetricSeries, getTrafficBreakdown).
      parameters: [{ $ref: "#/components/parameters/Website" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Website.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebsiteDetail" }
        "404": { $ref: "#/components/responses/Problem" }
  /websites/{website}/kpis:
    get:
      tags: [websites]
      operationId: getWebsiteKpis
      summary: >-
        The KPI row of the website overview over [from, to) and the previous period of the same length:
        Besucher (visitors: distinct human clients per UTC day, summed over the days; a client
        counts only with a browser request schild forwarded - ua_class browser and bot_category likely_browser, outcome
        passed or would_block, contract/monitoring.Visitor - so verified and unverified bots, tools, requests without
        User-Agent and likely automated clients are never visitors, and neither is a client whose every request was
        stopped; UI "Besucher ohne erkannte Bots"; from the request ring within its window (distinct visitor keys of such
        records), else from unique_day of the 10 min ring, where a first day cut by `from` counts from 00:00 UTC;
        always exact false), Seitenaufrufe (page views follow the same rule: forwarded, likely_browser), Anfragen, Angriffe gestoppt and hätte gestoppt (separately), Antwortzeit p95 and
        Fehlerquote (5xx answers incl. 502/504 of an unreachable app, per request). Each KPI is also a per-site series
        of queryMetricSeries (traffic.clients_unique, page_views, requests, stopped, would_block, latency_total:p95,
        status_5xx). Primary key range reads of the rings; with filters see parameter Filter.
      parameters:
        - { $ref: "#/components/parameters/Node" }
        - { $ref: "#/components/parameters/Website" }
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { $ref: "#/components/parameters/Filter" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: KPIs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebsiteKpis" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /websites/{website}/realtime:
    get:
      tags: [websites]
      operationId: getWebsiteRealtime
      summary: >-
        "Echtzeit" - visitors (distinct human clients: browser requests schild
        forwarded, contract/monitoring.Visitor; bots and tools are not counted) and requests (all, bots included) of the
        last 5 minutes from memory, and the last 30 minutes in 30 one-minute points (requests, stopped, would_block,
        visitors) from 30 rows of the 1 min ring plus the current bucket (partial). Cheap enough to poll every 30 s; streamMonitoring with site gives the same
        numbers per second.
      parameters: [{ $ref: "#/components/parameters/Website" }, { $ref: "#/components/parameters/Node" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Realtime.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebsiteRealtime" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /websites/{website}/annotations:
    get:
      tags: [websites]
      operationId: listAnnotations
      summary: >-
        Markers on the main chart in [from, to), oldest first, at most 200: waves detected and ended, incidents opened, long blocks of data-centre addresses, mode and configuration
        changes (config hash), schild restarts and monitoring gaps. Read from the time indexes of waves and incidents,
        the config change log, the start list and the ring gaps; no event scan. Gateway-wide markers (restart, config,
        gap) appear for every website.
      parameters:
        - { $ref: "#/components/parameters/Website" }
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Timestamp" } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Annotations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnotationList" }
        "404": { $ref: "#/components/responses/Problem" }
  /websites/{website}/alerts:
    get:
      tags: [websites]
      operationId: listAlerts
      summary: >-
        "Letzte Alarme" next to the main chart - the latest WAF detections (enforced or observed), behaviour
        stops and rate-limit stops of this website in [from, to), newest first, at most 50. Served from an index on
        (site, time) over the detection events (no scan, no LIKE); one filter of the overview applies (path, country,
        net_class, asn, rule, bot_category; others 400). Local events only. Live:
        streamEvents with site. Each item links to getEvent and getRequestContext.
      parameters:
        - { $ref: "#/components/parameters/Website" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Filter" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Alerts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertFeed" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /websites/{website}/access:
    get:
      tags: [websites]
      operationId: getAccessProtection
      summary: >-
        The access lock of a website ("Passwortschutz"), or protection null. The password
        is never returned, only whether one is set.
      parameters: [{ $ref: "#/components/parameters/Website" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Protection state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessProtectionState" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [websites]
      operationId: setAccessProtection
      summary: >-
        Set or change the access lock of a website. In force before the answer returns, survives a
        restart, on until removed (no end). Every change ends all sessions of the website (the epoch changes). paths
        need at least one path. password absent keeps the stored one, remove_password drops it. At least one condition:
        a password, an address or own_networks. Invalid input: 400 invalid with errors[] (pointer /scope, /paths,
        /except, /password, /addresses, /message, or an unknown field such as /until).
      parameters:
        - { $ref: "#/components/parameters/Website" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessProtectionInput" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The protection now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessProtectionState" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [websites]
      operationId: removeAccessProtection
      summary: End the access lock of a website at once ("Aufheben"); its sessions end too. No lock is 204 as well.
      parameters:
        - { $ref: "#/components/parameters/Website" }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Problem" }
  /websites/{website}/maintenance:
    put:
      tags: [websites]
      operationId: setMaintenance
      summary: >-
        D98: switch the maintenance mode of a website on (or change its text) or off. On: everyone outside the own
        networks of the allowlist gets the maintenance page (503), on every path, the login form of an access lock
        included. It is a switch of its own: the access lock of the website stays as it is, and a visitor from an own
        network meets it as usual. In force before the answer returns, survives a restart, on until switched off.
      parameters:
        - { $ref: "#/components/parameters/Website" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceInput" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The state now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessProtectionState" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /websites/{website}/crawlers:
    get:
      tags: [websites]
      operationId: getCrawlerPolicy
      summary: >-
        The crawler policy of a website ("KI-Crawler steuern"): per catalogue category and per
        crawler allow or block, and whether impersonators are blocked, plus the catalogue a policy can name. A website
        without a policy has the empty one (everything allowed). Covers only crawlers that name themselves in the
        User-Agent (contracts/crawler-policy.schema.json); likely_automated and likely_browser are no crawlers.
      parameters: [{ $ref: "#/components/parameters/Website" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlerPolicyState" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [websites]
      operationId: setCrawlerPolicy
      summary: >-
        Replace the crawler policy of a website, or apply a preset to the stored one (preset alone, or with
        impersonators). In force before the answer returns, survives a restart. A rule for a crawler overrides the rule
        of its category; absent keys allow. In the test profile a block is only recorded as would_block; an allowlisted
        address is never blocked. Unknown categories or crawler ids: 400 invalid with errors[] (pointer /categories,
        /bots, /impersonators, /preset). 409 conflict when not every request of the website runs through schild. Writes
        schild.crawler.policy_set.v1.
      parameters:
        - { $ref: "#/components/parameters/Website" }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrawlerPolicyInput" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrawlerPolicyState" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: >-
        incidents (blocks with an incident number) with time in [from, to), newest first; to - from at most
        31 days (default the last 7 days). Index range on the incident time; status and site filter the rows read.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: status, in: query, schema: { type: string, enum: [blocked, unblocked] } }
        - { $ref: "#/components/parameters/Site" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page of incidents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentPage" }
        "400": { $ref: "#/components/responses/Problem" }
  /agent-api:
    get:
      tags: [agent-api]
      operationId: getAgentAPI
      summary: >-
        D103: the switch of the agent API - whether it is on, where the value comes from (the dashboard or
        schild.yaml), the address of its listener, whether the listener is open, and how many tokens are valid.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The switch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentAPIState" }
    put:
      tags: [agent-api]
      operationId: setAgentAPI
      summary: >-
        D103: switch the agent API on or off, or give the switch back to schild.yaml (reset). The value is stored
        in schild.db and holds until it is reset. agent_api.enabled false in schild.yaml is final: switching on
        against it answers 409 `config_limit`. In force before the answer returns, without a restart: the listener
        opens or closes, and calls in flight end. No password: every call of the agent API
        still needs a token, and tokens are created on the host only. Off also stops `schild firewall run` from
        getting blocks; the blocks it holds end by their own timeout. 409 `conflict`: the listener did not open
        (the port is in use, or the address names every interface outside a container); the switch stays as it was.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentAPIInput" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The switch now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentAPIState" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agent-api/calls:
    get:
      tags: [agent-api]
      operationId: listAgentCalls
      summary: >-
        The agent API call log, read-only - every token (id, label, scope,
        created, expiry, revoked, last use; never the token or its hash) and the calls with time in [from, to), newest
        first (token id, operation or MCP tool, status, rows, bytes), kept agent_api.log_days. Index range on the call
        time. Nothing here creates, changes or revokes a token: that stays `schild token` on the host. The agent API
        off and no tokens: enabled false with empty lists.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: token, in: query, schema: { $ref: "#/components/schemas/AgentTokenId" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Tokens and calls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCallLog" }
        "400": { $ref: "#/components/responses/Problem" }

  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: >-
        Draft (D108, MVP-36), no gateway serves it yet: the audit log, newest first, with time in [from, to). Every
        change with who made it, through which way, and what it was before (contracts/audit.md). In a group the
        entries of every node this gateway holds. `actor` is a token or portal key id. `subject` with `subject_id` and
        limit 1 answers who changed a thing last. An entry reads as it was written, with its addresses, until
        `audit.keep_days` deletes it. Index ranges, no scan of the log.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: website, in: query, schema: { $ref: "#/components/schemas/WebsiteId" } }
        - { name: class, in: query, schema: { $ref: "../audit-entry.schema.json#/properties/class" } }
        - { name: action, in: query, schema: { $ref: "../audit-entry.schema.json#/$defs/action" } }
        - { name: way, in: query, schema: { type: string, enum: [dashboard, agent, integration, cli, config, system] } }
        - { name: actor, in: query, schema: { type: string, pattern: "^(tok|pk)_[0-9a-f]{12}$" } }
        - { name: subject, in: query, schema: { type: string, pattern: "^[a-z][a-z_]{0,31}$" } }
        - { name: subject_id, in: query, schema: { type: string, minLength: 1, maxLength: 253 } }
        - { name: session, in: query, description: "Short id of a dashboard or portal session: what it did, from its sign-in on.", schema: { $ref: "../audit-entry.schema.json#/$defs/session" } }
        - { name: event, in: query, description: "Entries whose cause is this event, e.g. the exception made from it.", schema: { $ref: "../common.schema.json#/$defs/uuid" } }
        - { name: incident, in: query, description: "Entries whose cause or subject is this incident: its block, its release, the own IP set from it.", schema: { type: string, pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/Problem" }

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session; also tells whether the first-run password is still missing.
      security: []
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Session state (authenticated or not).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/setup:
    post:
      tags: [auth]
      operationId: setupPassword
      summary: First run - set the admin password. Only while no password exists; always needs the one-time setup code printed to the server log, also from localhost.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Password set, session started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Logged out. }
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Password changed; other sessions are ended. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: Mode, baseline protection state, 24 h counters, rule counts.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Problem" }

  /group:
    get:
      tags: [group]
      operationId: getGroupStatus
      summary: >-
        Whether this gateway runs alone or as a node of a group (contracts/cluster.md), and the state of the group as
        this node sees it: the members with their last contact, what is shared, the counters of the sync and
        the members whose configuration differs. A gateway without `cluster.enabled` answers `mode: single` and nothing
        else. Read from the running node; nothing is asked of another node for this answer.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Mode and group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupStatus" }
        "401": { $ref: "#/components/responses/Problem" }

  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Local events, newest first, with filters.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: type, in: query, schema: { type: string, pattern: "^schild\\.[a-z]+\\.[a-z]+\\.v1$" }, description: Event type. }
        - { name: ip, in: query, schema: { type: string, maxLength: 64 }, description: Exact IP or CIDR. }
        - { name: country, in: query, schema: { type: string, pattern: "^[A-Z]{2}$" } }
        - { name: asn, in: query, schema: { type: integer, minimum: 0 } }
        - { name: path, in: query, schema: { type: string, maxLength: 512 }, description: Path prefix. }
        - { name: rule, in: query, schema: { type: string, maxLength: 32 }, description: Rule id (CRS, local or CrowdSec Hub number). }
        - { name: outcome, in: query, schema: { $ref: "#/components/schemas/Outcome" } }
        - { name: session, in: query, schema: { type: string, maxLength: 40 } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Free text over path, user agent and incident. }
        - { $ref: "#/components/parameters/Site" }
        - name: net_class
          in: query
          schema: { $ref: "../common.schema.json#/$defs/netClass" }
          description: "Only events whose client has this net class (Geo.net_class), so a Woher breakdown row links to Ereignisse with the same filter."
        - name: method
          in: query
          schema: { type: string, pattern: "^[A-Z]{1,16}$" }
          description: "Only events with this HTTP method; OTHER matches every method outside GET, HEAD, POST, PUT, DELETE, PATCH, OPTIONS, CONNECT and TRACE (the method breakdown)."
        - name: ua_class
          in: query
          schema: { $ref: "#/components/schemas/UAClass" }
          description: "Only events whose User-Agent the gateway classifies as this UAClass (the classification of the monitoring counters, applied to the stored user agent)."
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/Problem" }
  /events/stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Live events as SSE with the same filters as /events. Each `data` line is one EventSummary; `id` is the event id. On reconnect the browser sends Last-Event-ID and the server replays what was missed (or starts fresh if the id is unknown); a keep-alive comment line every 15 s.
      parameters:
        - { name: type, in: query, schema: { type: string, pattern: "^schild\\.[a-z]+\\.[a-z]+\\.v1$" } }
        - { name: ip, in: query, schema: { type: string, maxLength: 64 }, description: Exact IP or CIDR. }
        - { name: country, in: query, schema: { type: string, pattern: "^[A-Z]{2}$" } }
        - { name: asn, in: query, schema: { type: integer, minimum: 0 } }
        - { name: path, in: query, schema: { type: string, maxLength: 512 }, description: Path prefix. }
        - { name: rule, in: query, schema: { type: string, maxLength: 32 } }
        - { name: outcome, in: query, schema: { $ref: "#/components/schemas/Outcome" } }
        - { name: session, in: query, schema: { type: string, maxLength: 40 } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { $ref: "#/components/parameters/Site" }
        - { name: Last-Event-ID, in: header, schema: { type: string, maxLength: 64 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /events/{id}:
    get:
      tags: [events]
      operationId: getEvent
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "../common.schema.json#/$defs/uuid" } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Full event with related events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "404": { $ref: "#/components/responses/Problem" }

  /incidents/{incident}:
    get:
      tags: [incidents]
      operationId: getIncident
      summary: Look up a block by the incident number shown on the block page.
      parameters: [{ $ref: "#/components/parameters/Incident" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "404": { $ref: "#/components/responses/Problem" }
  /incidents/{incident}/export:
    post:
      tags: [incidents]
      operationId: exportIncident
      summary: >-
        An incident as a download, with its events and its context as far as they are stored. The file
        holds full addresses and user agents, and neither retention nor privacy/delete reach it afterwards. Writes
        schild.incident.exported.v1. Not signed.
      parameters: [{ $ref: "#/components/parameters/Incident" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The incident as a download.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentExport" }
        "404": { $ref: "#/components/responses/Problem" }
  /incidents/{incident}/unblock:
    post:
      tags: [incidents]
      operationId: unblockIncident
      summary: Unblock the visitor of an incident; optionally allowlist the IP.
      description: >-
        Ends the block of the incident and every other block that runs for that client, on this gateway and, in a
        group, on every node (contracts/cluster.md, class lifts: one lift per incident). The exception for the client
        and the status are those of this incident.
      parameters: [{ $ref: "#/components/parameters/Incident" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnblockRequest" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Unblocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /rule-repositories:
    get:
      tags: [rules]
      operationId: listRuleRepositories
      summary: >-
        The rule repositories of this gateway (crs, crowdsec, local), each with its state, what it does in the gateway
        mode, counts of its rules and its own status object.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Every repository, in the order crs, crowdsec, local.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleRepositoryList" }
  /rule-exceptions:
    get:
      tags: [rules]
      operationId: listRuleExceptions
      summary: >-
        The rule exceptions in force on this gateway (D54, D83): named rules of crs or crowdsec taken off one field of
        one page of one website, set in the dashboard or through the agent API, each with its reason and who set it.
        Exceptions written by hand into rules.d are rules of the repository local and are not listed here.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Every exception, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleExceptionList" }
    post:
      tags: [rules]
      operationId: createRuleException
      summary: >-
        Set a rule exception in the dashboard (D84): the same exception, the same checks and the same store as
        createAgentException, with set_by dashboard and no token. In force before the answer returns, survives a
        restart. An identical exception stands: 200, nothing changes. 400 `invalid` with the fields, or `unknown_rule`
        for a rule that does not run here; 404 for an unknown website; 409 `not_supported` for repository local,
        `website_without_hosts`, `exception_cap` or `exception_refused` (the rules did not build, the running rules
        stay). Recorded as schild.rule.exception_set.v1 with actor dashboard. Session and CSRF header.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleExceptionRequest" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The exception in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleException" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /rule-exceptions/{id}:
    delete:
      tags: [rules]
      operationId: removeRuleException
      summary: >-
        Remove one rule exception, whoever set it (D84). The rules apply again before the answer returns. 404 for an
        unknown id. Recorded as schild.rule.exception_removed.v1 with actor dashboard. Session and CSRF header.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1900000, maximum: 1999999 } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The exceptions after the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleExceptionList" }
        "404": { $ref: "#/components/responses/Problem" }
  /rule-exceptions/{id}/rules/{rule}:
    delete:
      tags: [rules]
      operationId: removeRuleExceptionRule
      summary: >-
        Take one rule out of a rule exception, whoever set it (D86): the rule applies again to the field before the
        answer returns; the exception stands with the other rules, its id, reason, author and time unchanged. Taking
        out the last rule removes the exception. 404 for an unknown id or a rule the exception does not hold; 409
        `exception_refused` (the rules did not build, the running rules stay). Recorded as
        schild.rule.exception_removed.v1 with actor dashboard, the exception's id and only the rule taken out.
        Session and CSRF header.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1900000, maximum: 1999999 } }
        - { name: rule, in: path, required: true, schema: { $ref: "#/components/schemas/RuleId" } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The exceptions after the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleExceptionList" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /rule-repositories/{repository}:
    get:
      tags: [rules]
      operationId: getRuleRepository
      parameters: [{ $ref: "#/components/parameters/RuleRepository" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: One repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleRepository" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [rules]
      operationId: updateRuleRepository
      summary: >-
        Set the state of one repository (off, detect, block) or drop the value set here (reset_state). Session and CSRF
        header, no password on any transition. Written to the settings overlay, which wins over schild.yaml until
        reset_state; takes effect without a restart (off against the others rebuilds the WAF). Recorded as
        schild.rule.repository_switched.v1 and the annotation rule_repository_changed.
      parameters: [{ $ref: "#/components/parameters/RuleRepository" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleRepositoryPatch" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The repository after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleRepository" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /rule-repositories/{repository}/settings:
    patch:
      tags: [rules]
      operationId: updateRuleRepositorySettings
      summary: >-
        crs: set the paranoia level and the blocking threshold (D101). The body replaces what the dashboard set
        before: a field left out falls back to schild.yaml or the built-in default, an empty object removes the entry.
        Written to the settings overlay and validated like schild.yaml; the WAF is rebuilt next to the running rules and
        swapped in, no restart. crowdsec and local: 409 not_supported. Session and CSRF header, no password.
      parameters: [{ $ref: "#/components/parameters/RuleRepository" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleRepositorySettingsPatch" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The repository after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleRepository" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /rule-repositories/{repository}/sync:
    post:
      tags: [rules]
      operationId: syncRuleRepository
      summary: >-
        crowdsec: check the hub now (the answer comes when the check ended; a refusal keeps the running set and is in
        the status). local: load rules.d again, compiled next to the running rules; a set that does not build changes
        nothing (409 sync_refused). crs: 409 not_supported, its rules come with the image. Session and CSRF header.
      parameters: [{ $ref: "#/components/parameters/RuleRepository" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The repository after the sync.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleRepository" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /rule-repositories/{repository}/reset:
    post:
      tags: [rules]
      operationId: resetRuleRepository
      summary: >-
        crowdsec: back to the image snapshot. Drops the stored set, runs the snapshot without a restart and records
        schild.rule.repository_updated.v1 with outcome reset; the state does not change, updates go on afterwards. crs
        and local: 409 not_supported. Session and CSRF header, no password.
      parameters: [{ $ref: "#/components/parameters/RuleRepository" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The repository after the reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleRepository" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /rules:
    get:
      tags: [rules]
      operationId: listRules
      summary: >-
        Every rule of every repository that runs, also without a hit, with status, effect and 24 h hits. CRS rules up
        to the paranoia level, flow control and the setup check not included. Rules with hits first, then by
        repository (crs, crowdsec, local) and id.
      parameters:
        - { name: repository, in: query, schema: { $ref: "#/components/schemas/RuleRepositoryId" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RuleStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: One page of rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RulePage" }
  /rules/{repository}/{rule}:
    get:
      tags: [rules]
      operationId: getRule
      parameters: [{ $ref: "#/components/parameters/RuleRepository" }, { $ref: "#/components/parameters/Rule" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: One rule with its SecLang where known and the decisions on it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleDetail" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [rules]
      operationId: updateRule
      summary: >-
        Disable or enable one rule. CRS and local rules are removed with SecRuleRemoveById and the WAF is rebuilt before
        the answer returns; a crowdsec rule stops at once. A rule disabled in schild.yaml cannot be enabled here (409
        config_limit). Recorded as schild.rule.disabled.v1 or schild.rule.enabled.v1. Session and CSRF header.
      parameters: [{ $ref: "#/components/parameters/RuleRepository" }, { $ref: "#/components/parameters/Rule" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RulePatch" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The rule after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /allowlist:
    get:
      tags: [allowlist]
      operationId: listAllowlist
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Local allowlist (never sent anywhere).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistPage" }
    post:
      tags: [allowlist]
      operationId: addAllowlistEntry
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowlistInput" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistEntry" }
        "400": { $ref: "#/components/responses/Problem" }
  /allowlist/mine:
    get:
      tags: [allowlist]
      operationId: getMyIP
      summary: The caller's IP as Schild sees it (only TCP peer or trusted proxies, G5).
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Caller IP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyIP" }
    post:
      tags: [allowlist]
      operationId: allowMyIP
      summary: 'Button "Meine IP freischalten": add the caller''s IP.'
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowMineRequest" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistEntry" }
  /allowlist/{id}:
    delete:
      tags: [allowlist]
      operationId: deleteAllowlistEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Problem" }

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Partial update. Session and CSRF header, no password.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated settings (written to schild.yaml, validated with the same validator).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /privacy/search:
    get:
      tags: [privacy]
      operationId: privacySearch
      summary: What Schild stores about one IP (data subject requests).
      parameters:
        - { name: ip, in: query, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySummary" }
  /privacy/export:
    post:
      tags: [privacy]
      operationId: privacyExport
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyRequest" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: All stored local events of this IP as a download.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyExport" }
  /privacy/delete:
    post:
      tags: [privacy]
      operationId: privacyDelete
      summary: "Delete everything stored about one address. Cannot be undone, so the request carries `confirm: true`, which the UI sets after its dialog. Session and CSRF header, no password."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyDeleteRequest" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyDeleteResult" }
        "400": { $ref: "#/components/responses/Problem" }

  /hosts:
    get:
      tags: [hosts]
      operationId: listHosts
      summary: "Every host with its last report - the gateway (id `local`) first, then agents by hostname, revoked agents with status `revoked`. Empty page when host_check is not configured."
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/HostStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page of hosts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostPage" }
  /hosts/{host_id}:
    get:
      tags: [hosts]
      operationId: getHost
      summary: "One host with its newest report (findings and inventory) and the history of kept reports."
      parameters: [{ $ref: "#/components/parameters/HostId" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Host detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostDetail" }
        "404": { $ref: "#/components/responses/Problem" }
  /hosts/local/check:
    post:
      tags: [hosts]
      operationId: runLocalCheck
      summary: '"Jetzt prüfen": ask for a check run of the local host (gateway only; agents check on their own schedule, the gateway never sends them commands). The run itself happens outside the container (`schild check`, read-only); poll getHost until last_report_at changes.'
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "202":
          description: Run requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalCheckRun" }
        "409": { description: "A run is already requested or running (code `check_running`).", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: "No way to start the check from the dashboard (code `check_unavailable`); the timer still runs.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /hosts/{host_id}/findings/accept:
    post:
      tags: [hosts]
      operationId: acceptHostFinding
      summary: "Mark an open finding of the newest report as accepted (D102): it no longer counts as open and stays listed under `accepted`. The severity is taken from the report. The acceptance holds for later reports until it is reopened or the finding comes back with a higher severity. 404 when the host or an open finding with this id and subject does not exist."
      parameters: [{ $ref: "#/components/parameters/HostId" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingAccept" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Accepted; the host as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostDetail" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "The host already has 200 accepted findings (code `conflict`).", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /hosts/{host_id}/findings/reopen:
    post:
      tags: [hosts]
      operationId: reopenHostFinding
      summary: "Take an acceptance back (D102): the finding counts as open again when a report holds it. 404 when the host or the acceptance does not exist."
      parameters: [{ $ref: "#/components/parameters/HostId" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingRef" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Reopened; the host as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostDetail" }
        "404": { $ref: "#/components/responses/Problem" }

  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: "Enrolled, pending and revoked agents."
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AgentStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page of agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPage" }
  /agents/enrolments:
    post:
      tags: [agents]
      operationId: createEnrolment
      summary: "Create a one-time enrolment code and the one-line command for the app VM. The code is shown once and never listed again."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrolmentInput" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201":
          description: Code created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrolment" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{agent_id}/confirm:
    post:
      tags: [agents]
      operationId: confirmAgent
      summary: "Confirm a pending agent after comparing its key fingerprint with the one `schild agent enrol` printed. Only then are its reports accepted."
      parameters: [{ $ref: "#/components/parameters/AgentId" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentConfirm" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /agents/{agent_id}/revoke:
    post:
      tags: [agents]
      operationId: revokeAgent
      summary: "Revoke an agent (also rejects a pending one). The key stays on the revocation list, its reports are answered with `revoked`; kept reports stay visible until retention removes them. Agents from schild.yaml are revoked there (`revoked: true`), not here (409 `config_agent`)."
      parameters: [{ $ref: "#/components/parameters/AgentId" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRevoke" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /blocks:
    get:
      tags: [behaviour]
      operationId: listBlocks
      summary: >-
        Every address block that runs now (D87): set by a scenario or by an agent, the kept blocks over 24 h included,
        newest first, at most 500. Full IPs, local only. firewall says whether the host's firewall holds the client too:
        `schild firewall run` (nftables table "inet schild", ports 80 and 443) asks the agent API for the blocks
        (syncAgentFirewall) and says in each call what it applied; without a call (or none for 2 minutes) it is off or
        stale for every row. Ending a block: POST /incidents/{incident}/unblock with its incident, which reaches the
        firewall within a second.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The blocks that run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockList" }
    post:
      tags: [behaviour]
      operationId: createBlock
      summary: >-
        Block one address by hand (D88), for every website of this gateway: the same block as a scenario's or an
        agent's, with source dashboard, an incident and an end (1 hour, 24 hours or 7 days), so it is listed, lifted
        with unblockIncident and, with `schild firewall run`, held in the firewall within a second. An IPv6 address
        blocks its /64. Refused: 409 `own_address` (own IPs, the gateway itself), `private_address` (private,
        loopback, link-local and other non-public ranges), `shared_address` (mobile, CGNAT or Tor, unless shared_ok:
        the block hits everyone behind it), `already_blocked` (a block of this address runs; detail names its
        incident), `test_profile` (a gateway in the test profile blocks nobody). 400 `invalid` with the fields. Recorded
        as schild.block.set.v1 with actor dashboard. Session and CSRF header.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockRequest" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: The block that runs now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunningBlock" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /behaviour/hits:
    get:
      tags: [behaviour]
      operationId: listBehaviourHits
      summary: "Scenario hits and rate-limit records, newest first (from the local events schild.behaviour.triggered.v1 and schild.ratelimit.exceeded.v1). Full IPs, local only."
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/BehaviourHitKind" } }
        - { name: scenario, in: query, schema: { $ref: "#/components/schemas/ScenarioId" } }
        - { name: ip, in: query, schema: { type: string, maxLength: 64 }, description: Exact IP or CIDR. }
        - { name: active, in: query, schema: { type: boolean }, description: Only hits whose block is still running. }
        - { $ref: "#/components/parameters/Site" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page of hits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviourHitPage" }
        "400": { $ref: "#/components/responses/Problem" }
  /behaviour/hits/{id}:
    get:
      tags: [behaviour]
      operationId: getBehaviourHit
      summary: "One hit with the client's recent requests, its current block and the explanation inputs."
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "../common.schema.json#/$defs/uuid" } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Hit detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviourHitDetail" }
        "404": { $ref: "#/components/responses/Problem" }
  /behaviour/settings:
    get:
      tags: [behaviour]
      operationId: getBehaviourSettings
      summary: "Mode and effective thresholds per scenario, presets, preset limit mode, whether the browser check exists, 24 h counts."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Behaviour settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviourSettings" }
    patch:
      tags: [behaviour]
      operationId: updateBehaviourSettings
      summary: "Switch scenarios (aus / beobachten / sperren), set their thresholds (D93) and switch preset limits one by one (D95). Written to the settings overlay and validated like schild.yaml."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BehaviourSettingsPatch" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviourSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /behaviour/rate-limits:
    get:
      tags: [behaviour]
      operationId: listRateLimits
      summary: "Every rate limit (presets, schild.yaml, dashboard) with live counts of the last 24 h."
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page of rate limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimitPage" }
    post:
      tags: [behaviour]
      operationId: createRateLimit
      summary: "Add an own rate limit. A route of wildcards only needs `confirm_site_wide: true` (else 400 `invalid`, pointer `/confirm_site_wide`)."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateLimitInput" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimit" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /behaviour/rate-limits/dry-run:
    post:
      tags: [behaviour]
      operationId: dryRunRateLimit
      summary: "Probelauf for a draft limit over the stored local events of the last 24 h (unremarkable requests are sampled, so the counts are a lower bound: `sampled`). Changes nothing."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateLimitDraft" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimitDryRun" }
        "400": { $ref: "#/components/responses/Problem" }
  /behaviour/rate-limits/{limit_id}:
    patch:
      tags: [behaviour]
      operationId: updateRateLimit
      summary: "Replace an own rate limit. Limits from schild.yaml or presets are changed there (409 `config_limit`)."
      parameters: [{ $ref: "#/components/parameters/LimitId" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateLimitInput" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimit" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [behaviour]
      operationId: deleteRateLimit
      summary: "Remove an own rate limit. No body. 409 `config_limit` for limits from schild.yaml or presets."
      parameters: [{ $ref: "#/components/parameters/LimitId" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /behaviour/release:
    post:
      tags: [behaviour]
      operationId: releaseClient
      summary: "Release a client: ends its running blocks and resets its counters. `allow` adds a narrow exception (only this scenario or limit, for `ttl`) or allows it permanently (allowlist entry `no_block`, never expires; WAF rules still run). Local only."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseRequest" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Released.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /distributed/waves:
    get:
      tags: [behaviour]
      operationId: listWaves
      summary: "Distributed attacks (waves), newest first, from the local events schild.distributed.detected.v1 and .ended.v1. Address-free."
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: detector, in: query, schema: { $ref: "#/components/schemas/DetectorId" } }
        - { name: active, in: query, schema: { type: boolean }, description: Only waves whose response is still running. }
        - { $ref: "#/components/parameters/Site" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page of waves.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WavePage" }
        "400": { $ref: "#/components/responses/Problem" }
  /distributed/waves/{wave_id}:
    get:
      tags: [behaviour]
      operationId: getWave
      summary: "One wave with its cluster summary and recent requests on the attacked route."
      parameters: [{ $ref: "#/components/parameters/WaveId" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Wave detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaveDetail" }
        "404": { $ref: "#/components/responses/Problem" }
  /distributed/waves/{wave_id}/end:
    post:
      tags: [behaviour]
      operationId: endWave
      summary: "End a running response early. No body. 409 `not_active` when it already ended."
      parameters: [{ $ref: "#/components/parameters/WaveId" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wave" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /distributed/settings:
    get:
      tags: [behaviour]
      operationId: getDistributedSettings
      summary: "Mode and effective thresholds per detector, responses, learning period, whether a JA4 header is used."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributedSettings" }
    patch:
      tags: [behaviour]
      operationId: updateDistributedSettings
      summary: "Switch detectors (aus / beobachten / reagieren)."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributedSettingsPatch" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributedSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /monitoring/now:
    get:
      tags: [monitoring]
      operationId: getMonitoringNow
      summary: "What the server is doing right now - traffic of the last 60 s and 10 s, the latest server sample, health hints. Read from memory only (no database query); cost O(sites + hints)."
      parameters:
        - { $ref: "#/components/parameters/Node" }
        - { $ref: "#/components/parameters/Site" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringNow" }
        "409": { $ref: "#/components/responses/Problem" }
  /monitoring/stream:
    get:
      tags: [monitoring]
      operationId: streamMonitoring
      summary: "Live counters as SSE, one `tick` per second (event name `tick`, `data` one LiveTick, `id` the Unix second). Every 10th tick carries `server`. On reconnect with Last-Event-ID the server replays the missed seconds from its in-memory ring of the last 300 s (or starts fresh); a keep-alive comment every 15 s. The tick is serialised once per second and shared by all subscribers (at most 16, else 429 rate_limited)."
      parameters:
        - { $ref: "#/components/parameters/Site" }
        - { name: Last-Event-ID, in: header, schema: { type: string, pattern: "^[0-9]{1,12}$" } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Tick stream.
          content:
            text/event-stream:
              schema: { type: string }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /monitoring/series:
    get:
      tags: [monitoring]
      operationId: queryMetricSeries
      summary: >-
        Time series of up to 16 metrics over one range at one resolution. Read by primary key range from
        the ring table of the chosen resolution (at most two contiguous slot ranges, cost O(points x series)); no scan,
        no LIKE. resolution auto picks the finest ring that still covers `from` and yields at most 1000 points; an
        explicit resolution with more than 1000 points answers 400 too_many_points. Missing data (before monitoring
        started, a restart, older than the ring) is null, never an error.
      parameters:
        - { $ref: "#/components/parameters/Node" }
        - name: metric
          in: query
          required: true
          style: form
          explode: true
          description: "`<metric id>[:<stat>]`, repeated. Default stat by kind: counter rate, gauge avg, histogram p95, estimate value. Allowed stats per metric in getMetricCatalogue."
          schema:
            type: array
            minItems: 1
            maxItems: 16
            items: { $ref: "#/components/schemas/MetricQuery" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: resolution, in: query, schema: { type: string, enum: [auto, 10s, 1m, 10m], default: auto } }
        - { $ref: "#/components/parameters/Site" }
        - { $ref: "#/components/parameters/Filter" }
        - { name: object, in: query, schema: { $ref: "#/components/schemas/MetricObject" }, description: "Only this mount, device or interface for per-object metrics; without it every object gets its own series." }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Series, aligned to step boundaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /monitoring/traffic/breakdown:
    get:
      tags: [monitoring]
      operationId: getTrafficBreakdown
      summary: >-
        Top entries of one traffic dimension over a range, merged from the per-bucket top lists of the
        1 min or 10 min ring (primary key range, cost O(buckets x list size)). The 1 min ring when it covers
        `from` and the range has at most 1000 of its buckets, else the 10 min ring with at most 2016 buckets (14 days);
        a longer range answers 400 invalid (pointer #/query/from) - longer charts use queryMetricSeries, which merges.
        With `site` (website overview panels): with one website the site filter is the whole
        traffic; with several websites the per-website top lists of the 10 min ring answer (MetricBucket.sites[].top,
        K = 16 for path, asn, country, referrer and rule, exact for the small enums), so ranges are rounded to 10 min.
        Every item carries requests, stopped and would_block (the "Woher" tabs show traffic and attacks side by side).
        A breakdown under a `filter` (click to filter) combines two dimensions and comes from the request ring (within
        RequestPage.keep_hours, source requests, exact false when sampled); outside it 409 filter_unavailable. by=ip and
        by=user_agent come from the request ring only, with or without a filter (409 filter_unavailable outside its
        window); the rings never hold addresses or User-Agents. Paths are path templates (pathtpl), never raw paths
        or queries.
        Items of by=path carry detections next to requests and by=rule items count the detections per rule, so alert
        rates per page and per rule cover the whole ring.
      parameters:
        - { $ref: "#/components/parameters/Node" }
        - { name: by, in: query, required: true, schema: { $ref: "#/components/schemas/BreakdownDimension" } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Site" }
        - { $ref: "#/components/parameters/Filter" }
        - { name: top, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Breakdown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrafficBreakdown" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /monitoring/server:
    get:
      tags: [monitoring]
      operationId: getServerSnapshot
      summary: "The latest full host sample (at most 10 s old) with per-core CPU, mounts, devices, interfaces, TCP states, conntrack, file descriptors, the schild process and its queues, what is visible in this environment (container, cgroup, network namespace) and the OS from the latest host report. From memory; no database query."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSnapshot" }
        "409": { $ref: "#/components/responses/Problem" }
  /monitoring/catalogue:
    get:
      tags: [monitoring]
      operationId: getMetricCatalogue
      summary: "Every metric id with kind, unit, scope, allowed stats, whether it is exact or an estimate, and whether it is available on this server (with the reason when not). Static per process start."
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Catalogue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricCatalogue" }
        "409": { $ref: "#/components/responses/Problem" }
  /monitoring/buckets:
    get:
      tags: [monitoring]
      operationId: listMetricBuckets
      summary: >-
        Raw buckets of one ring, oldest first, by cursor - the unit an export reads. Primary key range read; a cursor older than the ring continues at the oldest bucket
        still kept (the gap is visible from `t`).
      parameters:
        - { name: resolution, in: query, required: true, schema: { $ref: "#/components/schemas/Resolution" } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page of buckets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricBucketPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /requests:
    get:
      tags: [requests]
      operationId: queryRequests
      summary: >-
        Single requests from the request ring ("Anfragen"), valid requests and WAF alerts in one
        list, newest first. to - from at most 6 h and within monitoring.requests.keep_hours, else 400 invalid
        (pointer #/query/from). One query at a time per gateway (another running query: 429 rate_limited); at most
        100000 records read per request, then scan_capped with a cursor. Filters are exact values, no free text. The
        numbers on the dashboard come from the monitoring counters; this list serves drill-down. Ring off: 409
        requests_off.
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { $ref: "#/components/parameters/Site" }
        - { name: path, in: query, description: "A path template, which also finds the real paths with that template, or an exact redacted path.", schema: { type: string, maxLength: 512 } }
        - { name: rule, in: query, description: "Records with this rule id among their rules.", schema: { type: string, maxLength: 32 } }
        - { name: outcome, in: query, schema: { $ref: "#/components/schemas/RequestOutcome" } }
        - { name: status_class, in: query, schema: { type: string, enum: [1xx, 2xx, 3xx, 4xx, 5xx] } }
        - { name: country, in: query, schema: { type: string, pattern: "^[A-Z]{2}$" } }
        - { name: bot_category, in: query, schema: { $ref: "#/components/schemas/BotCategory" } }
        - { name: bot, in: query, description: "Catalogue bot id.", schema: { $ref: "#/components/schemas/BotId" } }
        - { name: verification, in: query, schema: { $ref: "#/components/schemas/BotVerification" } }
        - { name: visitor, in: query, description: "One visitor key (valid for its day only).", schema: { $ref: "#/components/schemas/VisitorKey" } }
        - { name: ip, in: query, description: "One exact address. The window may then span the whole ring, and a from before the ring moves to its start.", schema: { type: string, maxLength: 64 } }
        - { name: user_agent, in: query, description: "Part of the User-Agent, case-insensitive; the one filter that is no exact value. The window may then span the whole ring, like ip.", schema: { type: string, maxLength: 1024 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page of request records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /requests/context/{event_id}:
    get:
      tags: [requests]
      operationId: getRequestContext
      summary: >-
        "Kontext" of an event or incident - every request of the same visitor key from 5 min before
        to 5 min after the event, in order (e.g. login, browsing, then the request with the alert), and a site-wide strip
        of the same window in 10 s steps from the monitoring ring. An incident or a possible false positive pins this
        window unsampled and keeps it min(events_days, raw_ip_days) days; otherwise it comes from the ring (sampled
        above max_size_mb, state sampled). An event whose context is gone answers state expired with empty lists. Unknown event: 404 not_found.
      parameters:
        - { name: event_id, in: path, required: true, schema: { $ref: "../common.schema.json#/$defs/uuid" } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestContext" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /requests/bots:
    get:
      tags: [requests]
      operationId: getBotOverview
      summary: >-
        "Bots & KI-Crawler" - requests and bytes per bot category and per catalogue bot, last seen,
        verification counts ("gibt sich als ... aus" for mismatch), robots.txt behaviour, the catalogue version and the
        age of each range snapshot. Window within the request ring (default the last 24 h). Observation only.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Site" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Bot overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotOverview" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /requests/alerts/rules:
    get:
      tags: [requests]
      operationId: getRuleAlerts
      summary: >-
        Per WAF rule - detections over the range from the monitoring rings (up to the 10 min ring,
        14 d by default) and, for the part of the range inside the request ring, the pages it fires on with the share
        of their requests it hits and how many hit clients otherwise behaved like normal visitors. A rule that hits
        many otherwise normal visitors on one page is marked possible_false_positive (hints in listFalsePositiveHints).
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Site" }
        - { name: top, in: query, schema: { type: integer, minimum: 1, maximum: 64, default: 20 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Rule alert rates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleAlerts" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /requests/alerts/pages:
    get:
      tags: [requests]
      operationId: getPageAlerts
      summary: >-
        Per path template - alert rate next to traffic (detections / requests from the monitoring
        rings over the whole range) and, inside the request ring, status classes, p95 latency, the rules that fire and
        how many alerts in observe were followed by a 2xx answer (review = true highlights the page for a look).
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Site" }
        - { name: top, in: query, schema: { type: integer, minimum: 1, maximum: 64, default: 20 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Page alert rates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageAlerts" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /requests/alerts/hints:
    get:
      tags: [requests]
      operationId: listFalsePositiveHints
      summary: >-
        "möglicher Fehlalarm" - rule and page pairs inside the request ring where most hit clients
        otherwise behaved like normal visitors (page views, 2xx answers, a browser, no other alerts), each with a narrow
        exception (one rule, one page, one field) as a snippet to copy into the operator's repository. Never applied by
        schild (configuration as code). At most 50 hints.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Site" }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200":
          description: Hints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FalsePositiveHintList" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: schild_session
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    From:
      name: from
      in: query
      schema: { $ref: "#/components/schemas/Timestamp" }
    To:
      name: to
      in: query
      schema: { $ref: "#/components/schemas/Timestamp" }
    Incident:
      name: incident
      in: path
      required: true
      schema: { $ref: "#/components/schemas/IncidentNumber" }
    RuleRepository:
      name: repository
      in: path
      required: true
      schema: { $ref: "#/components/schemas/RuleRepositoryId" }
    Rule:
      name: rule
      in: path
      required: true
      schema: { $ref: "#/components/schemas/RuleId" }
    HostId:
      name: host_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/HostId" }
    LimitId:
      name: limit_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    WaveId:
      name: wave_id
      in: path
      required: true
      schema: { $ref: "../common.schema.json#/$defs/uuid" }
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AgentId" }
    Node:
      name: node
      in: query
      schema: { type: string, pattern: "^(all|n-[0-9a-f]{32})$" }
      description: >-
        In a group of gateways (contracts/cluster.md section 9a): the node whose numbers the answer shows. Absent or
        `all`: every node of the group added up, the default. A node id (GroupMember.id of getGroupStatus): that node
        alone, this gateway or another member, from the history this gateway holds of it. An id that is no gateway of
        the group, and any id on a single gateway: 400 invalid (pointer #/query/node). The answer says what it covers
        in `cluster`.
    Site:
      name: site
      in: query
      description: >-
        Only this website (WebsiteId from listWebsites). Without it: all websites together.
        Events, incidents, behaviour hits and waves belong to the website their request Host resolves to
        (contract/websites Set.Resolve; site-wide behaviour hits and waves by their host); monitoring and requests by the
        website the gate counted them for. An id this gateway does not serve: 400 invalid (pointer #/query/site). An
        unprotected website: empty results (schild sees none of its requests).
      schema: { $ref: "#/components/schemas/WebsiteId" }
    Filter:
      name: filter
      in: query
      style: form
      explode: true
      description: >-
        "click to filter" in the website overview: `<dimension>:<value>`, repeated for a combination. One
        filter is answered from the per-website top lists of the 10 min ring (approximate when the value is outside a
        space-saving list: exact false, "Näherungswert"); two or more, or a filter on visitors or latency, only from the
        request ring (RequestPage.keep_hours back, by default 14 days); otherwise 409 filter_unavailable. `ip:<address>` and
        `user_agent:<part>` (case-insensitive part of the User-Agent) filter like a dimension; only the request ring
        answers them, also on their own. They are breakdown dimensions too.
      schema:
        type: array
        maxItems: 4
        items: { $ref: "#/components/schemas/FilterExpr" }
    Website:
      name: website
      in: path
      required: true
      schema: { $ref: "#/components/schemas/WebsiteId" }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$", description: "Machine readable reason: unauthenticated, csrf, forbidden, not_found, conflict, invalid, rate_limited, internal, monitoring_off (a monitoring operation while monitoring.enabled is false, 409), too_many_points (an explicit resolution yields more than 1000 points, 400), requests_off (a requests operation while the request ring is off, 409), filter_unavailable (a filtered or combined per-website query that neither the rings nor the request ring can answer, 409), or a contract error code (seclang, evidence, ...)." }
        errors:
          type: array
          maxItems: 100
          description: Field errors for invalid input (RFC 9457 extension member), so forms can mark the field.
          items:
            type: object
            additionalProperties: false
            required: [pointer, detail]
            properties:
              pointer: { type: string, description: JSON Pointer (RFC 6901) into the request body, or "#/query/<name>". }
              detail: { type: string }
    Timestamp:
      type: string
      pattern: "^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$"
    NullableTimestamp:
      oneOf:
        - { $ref: "#/components/schemas/Timestamp" }
        - { type: "null" }
    Mode:
      description: "The protection mode of a gateway before D89, only in old config changes (mode_from, mode_to). There is no mode to set any more."
      type: string
      enum: [observe, review, autoblock]
    Outcome: { type: string, enum: [passed, logged, blocked, would_block], description: "D92: no challenged, schild has no browser check." }
    IncidentNumber:
      description: >-
        The number shown on the block page. WAF and request-limit blocks of one client (behaviour client
        key), one rule key (sorted rule ids, or limit:<code>) and one UTC minute share one incident: the first such
        request draws the number, every later one in that minute shows the same number on its block page and its event
        carries it, so a number a visitor reports always finds its incident (Incident.count, first_seen, last_seen).
        Behaviour and rate-limit blocks keep one incident per block. Rules in contracts/storage-bounds.md.
      type: string
      pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$"
    WouldBlockReason:
      description: >-
        Why a request schild would have blocked was passed, on events (outcome
        would_block) and alerts (outcome would_block or would_rate_limit), so the UI says "Erkannt, aber durchgelassen:
        ...". gateway_observe the gateway runs the test profile, in which nothing is blocked (before D89 also mode observe); site_observe the website is set to
        observe while the gateway blocks; learning the learning period of a fresh installation ("Lernphase");
        scenario_observe the behaviour scenario, rate limit or detector is set to observe; source_detect
        the rule source that matched is set to detect ("Regelquelle steht auf Erkennen", D90); settling the rule is a CrowdSec
        update that still settles ("Update wartet noch", D90); allowlist the client is on
        the allowlist or an exception covers it ("Freigabe"); shared_address the address is shared (cgnat, mobile, tor) and
        never blocked by address ("geteilte Adresse"). When several apply the first in this order. Same enum as
        events.schema.json wouldBlockReason.
      type: string
      enum: [gateway_observe, site_observe, learning, scenario_observe, source_detect, settling, allowlist, shared_address]
    Health: { type: string, enum: [ok, slow, down, unknown] }
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, first_run]
      properties:
        authenticated: { type: boolean }
        first_run: { type: boolean, description: No admin password yet; the dashboard shows the setup screen. }
        user: { type: string }
        role: { type: string, enum: [admin, readonly] }
        csrf_token: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        via: { type: string, enum: [localhost, password] }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [password, setup_code]
      properties:
        setup_code: { type: string, maxLength: 64, description: "One-time code from the server log (after a reset: printed by schild dashboard reset-password). Required, also from localhost." }
        password: { type: string, minLength: 12, maxLength: 256 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        user: { type: string, default: admin }
        password: { type: string, minLength: 1, maxLength: 256 }
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 256 }
        new_password: { type: string, minLength: 12, maxLength: 256 }

    Overview:
      type: object
      additionalProperties: false
      required: [profile, baseline, counters_24h, rules, generated_at]
      properties:
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        profile: { type: string, enum: [production, test], description: "test: nothing is blocked, every source only records what it would block (D89)." }
        baseline:
          type: object
          additionalProperties: false
          required: [state, reasons]
          description: 'Baseline protection ("Grundschutz aktiv" in the dashboard): active when the local WAF with CRS runs.'
          properties:
            state: { type: string, enum: [active, degraded, off] }
            reasons:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, since]
                properties:
                  code: { type: string, enum: [waf_down, crs_off, crs_detect, geo_db_old, disk_full, trusted_proxies_too_broad, trusted_proxies_missing, dashboard_settings_dropped, cluster_peers_unreachable, cluster_config_drift, cluster_clock_skew, cluster_clock_out_of_service, cluster_counts_not_taken, cluster_state_differs], description: "cluster_state_differs: what is in force on this node (blocks, settings, access or logins) has differed from a reachable gateway for 30 s or longer, by the state hashes of contracts/cluster.md section 14; the node asks that gateway again and applies the group's state again, at most once a minute. cluster_clock_out_of_service: this node left traffic (readiness 503) because at least two other gateways it reaches agree on the time and its own clock is 60 s or more off theirs; it returns by itself when its clock is right. cluster_counts_not_taken: at its start this node could not take the running counts of limits and scenarios from a member it reached, and serves with counters that began at zero; it ends when a later pass succeeds or with the next start. cluster_peers_unreachable (a node of a group only, contracts/cluster.md): this node does not reach at least one gateway of its group. cluster_config_drift: the config version of at least one gateway differs from this node's. cluster_clock_skew: the clock of at least one gateway is 10 s or more off this node's; the later change wins in a group, so clocks have to agree. crs_off: the crs repository is off; crs_detect: it only detects, so the CRS blocks nothing. trusted_proxies_too_broad: a range in ingress.trusted_proxies is wider than /8 (IPv4) or /32 (IPv6), so forwarding headers are ignored and every client counts as its TCP peer. trusted_proxies_missing (D91): in the last 10 to 20 minutes at least 20 requests, and at least half of all, came from a private or loopback address that is not in ingress.trusted_proxies and carried a forwarding header: a proxy in front (nginx on the Docker host, a load balancer) is not trusted, so every visitor counts as that proxy and blocks of scenarios never hit (private addresses are never blocked). dashboard_settings_dropped: settings or rate limits saved in the dashboard no longer fit schild.yaml and were not applied at start; schild.yaml counts until they are saved again." }
                  since: { $ref: "#/components/schemas/Timestamp" }
        counters_24h:
          type: object
          additionalProperties: false
          required: [requests, evaluated, blocked, would_block, incidents]
          properties:
            requests: { type: integer, minimum: 0 }
            evaluated: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
            would_block: { type: integer, minimum: 0 }
            incidents: { type: integer, minimum: 0 }
            p95_overhead_ms: { type: number, minimum: 0 }
            partial: { type: boolean, description: "The counters do not cover the full 24 h (schild started, or events were dropped or deleted by the size cap inside the window). Absent = false." }
            since: { $ref: "#/components/schemas/Timestamp", description: "Start of the counted window when later than generated_at - 24 h (schild start). Absent = the full 24 h." }
        rules:
          type: object
          additionalProperties: false
          required: [crs_version]
          properties:
            crs_version: { type: string }
        geo_db:
          type: object
          additionalProperties: false
          description: "Geo database in use. The dashboard shows \"Geo-Daten: <Anbieter>, Stand <built_at>\"; with a download provider also the last refresh and, when the last download failed, that the previous database is still in use. The token is never part of it."
          properties:
            source: { type: string }
            built_at: { $ref: "#/components/schemas/Timestamp" }
            provider: { type: string, enum: [dbip, ipinfo, maxmind], description: "schild.yaml geo.provider." }
            databases: { type: array, maxItems: 4, items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" }, description: "Databases in use (downloading providers)." }
            optional_fields: { type: array, maxItems: 6, uniqueItems: true, items: { type: string, enum: [is_vpn, is_proxy, is_tor, is_hosting, is_mobile, carrier] }, description: "Paid-tier fields the database provides." }
            refreshed_at: { $ref: "#/components/schemas/NullableTimestamp", description: "Last successful download." }
            last_error: { type: string, enum: [token_missing, token_rejected, download_failed, too_large, invalid_format, sanity_failed], description: "Why the last download failed; the last good database stays in use." }
            last_error_at: { $ref: "#/components/schemas/Timestamp" }
        version: { type: string }
        servers: { $ref: "#/components/schemas/ServersSummary" }
        series_24h:
          description: "Optional: hourly counts for the sparklines. Every array has 24 buckets, oldest first; the last bucket ends at generated_at."
          type: object
          additionalProperties: false
          required: [requests, blocked, would_block]
          properties:
            requests: { $ref: "#/components/schemas/HourlySeries" }
            blocked: { $ref: "#/components/schemas/HourlySeries" }
            would_block: { $ref: "#/components/schemas/HourlySeries" }
    HourlySeries:
      type: array
      minItems: 24
      maxItems: 24
      items: { type: integer, minimum: 0 }
    Geo:
      type: object
      additionalProperties: false
      required: [country, asn, net_class]
      properties:
        country: { type: string }
        city: { type: string }
        asn: { type: integer }
        as_org: { type: string }
        net_class: { type: string }
    EventSummary:
      type: object
      additionalProperties: false
      required: [id, time, type]
      properties:
        id: { $ref: "../common.schema.json#/$defs/uuid" }
        time: { $ref: "#/components/schemas/Timestamp" }
        type: { type: string }
        outcome: { $ref: "#/components/schemas/Outcome", description: "Of a request event. Also on schild.block.set.v1 (blocked, would_block) and on a scenario hit or exceeded limit that blocked (blocked)." }
        ip: { type: string, description: "Full visitor IP (local only). On request events and on the events about one address: schild.block.set.v1, schild.behaviour.triggered.v1, schild.ratelimit.exceeded.v1 (with geo, incident, host and path where the event has them)." }
        geo: { $ref: "#/components/schemas/Geo" }
        method: { type: string }
        host: { type: string }
        path: { type: string }
        status: { type: integer }
        score: { type: integer }
        rules: { type: array, items: { type: string } }
        incident: { $ref: "#/components/schemas/IncidentNumber" }
        session_id: { type: string }
        site: { $ref: "#/components/schemas/WebsiteId", description: "The website the request Host resolves to (absent when none)." }
        would_block_reason: { $ref: "#/components/schemas/WouldBlockReason" }
        summary: { type: string, description: Short English summary for non-request events; the UI renders its own German text by type. }
    EventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EventSummary" } }
        next_cursor: { type: [string, "null"] }
        total_estimate: { type: integer, minimum: 0 }
    EventDetail:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { $ref: "../events.schema.json" }
        related: { type: array, items: { $ref: "#/components/schemas/EventSummary" }, description: Other events of the same session or IP in a short window. }

    Incident:
      description: >-
        A block with an incident number. A block is gateway-wide - the blocked address is blocked for every
        website on this gateway, whichever website it attacked (UI: "gilt für alle Websites auf diesem Server").
        Unblocking lifts it for all of them. A block an agent set carries block.set_by and is unblocked like
        any other.
      type: object
      additionalProperties: false
      required: [incident, status, time, request]
      properties:
        incident: { $ref: "#/components/schemas/IncidentNumber" }
        status: { type: string, enum: [blocked, unblocked] }
        time: { $ref: "#/components/schemas/Timestamp" }
        request: { $ref: "#/components/schemas/EventSummary" }
        reason: { type: string, description: Which rule(s) caused the block. }
        unblocked_at: { $ref: "#/components/schemas/NullableTimestamp" }
        allowlist_entry: { type: [string, "null"] }
        site: { $ref: "#/components/schemas/WebsiteId", description: "The website of the blocked request." }
        sites_affected: { $ref: "#/components/schemas/SitesAffected" }
        count: { type: integer, minimum: 1, description: "Blocked requests in this incident (aggregated per client, rule key and UTC minute, see IncidentNumber); request is the first of them. Absent = 1." }
        first_seen: { $ref: "#/components/schemas/Timestamp", description: "First request of an aggregated incident (equals time)." }
        last_seen: { $ref: "#/components/schemas/Timestamp", description: "Last request of an aggregated incident." }
        block:
          $ref: "#/components/schemas/BehaviourBlock"
          description: >-
            The timed block behind the incident when it is a behaviour or rate-limit
            block: source, until, ladder step (level), net class, duration_s from the ladder of that net class
            and persisted (kept in schild.db over a restart), so the UI says how long and why ("7 Tage, weil
            Rechenzentrum und wiederholt") without joining the block_long annotation. Absent for a single request
            the WAF blocked (no duration).
    UnblockRequest:
      type: object
      additionalProperties: false
      required: [false_positive]
      properties:
        false_positive: { type: boolean }
        allow_ip: { type: boolean, default: false }
        allow_ttl: { type: string, enum: [24h, 7d, 30d, never], default: 7d }
        note: { type: string, maxLength: 500 }

    RuleRepositoryId:
      description: "crs: OWASP CRS, built into the binary. crowdsec: CrowdSec Hub virtual patches (image snapshot plus updates). local: the operator's files in rules.d."
      type: string
      enum: [crs, crowdsec, local]
    RuleRepositoryState:
      description: "off: no rules, nothing fetched. detect: rules match and are logged, never block. block: matching requests are blocked (in the test profile RuleEffect would_block)."
      type: string
      enum: [off, detect, block]
    RuleEffect:
      description: "What a rule or repository does right now: off, detect (logged), would_block (logged, the test profile holds it back), block."
      type: string
      enum: [off, detect, would_block, block]
    RuleLimitedBy:
      description: >-
        Why the effect is lower than block. gateway_observe: the gateway runs the test profile. repository_detect: the
        repository is set to detect. settling: an update waits for settling_s.
      type: string
      enum: [gateway_observe, repository_detect, settling]
    RuleStatus:
      description: >-
        active. settling: an update waits for settling_s, then acts on its own (D89: no approvals). disabled:
        disabled_by says where.
      type: string
      enum: [active, settling, disabled]
    RuleOrigin:
      description: "release: ships with the image. update: received while the gateway runs. operator: the operator's own file."
      type: string
      enum: [release, update, operator]
    RuleId:
      description: "The SecRule id as a string; crowdsec: the base id of the hub rule (stable across updates), the hub name is name."
      type: string
      pattern: "^[1-9][0-9]{0,8}$"
    RuleTokenRef:
      type: object
      additionalProperties: false
      required: [token_id, label]
      properties:
        token_id: { $ref: "#/components/schemas/AgentTokenId" }
        label: { type: string, maxLength: 64 }
    RuleRepository:
      description: >-
        One rule repository: the shared fields and exactly one object of its own (crs, crowdsec or local). Nothing here
        is an error for the operator: without outgoing network the crowdsec image snapshot keeps working and
        update_state says so calmly.
      type: object
      additionalProperties: false
      required: [id, name, state, config_state, state_source, differs, effect, origin, counts]
      oneOf:
        - { required: [crs] }
        - { required: [crowdsec] }
        - { required: [local] }
      properties:
        id: { $ref: "#/components/schemas/RuleRepositoryId" }
        name: { type: string, maxLength: 64, description: "Display name: OWASP CRS, CrowdSec Hub, Eigene Regeln." }
        state: { $ref: "#/components/schemas/RuleRepositoryState" }
        config_state: { $ref: "#/components/schemas/RuleRepositoryState", description: "The value of schild.yaml (or its default: crs and local block, crowdsec detect)." }
        state_source: { type: string, enum: [default, config, dashboard, agent], description: "dashboard or agent: the settings overlay wins over schild.yaml; state_set_by names an agent's token." }
        state_set_at: { $ref: "#/components/schemas/Timestamp", description: "When the overlay value was set; only with state_source dashboard or agent." }
        state_set_by: { $ref: "#/components/schemas/RuleTokenRef", description: "Only with state_source agent." }
        differs: { type: boolean, description: "The overlay value and schild.yaml differ; the UI says so and offers reset_state." }
        effect: { $ref: "#/components/schemas/RuleEffect", description: "The state after the test profile." }
        limited_by: { type: string, enum: [gateway_observe], description: "Only when the test profile holds state block back." }
        origin: { type: string, enum: [built_in, remote, operator], description: "built_in: rules in the binary. remote: an image snapshot plus rules fetched while the gateway runs. operator: the operator's files." }
        counts:
          type: object
          additionalProperties: false
          required: [rules, disabled, settling, skipped]
          properties:
            rules: { type: integer, minimum: 0, description: "Rules that run or wait, disabled ones included." }
            disabled: { type: integer, minimum: 0 }
            settling: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0, description: "crowdsec: hub rules that did not load, with reasons in crowdsec.skipped." }
        last_change_at: { $ref: "#/components/schemas/NullableTimestamp", description: "When the rules last changed (update, reset, sync)." }
        licence: { type: string, maxLength: 32, description: "crs: Apache-2.0. crowdsec: MIT, the NOTICE ships with the rules. Absent for local." }
        crs: { $ref: "#/components/schemas/RuleRepositoryCRS" }
        crowdsec: { $ref: "#/components/schemas/RuleRepositoryCrowdsec" }
        local: { $ref: "#/components/schemas/RuleRepositoryLocal" }
    RuleRepositoryCRS:
      type: object
      additionalProperties: false
      required: [paranoia_level, inbound_anomaly_threshold, config_paranoia_level, config_inbound_anomaly_threshold, livewire_exception, version]
      properties:
        paranoia_level: { type: integer, minimum: 1, maximum: 4, description: "The level that runs: the value set in the dashboard, else config_paranoia_level." }
        inbound_anomaly_threshold: { type: integer, minimum: 1, maximum: 100, description: "The threshold that runs: the value set in the dashboard, else config_inbound_anomaly_threshold." }
        config_paranoia_level: { type: integer, minimum: 1, maximum: 4, description: "The value of schild.yaml (or its default 1). Differs from paranoia_level when the dashboard set one (D101)." }
        config_inbound_anomaly_threshold: { type: integer, minimum: 1, maximum: 100, description: "The value of schild.yaml (or its default 5). Differs from inbound_anomaly_threshold when the dashboard set one (D101)." }
        livewire_exception: { type: boolean }
        version: { type: string, maxLength: 32, description: "CRS version of the image." }
    RuleRepositoryCrowdsec:
      type: object
      additionalProperties: false
      required: [update_state, auto_update, settling_s, set_source, skipped]
      properties:
        update_state:
          type: string
          enum: [off, current, unreachable, refused, updates_off, pinned, pin_pending]
          description: >-
            off: the repository is off, nothing is fetched. current: the last check worked. unreachable: the last check
            got no answer (fetch_failed, fetch_status), the running set stays. refused: the last download failed a bound,
            the running set stays. updates_off: auto_update false. pinned: the set of the pin runs. pin_pending: a pin is
            set and its set is not running yet.
        auto_update: { type: boolean }
        interval_s: { type: integer, minimum: 300 }
        pin: { type: string, pattern: "^[0-9a-f]{40}$" }
        settling_s: { type: integer, minimum: 0 }
        set_source: { type: string, enum: [stored, image, none], description: "stored: the last good set; image: the snapshot shipped in the image; none: no rules run." }
        skipped:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [name, version, code]
            properties:
              name: { type: string, maxLength: 160 }
              version: { type: string, maxLength: 16 }
              code: { $ref: "#/components/schemas/CrowdsecHubSkipCode" }
        index_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "Identity of the running set." }
        hub_commit: { type: string, pattern: "^[0-9a-f]{40}$", description: "Only for a pinned set or the image snapshot; the master index names no commit." }
        last_check_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_change:
          type: object
          additionalProperties: false
          required: [added, changed, removed]
          properties:
            added: { type: integer, minimum: 0 }
            changed: { type: integer, minimum: 0 }
            removed: { type: integer, minimum: 0 }
        last_refusal:
          type: object
          additionalProperties: false
          required: [at, code]
          properties:
            at: { $ref: "#/components/schemas/Timestamp" }
            code: { $ref: "#/components/schemas/CrowdsecHubRefusalCode" }
        snapshot_at: { $ref: "#/components/schemas/Timestamp", description: "When the image snapshot was taken." }
        snapshot_age_days: { type: integer, minimum: 0 }
    RuleRepositoryLocal:
      type: object
      additionalProperties: false
      required: [dir, files]
      properties:
        dir: { type: string, maxLength: 512, description: "rules.local.dir." }
        files:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [name, rules]
            properties:
              name: { type: string, maxLength: 255 }
              rules: { type: integer, minimum: 0 }
        last_reload_at: { $ref: "#/components/schemas/NullableTimestamp", description: "The last sync that changed the rules (start included)." }
        last_error: { type: string, maxLength: 512, description: "Why the last sync was refused; absent after a sync that worked." }
    RuleRepositoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/RuleRepository" } }
    RuleException:
      type: object
      additionalProperties: false
      description: One exception as the agent API answers it (AgentException).
      required: [id, website, hosts, path, target, repository, rules, reason, set_by, token_id, token_label, created]
      properties:
        id: { type: integer, minimum: 1900000, maximum: 1999999 }
        website: { type: string, maxLength: 253 }
        hosts: { type: array, items: { type: string, maxLength: 253 } }
        path: { type: string, maxLength: 256, x-untrusted: true }
        target: { type: string, maxLength: 180, x-untrusted: true, description: "The field, e.g. ARGS:comment; * stands for one part of a name." }
        repository: { type: string, enum: [crs, crowdsec] }
        rules: { type: array, items: { $ref: "#/components/schemas/RuleId" } }
        reason: { type: string, maxLength: 300, x-untrusted: true }
        set_by: { type: string, enum: [agent, dashboard], description: "D84. dashboard: the operator set it, token_id and token_label are empty." }
        token_id: { type: string, maxLength: 64 }
        token_label: { type: string, maxLength: 64 }
        created: { $ref: "#/components/schemas/Timestamp" }
    RuleExceptionRequest:
      type: object
      additionalProperties: false
      description: The body of createAgentException (AgentExceptionRequest), field by field.
      required: [website, path, target, repository, rules, reason]
      properties:
        website: { $ref: "#/components/schemas/WebsiteId", description: "It needs hosts." }
        path: { type: string, maxLength: 256, pattern: "^/[A-Za-z0-9._~/{}-]{0,255}$", description: "Exact path, {name} for one segment." }
        target:
          type: string
          pattern: "^(ARGS|REQUEST_COOKIES|REQUEST_HEADERS):[A-Za-z0-9_.*\\[\\]-]{1,160}$"
          description: "One named value. * stands for one part of a name between dots. A whole collection is refused."
        repository: { type: string, enum: [crs, crowdsec] }
        rules: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { $ref: "#/components/schemas/RuleId" } }
        reason: { type: string, minLength: 1, maxLength: 300, description: "Why the exception is needed, for whoever reads the list later. No control characters." }
    RuleExceptionList:
      type: object
      additionalProperties: false
      required: [items, max]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RuleException" } }
        max: { type: integer, description: "How many exceptions a gateway keeps at most." }
    RuleRepositoryPatch:
      type: object
      additionalProperties: false
      description: "Exactly one of state and reset_state."
      oneOf:
        - { required: [state] }
        - { required: [reset_state] }
      properties:
        state: { $ref: "#/components/schemas/RuleRepositoryState" }
        reset_state: { const: true, description: "Drop the overlay value, whoever set it: schild.yaml counts again." }
    RuleRepositorySettingsPatch:
      type: object
      additionalProperties: false
      description: >-
        The values of the crs repository the dashboard sets (D101). A field left out falls back to schild.yaml or the
        built-in default; an empty object removes what the dashboard set.
      properties:
        paranoia_level: { type: integer, minimum: 1, maximum: 4 }
        inbound_anomaly_threshold: { type: integer, minimum: 1, maximum: 100 }
    Rule:
      description: "One rule of one repository. The CRS blocks by anomaly score: a CRS rule's effect is that of its repository."
      type: object
      required: [repository, id, origin, status, effect, hits_24h]
      properties:
        repository: { $ref: "#/components/schemas/RuleRepositoryId" }
        id: { $ref: "#/components/schemas/RuleId" }
        name: { type: string, maxLength: 160, description: "crowdsec: the hub name, the value of disabled_rules." }
        msg: { type: string, maxLength: 512, x-untrusted: true, description: "The rule's message: English CRS text, hub text or the operator's text." }
        version: { type: string, maxLength: 64, description: "crs: the CRS version. crowdsec: the hub version. local: 12 hex of the rule's text." }
        origin: { $ref: "#/components/schemas/RuleOrigin" }
        status: { $ref: "#/components/schemas/RuleStatus" }
        effect: { $ref: "#/components/schemas/RuleEffect" }
        limited_by: { $ref: "#/components/schemas/RuleLimitedBy" }
        disabled_by: { type: string, enum: [config, dashboard, agent], description: "Only with status disabled. config: only schild.yaml can change it." }
        hits_24h: { type: integer, minimum: 0 }
        match_share_24h: { type: number, minimum: 0, maximum: 1 }
        paranoia_level: { type: integer, minimum: 1, maximum: 4, description: "crs only." }
        crowdsec: { $ref: "#/components/schemas/CrowdsecRule", description: "crowdsec only. UI label: Regel aus dem CrowdSec Hub, MIT; no logo." }
    RulePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            allOf: [{ $ref: "#/components/schemas/Rule" }]
            unevaluatedProperties: false
        next_cursor: { type: [string, "null"] }
    RuleDecision:
      description: "A decision on a rule: who disabled it."
      type: object
      additionalProperties: false
      required: [kind, by]
      properties:
        kind: { type: string, enum: [disabled] }
        by: { type: string, enum: [config, dashboard, agent] }
        token: { $ref: "#/components/schemas/RuleTokenRef", description: "Only with by agent." }
        note: { type: string, maxLength: 500, x-untrusted: true }
        at: { $ref: "#/components/schemas/Timestamp", description: "Absent for config." }
    RuleDetail:
      allOf:
        - { $ref: "#/components/schemas/Rule" }
        - type: object
          properties:
            seclang: { type: string, maxLength: 65536, x-untrusted: true, description: "The SecLang that runs: every group of a crowdsec rule, the text of a local rule, the rule of the embedded CRS file with the rules chained to it (D82)." }
            file: { type: string, maxLength: 255, description: "local: the file of rules.d; crs: the file of the embedded CRS (D82)." }
            decisions: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/RuleDecision" } }
      unevaluatedProperties: false
    RulePatch:
      type: object
      additionalProperties: false
      required: [disabled]
      properties:
        disabled: { type: boolean }
        note: { type: string, maxLength: 500 }
    CrowdsecRule:
      description: "A rule of the CrowdSec Hub. label and description are third-party text: render as text."
      type: object
      additionalProperties: false
      required: [name, version, licence]
      properties:
        name: { type: string, maxLength: 160, description: "Hub name, e.g. crowdsecurity/vpatch-CVE-2026-1207." }
        version: { type: string, maxLength: 16 }
        licence: { const: MIT }
        label: { type: string, maxLength: 128, x-untrusted: true }
        description: { type: string, maxLength: 512, x-untrusted: true }
        cves: { type: array, maxItems: 16, items: { type: string, pattern: "^CVE-[0-9]{4}-[0-9]{4,8}$" } }
        cwes: { type: array, maxItems: 16, items: { type: string, pattern: "^CWE-[0-9]{1,6}$" } }
        attack: { type: array, maxItems: 16, items: { type: string, pattern: "^T[0-9]{4}(\\.[0-9]{3})?$" } }
        notes:
          type: array
          maxItems: 4
          description: "raw_body_partial: the rule inspects the raw body, which this engine offers for urlencoded and JSON bodies only (crowdsec-hub.md section 3)."
          items: { type: string, enum: [raw_body_partial] }
        first_seen: { $ref: "#/components/schemas/Timestamp" }
        changed_at: { $ref: "#/components/schemas/Timestamp" }
        settling_until: { $ref: "#/components/schemas/NullableTimestamp", description: "Only for an update that settles: when it acts on its own." }
    CrowdsecHubSkipCode:
      description: "Why one rule did not load; the rest of the set did (crowdsec-hub.md section 4)."
      type: string
      enum: [digest_mismatch, deprecated, bad_name, name_mismatch, rule_too_long, yaml, raw_seclang, external_data, unknown_key, no_rules, node_shape, too_many_groups, too_many_lines, too_many_variables, unsupported_zone, unsupported_transform, unsupported_match, missing_value, value_chars, not_numeric, count_without_variable, selector, headers_without_name, forbidden_header, regex, catch_all, subset, id_collision, regex_cost, compile_failed]
    CrowdsecHubRefusalCode:
      description: "Why a whole update was refused; the running set stayed (crowdsec-hub.md section 6)."
      type: string
      enum: [fetch_failed, fetch_status, index_oversize, index_malformed, too_many_rules, set_too_large, set_empty, shrink, compile_failed, compile_timeout, set_too_costly]
    AllowlistEntry:
      type: object
      additionalProperties: false
      required: [id, label, level, expires, created_at]
      properties:
        id: { type: string }
        ip: { type: string }
        cidr: { type: string }
        host: { type: string }
        resolved: { type: array, items: { type: string }, description: Current addresses of a DynDNS host. }
        label: { type: string }
        level: { type: string, enum: [no_block, bypass_waf] }
        expires: { oneOf: [{ const: never }, { $ref: "#/components/schemas/Timestamp" }] }
        expired: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        source: { type: string, enum: [config, dashboard, cli] }
    AllowlistPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AllowlistEntry" } }
        next_cursor: { type: [string, "null"] }
    AllowlistInput:
      type: object
      additionalProperties: false
      required: [label, level]
      properties:
        ip: { type: string }
        cidr: { type: string }
        host: { type: string }
        label: { type: string, minLength: 1, maxLength: 64 }
        level: { type: string, enum: [no_block, bypass_waf] }
        ttl: { type: string, enum: [24h, 7d, 30d, never], default: never }
        confirm_bypass: { type: boolean, description: Required for bypass_waf (the WAF is skipped completely for this sender). }
      oneOf:
        - { required: [ip] }
        - { required: [cidr] }
        - { required: [host] }
    MyIP:
      type: object
      additionalProperties: false
      required: [ip, attribution, allowlisted]
      properties:
        ip: { type: string }
        attribution: { type: string, enum: [tcp_peer, trusted_proxy, localhost] }
        allowlisted: { type: boolean }
    AllowMineRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 64 }
        ttl: { type: string, enum: [24h, 7d, 30d, never], default: 7d }

    Settings:
      type: object
      additionalProperties: false
      required: [profile, retention]
      properties:
        profile: { type: string, enum: [production, test] }
        retention:
          type: object
          additionalProperties: false
          required: [raw_ip_days, events_days, max_size_mb, summaries_days]
          properties:
            raw_ip_days: { type: integer, minimum: 1, maximum: 30 }
            events_days: { type: integer, minimum: 1, maximum: 90 }
            max_size_mb: { type: integer, minimum: 10 }
            summaries_days: { type: integer, minimum: 1, maximum: 730 }
    SettingsPatch:
      type: object
      additionalProperties: false
      properties:
        retention:
          type: object
          additionalProperties: false
          properties:
            raw_ip_days: { type: integer, minimum: 1, maximum: 30 }
            events_days: { type: integer, minimum: 1, maximum: 90 }
            summaries_days: { type: integer, minimum: 1, maximum: 730 }

    PrivacySummary:
      type: object
      additionalProperties: false
      required: [ip, events, first_seen, last_seen, allowlisted]
      properties:
        ip: { type: string }
        events: { type: integer, minimum: 0 }
        sessions: { type: integer, minimum: 0 }
        incidents: { type: array, items: { $ref: "#/components/schemas/IncidentNumber" } }
        first_seen: { $ref: "#/components/schemas/NullableTimestamp" }
        last_seen: { $ref: "#/components/schemas/NullableTimestamp" }
        ip_truncated_after: { $ref: "#/components/schemas/NullableTimestamp" }
        allowlisted: { type: boolean }
    PrivacyRequest:
      type: object
      additionalProperties: false
      required: [ip]
      properties:
        ip: { type: string, maxLength: 64 }
    IncidentExport:
      type: object
      additionalProperties: false
      required: [incident, exported_at, events, truncated]
      properties:
        incident: { $ref: "#/components/schemas/Incident" }
        exported_at: { $ref: "#/components/schemas/Timestamp" }
        events: { type: array, maxItems: 1000, description: "The stored events of this incident, oldest first.", items: { $ref: "../events.schema.json" } }
        truncated: { type: boolean, description: "More than 1000 events." }
        context: { $ref: "#/components/schemas/RequestContext", description: "Absent with monitoring.requests off. State expired when the context is gone." }
    PrivacyExport:
      type: object
      additionalProperties: false
      required: [ip, exported_at, events]
      properties:
        ip: { type: string }
        exported_at: { $ref: "#/components/schemas/Timestamp" }
        events: { type: array, items: { $ref: "../events.schema.json" } }
        requests: { type: array, description: "The requests of this address in the ring, pinned context included, newest first, at most 10000.", items: { $ref: "#/components/schemas/RequestRecord" } }
    PrivacyDeleteRequest:
      type: object
      additionalProperties: false
      required: [ip, confirm]
      properties:
        ip: { type: string, maxLength: 64 }
        confirm: { const: true }
        keep_incidents: { type: boolean, default: false }
    PrivacyDeleteResult:
      type: object
      additionalProperties: false
      required: [ip, deleted_events, deleted_sessions]
      properties:
        ip: { type: string }
        deleted_events: { type: integer, minimum: 0 }
        deleted_sessions: { type: integer, minimum: 0 }
        deleted_allowlist_entries: { type: integer, minimum: 0 }
        erased_requests: { type: integer, minimum: 0, description: "Records of the ring whose address was overwritten." }
        nodes:
          type: object
          additionalProperties: false
          required: [reached, open]
          description: >-
            In a group (contracts/cluster.md): how far the erasure got when this answer was written, at most 2 s after
            the erasure on this node. Absent on a single gateway. A node under `open` erases when it reaches the group
            again; the erasure waits for it for 31 days.
          properties:
            reached: { type: array, maxItems: 16, items: { type: string, maxLength: 63 }, description: "Names of the gateways that hold the erasure, this node first." }
            open: { type: array, maxItems: 16, items: { type: string, maxLength: 63 }, description: "Names of the gateways that have not said yet that they hold it: away or slow." }

    # ---- group of gateways (contracts/cluster.md, D105)
    GroupStatus:
      type: object
      additionalProperties: false
      required: [mode]
      description: >-
        The mode this gateway runs in. `single`: alone; without `state` the gateway has no `cluster.enabled` and no
        other field is set. `group`: a node of a group, with everything below as this node sees it.
      properties:
        mode: { type: string, enum: [single, group] }
        state:
          type: string
          enum: [no_group, syncing, active, degraded, interrupted, removed]
          description: >-
            Absent without `cluster.enabled`. no_group (mode single): kept for clients; a gateway of this version does
            not answer it, since with `cluster.enabled` a node that cannot be set up or cannot run does not start
            (contracts/cluster.md section 6). syncing: the node has not taken the state
            of the group since its start. active: it is in step with every gateway. degraded: at least one gateway is
            not reached, at least one is. interrupted: no other gateway is reached; the node serves with the state it
            has. removed: a member said this node was removed; it serves with the state it has and shares nothing.
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        group: { type: string, pattern: "^g-[0-9a-f]{32}$" }
        node: { $ref: "#/components/schemas/GroupNode" }
        members:
          type: array
          maxItems: 64
          description: "Gateways first, then removed members; each by name. This node is one of them."
          items: { $ref: "#/components/schemas/GroupMember" }
        shared:
          type: object
          additionalProperties: false
          required: [blocks, settings, access, logins]
          description: "What this node holds of the group's state."
          properties:
            blocks: { type: integer, minimum: 0, description: "Address blocks of the group that run." }
            settings: { type: integer, minimum: 0, description: "Things of class settings (contracts/cluster.md section 5)." }
            access: { type: integer, minimum: 0, description: "Lists of who passes: allowlist, released senders, disabled rules." }
            logins: { type: integer, minimum: 0, description: "Lists of who signs in: users, sessions, agent tokens." }
        counters:
          type: object
          additionalProperties: false
          required: [taken, refused, deferred, unread]
          description: "Records of other nodes since the start of this node."
          properties:
            taken: { type: integer, minimum: 0 }
            refused: { type: integer, minimum: 0, description: "Failed signature, schema or membership; never applied." }
            deferred: { type: integer, minimum: 0, description: "Put off and asked for again: clock ahead, or an origin not known yet." }
            unread: { type: integer, minimum: 0, description: "Of a newer version; kept and passed on unread." }
        replaced: { type: integer, minimum: 0, description: "Values this node gave up for the group's at its first sync; kept on the node." }
        config:
          type: object
          additionalProperties: false
          required: [version, differing]
          description: >-
            A hint, nothing is distributed: every gateway tells the others the version of its configuration (SHA-256
            over schild.yaml without node_name, cluster.listen and cluster.advertise, and over rules.d).
          properties:
            version: { type: string, pattern: "^[0-9a-f]{12}$", description: "Start of this node's config version." }
            differing: { type: array, maxItems: 16, items: { type: string, maxLength: 63 }, description: "Names of the gateways whose config version differs from this node's." }
    GroupNode:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id: { type: string, pattern: "^n-[0-9a-f]{32}$" }
        name: { type: string, maxLength: 63 }
        role: { type: string, enum: [gateway] }
    GroupMember:
      type: object
      additionalProperties: false
      required: [id, name, role, state]
      properties:
        id: { type: string, pattern: "^n-[0-9a-f]{32}$" }
        name: { type: string, maxLength: 63 }
        role: { type: string, enum: [gateway] }
        address: { type: string, maxLength: 64, description: "Address of the mesh listener." }
        state:
          type: string
          enum: [self, ok, unreachable, no_contact, removed]
          description: >-
            self: this node. ok: reached within the last 15 s.
            unreachable: the last call to it failed. no_contact: no call to it succeeded yet, or none for 15 s.
            removed: its membership was ended.
        last_out: { $ref: "#/components/schemas/Timestamp", description: "Last call of this node to the member that succeeded." }
        last_in: { $ref: "#/components/schemas/Timestamp", description: "Last call of the member to this node." }
        behind: { type: integer, minimum: 0, description: "Records the member has that this node lacks, at the last call." }
        version: { type: string, maxLength: 128, description: "The schild version the member told; absent until it did." }
        config: { type: string, enum: [same, differs, unknown], description: "Its config version against this node's; unknown until it told one, or when the last word is older than a minute." }
        error: { type: string, maxLength: 300, description: "Why the last call failed, in one line." }
        vitals: { $ref: "#/components/schemas/GroupVitals" }
        shared_state:
          type: object
          additionalProperties: false
          required: [blocks, settings, access, logins]
          description: >-
            Not for this node: per class whether what is in force on the member is what is in force on
            this node, by the keyed hashes the gateways tell each other every 5 s, each with the point of the state it
            was computed at (contracts/cluster.md section 14). Hashes are compared only at the same point, so a change
            on its way is never a difference. same: equal at the last point both were at, within the last minute.
            differs: different at the same point (what is in force differs although both hold the same records), or
            different records at the same vector for 10 s. unknown: the member is not reached, told no hash lately,
            runs a build that tells no points, or the two were at no common point for a minute (changes without a
            pause, or a member that is behind).
          properties:
            blocks: { $ref: "#/components/schemas/GroupSameState" }
            settings: { $ref: "#/components/schemas/GroupSameState" }
            access: { $ref: "#/components/schemas/GroupSameState" }
            logins: { $ref: "#/components/schemas/GroupSameState" }
        clock_skew_ms: { type: integer, description: "The member's clock minus this node's in milliseconds, as of its last word within the last minute (the time on the way counts in). Absent when it named no time. From 10 000 on the dashboard names it; a record more than 60 s ahead is refused (contracts/cluster.md section 4)." }
    GroupSameState: { type: string, enum: [same, differs, unknown] }
    GroupVitals:
      type: object
      additionalProperties: false
      required: [at, service, requests_per_s, stopped_share, latency_p95_ms, cpu_usage, memory_used_ratio, disk_used_ratio]
      description: >-
        How the member said it is doing, as it told this node within the last 20 s (this node: read
        now). Absent when it said nothing lately or runs a build that tells no vitals. A value outside its range is null.
        Shown, never decided on.
      properties:
        at: { $ref: "#/components/schemas/Timestamp", description: "When this node was told." }
        service:
          type: string
          enum: [ready, draining, not_ready]
          description: >-
            What the member answers the balancer on /.schild/readyz. ready: 200. draining: it leaves traffic
            (`schild cluster drain` or a stop). not_ready: it has not taken the state of the group yet, or its rules
            are not loaded.
        started_at: { $ref: "#/components/schemas/Timestamp", description: "Start of the member's schild process." }
        requests_per_s: { type: number, minimum: 0, description: "Requests per second over its last 60 s." }
        stopped_share: { $ref: "#/components/schemas/NullableRatio" }
        latency_p95_ms: { $ref: "#/components/schemas/NullableMs" }
        cpu_usage: { $ref: "#/components/schemas/NullableRatio" }
        memory_used_ratio: { $ref: "#/components/schemas/NullableRatio" }
        disk_used_ratio: { $ref: "#/components/schemas/NullableRatio", description: "The fullest shown mount." }

    # ---- server check and agents (contracts/host-check.md)
    HostId:
      description: "`local` is the gateway itself; agents have their agent id."
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    AgentId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    HostStatus:
      description: "ok: no open finding above info. findings: open findings. silent: an agent did not report within twice its interval (\"meldet sich nicht\"); never affects request handling or baseline protection. waiting: enrolled, no report yet. revoked: agent revoked, old reports only."
      type: string
      enum: [ok, findings, silent, waiting, revoked]
    Severity: { type: string, enum: [info, low, medium, high, critical] }
    SeverityCounts:
      description: Open findings (status finding) by severity.
      type: object
      additionalProperties: false
      required: [critical, high, medium, low, info]
      properties:
        critical: { type: integer, minimum: 0 }
        high: { type: integer, minimum: 0 }
        medium: { type: integer, minimum: 0 }
        low: { type: integer, minimum: 0 }
        info: { type: integer, minimum: 0 }
    ServersSummary:
      description: "Optional: the compact Server card of the overview. Absent when host_check is not configured, and until the first host has reported (D100)."
      type: object
      additionalProperties: false
      required: [hosts, findings, silent, unreadable]
      properties:
        hosts: { type: integer, minimum: 0 }
        findings: { $ref: "#/components/schemas/SeverityCounts" }
        silent: { type: integer, minimum: 0, description: Agents not reporting. }
        unreadable: { type: integer, minimum: 0, description: "Checks that could not read safely, over all hosts." }
        pending_agents: { type: integer, minimum: 0 }
    HostSummary:
      type: object
      additionalProperties: false
      required: [id, hostname, role, status, silent, last_report_at, counts, accepted, unreadable, os]
      properties:
        id: { $ref: "#/components/schemas/HostId" }
        hostname: { type: string, maxLength: 253 }
        role: { type: string, enum: [gateway, agent] }
        agent_id: { oneOf: [{ $ref: "#/components/schemas/AgentId" }, { type: "null" }] }
        status: { $ref: "#/components/schemas/HostStatus" }
        silent: { type: boolean, description: "Agent missed twice its interval (\"meldet sich nicht\")." }
        last_report_at: { $ref: "#/components/schemas/NullableTimestamp", description: run.started_at of the newest report. }
        received_at: { $ref: "#/components/schemas/NullableTimestamp", description: When the gateway stored the newest report. }
        interval_minutes: { type: [integer, "null"], minimum: 1, description: Expected report interval (agents and the local timer). }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        counts: { $ref: "#/components/schemas/SeverityCounts", description: "Open findings of the newest report without the accepted ones (D102)." }
        accepted: { type: integer, minimum: 0, description: "Findings of the newest report that are accepted and therefore not in counts (D102)." }
        unreadable: { type: integer, minimum: 0, description: Checks of the newest report that were not readable. }
        os:
          type: [object, "null"]
          additionalProperties: false
          required: [name, eol]
          properties:
            name: { type: string, maxLength: 128 }
            eol: { type: [string, "null"], pattern: "^20[0-9]{2}-[0-9]{2}-[0-9]{2}$" }
    HostPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HostSummary" } }
        next_cursor: { type: [string, "null"] }
    HostReportRef:
      type: object
      additionalProperties: false
      required: [report_id, started_at, received_at, counts]
      properties:
        report_id: { $ref: "../common.schema.json#/$defs/uuid" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        received_at: { $ref: "#/components/schemas/Timestamp" }
        counts: { $ref: "#/components/schemas/SeverityCounts" }
    HostDetail:
      type: object
      additionalProperties: false
      required: [host, report, history, accepted]
      properties:
        host: { $ref: "#/components/schemas/HostSummary" }
        accepted: { type: array, maxItems: 200, description: "Accepted findings of this host (D102), newest first. The counts of the newest report in `history` leave them out, the counts of older reports are as stored.", items: { $ref: "#/components/schemas/AcceptedFinding" } }
        report:
          description: The newest host report exactly as stored (schild.host_report/0.1); null before the first report.
          oneOf:
            - { $ref: "../host-report.schema.json" }
            - { type: "null" }
        history: { type: array, maxItems: 365, description: "Kept reports, newest first (host_check.keep_reports). The newest is `report`.", items: { $ref: "#/components/schemas/HostReportRef" } }
        last_rejected: { type: [object, "null"], additionalProperties: false, required: [at, code], properties: { at: { $ref: "#/components/schemas/Timestamp" }, code: { type: string }, detail: { type: string, maxLength: 300, description: "Value-free: the contract code and, when known, the JSON pointer of the offending place (\"schema at /report/findings/3/evidence/value\"); never a value from the rejected message." } }, description: Newest delivery of this agent the gateway rejected (contract code). }
        annotations:
          description: >-
            Agent hosts only (absent for the local host). One entry per
            finding of `report`, in the same order. title and explanation come from the gateway's own
            catalogue keyed by finding id (null when this gateway does not know the id); fix_verified is
            true only when the finding's fix_command is one the gateway's own check produces for that id.
            title, explanation and fix_command inside an agent's `report` are free text of the agent: the
            dashboard shows them marked as reported by the agent and offers copying only for verified
            fix commands.
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/FindingAnnotation" }
    FindingAnnotation:
      type: object
      additionalProperties: false
      required: [id, subject, title, explanation, fix_verified]
      properties:
        id: { type: string, pattern: "^[a-z]+\\.[a-z_]+$", maxLength: 64 }
        subject: { type: [string, "null"], maxLength: 128 }
        title: { type: [string, "null"], maxLength: 120 }
        explanation: { type: [string, "null"], maxLength: 600 }
        fix_verified: { type: boolean }
    FindingRef:
      description: "A finding of a host by its check id and subject (null or absent: the check has one result)."
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, pattern: "^[a-z]+\\.[a-z_]+$", maxLength: 64 }
        subject: { type: [string, "null"], minLength: 1, maxLength: 128 }
    FindingAccept:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, pattern: "^[a-z]+\\.[a-z_]+$", maxLength: 64 }
        subject: { type: [string, "null"], minLength: 1, maxLength: 128 }
        note: { type: string, maxLength: 200, description: "Why it is accepted (one line), e.g. a firewall in front of the server. Stays on this gateway." }
    AcceptedFinding:
      type: object
      additionalProperties: false
      required: [id, subject, severity, note, accepted_at, active]
      properties:
        id: { type: string, pattern: "^[a-z]+\\.[a-z_]+$", maxLength: 64 }
        subject: { type: [string, "null"], maxLength: 128 }
        severity: { $ref: "#/components/schemas/Severity", description: "Severity of the finding when it was accepted. A later report with a higher severity is open again." }
        note: { type: [string, "null"], maxLength: 200 }
        accepted_at: { $ref: "#/components/schemas/Timestamp" }
        active: { type: boolean, description: "true: the newest report holds this finding at this severity or lower, and it is left out of counts. false: the finding is gone or came back higher." }
    LocalCheckRun:
      type: object
      additionalProperties: false
      required: [requested_at, state]
      properties:
        requested_at: { $ref: "#/components/schemas/Timestamp" }
        state: { type: string, enum: [queued, running] }
    AgentStatus:
      description: "pending: key received with a valid code, waits for confirmation. enrolled: reports are accepted. revoked: on the revocation list."
      type: string
      enum: [pending, enrolled, revoked]
    Agent:
      type: object
      additionalProperties: false
      required: [id, hostname, keyid, fingerprint, status, source, created_at]
      properties:
        id: { $ref: "#/components/schemas/AgentId" }
        hostname: { type: string, maxLength: 253 }
        label: { type: [string, "null"], maxLength: 64 }
        keyid: { $ref: "../common.schema.json#/$defs/keyid" }
        fingerprint: { $ref: "../common.schema.json#/$defs/sha256", description: "sha256 of the 32 public key bytes; `schild agent enrol` prints the same value." }
        status: { $ref: "#/components/schemas/AgentStatus" }
        source: { type: string, enum: [code, config], description: "code: one-time enrolment code; config: host_check.agents.keys in schild.yaml." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        confirmed_at: { $ref: "#/components/schemas/NullableTimestamp" }
        revoked_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_report_at: { $ref: "#/components/schemas/NullableTimestamp" }
        silent: { type: boolean }
    AgentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        next_cursor: { type: [string, "null"] }
    EnrolmentInput:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 64, description: Shown with the agent once it enrols. }
        ttl_minutes: { type: integer, minimum: 5, maximum: 1440, description: Defaults to host_check.agents.enrolment_code_minutes. }
    Enrolment:
      type: object
      additionalProperties: false
      required: [code, expires_at, command, gateway_url, gateway_name, gateway_pin]
      properties:
        code: { type: string, pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$", description: "One-time code, valid once until expires_at." }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        label: { type: [string, "null"], maxLength: 64 }
        gateway_url: { type: string, maxLength: 512, description: "Agent endpoint of this gateway (https://<host>:8790)." }
        gateway_name: { $ref: "../common.schema.json#/$defs/id", description: "The gateway's node_name: every enrolment request and agent report names it (`gateway`, else `channel`). The URL host is not enough behind NAT or a proxy." }
        gateway_pin: { $ref: "../common.schema.json#/$defs/sha256", description: sha256 of the gateway's agent TLS certificate (DER); the agent pins it. }
        command: { type: string, maxLength: 1024, description: "One line for the app VM, e.g. `sudo schild agent enrol --gateway <url> --gateway-name <gateway_name> --pin <pin> --code <code>`." }
    AgentConfirm:
      type: object
      additionalProperties: false
      required: [fingerprint]
      properties:
        fingerprint: { $ref: "../common.schema.json#/$defs/sha256", description: The fingerprint the admin compared; must equal the agent's (409 `fingerprint_mismatch`). }
        label: { type: string, minLength: 1, maxLength: 64 }
    AgentRevoke:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 500 }

    # ---- behaviour across requests and rate limits (local only)
    ScenarioId: { type: string, enum: [login_bruteforce, credential_stuffing, path_probing, aggressive_crawl, waf_repeat] }
    RunningBlock:
      type: object
      additionalProperties: false
      description: "One address block that runs (D87). client is the key schild blocks: an IPv4 address or an IPv6 /64."
      required: [client, source, since, until, duration_s, level, net_class, incident, kept, firewall]
      properties:
        client: { type: string, maxLength: 43, description: "IPv4 address, or IPv6 prefix /64." }
        source: { type: string, enum: [scenario, agent, dashboard], description: "scenario: a behaviour scenario set it (scenario names which); agent: a token of the agent API (token_id); dashboard: the operator by hand (D88)." }
        scenario: { $ref: "#/components/schemas/ScenarioId" }
        token_id: { type: string, maxLength: 64 }
        since: { $ref: "#/components/schemas/Timestamp" }
        until: { $ref: "#/components/schemas/Timestamp" }
        duration_s: { type: integer, minimum: 1 }
        level: { type: integer, minimum: 1, description: "Step of the ladder (1: first block of this client)." }
        net_class: { type: string, maxLength: 32 }
        incident: { type: string, maxLength: 9, description: "Incident number of the block page; ends the block with unblockIncident. Empty when none is known." }
        kept: { type: boolean, description: "Kept in schild.db (blocks over 24 h), survives a restart." }
        node: { type: string, maxLength: 63, description: "In a group: name of the node that decided the block (contracts/cluster.md, class incident_blocks). Absent on a single gateway and while the group does not know the block yet." }
        node_self: { type: boolean, description: "With node: true when this node decided the block. Nodes of one deployment may carry the same name." }
        firewall: { type: string, enum: [off, stale, pending, banned], description: "off: no firewall has called; stale: its last call is older than 2 minutes, or it reports an error; pending: it has not applied this block yet; banned: the nftables table inet schild holds the client." }
    BlockRequest:
      type: object
      additionalProperties: false
      required: [address, duration_s, reason]
      description: "A block by hand (D88)."
      properties:
        address: { type: string, maxLength: 45, description: "One IPv4 or IPv6 address; an IPv6 address blocks its /64. No network, no host name." }
        duration_s: { type: integer, enum: [3600, 86400, 604800] }
        reason: { type: string, minLength: 1, maxLength: 300, description: "Why, in one line; shown with the incident." }
        shared_ok: { type: boolean, default: false, description: "Block a mobile, CGNAT or Tor address anyway, knowing it hits everyone behind it." }
    BlockList:
      type: object
      additionalProperties: false
      required: [generated_at, items, total, firewall]
      properties:
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/RunningBlock" } }
        total: { type: integer, minimum: 0, description: "Blocks that run, also beyond the first 500." }
        firewall:
          type: object
          additionalProperties: false
          required: [state, table]
          description: "The handoff to the host's firewall as a whole (D87): what `schild firewall run` said in its last call."
          properties:
            state: { type: string, enum: [off, stale, ok, error] }
            table: { type: string, maxLength: 64, description: "The nftables table, inet schild." }
            synced_at: { $ref: "#/components/schemas/NullableTimestamp", description: "Time of the firewall's last call." }
            banned: { type: integer, minimum: 0, description: "Clients the table holds." }
            error: { type: string, maxLength: 300, x-untrusted: true, description: "The firewall's last failure in one line." }
    BehaviourMode: { type: string, enum: [off, observe, block], description: "D92: no challenge, schild has no browser check. Hits of old events with challenge show observe." }
    BehaviourAction: { type: string, enum: [observe, block] }
    BehaviourHitKind: { type: string, enum: [scenario, rate_limit] }
    BehaviourPreset: { type: string, enum: [wordpress, joomla, drupal, nextcloud, typo3, laravel, generic] }
    BehaviourReason:
      type: string
      enum: [net_class, allowlisted, released, unverified_bot, site_scope, learning]
      description: "Why the action stayed below the mode (events.schema.json behaviourReason, without challenge_unavailable of old events, D92). learning: a scenario in block observes during the learning period; scenarios only, rate limits act from day 0."
    LimitMode: { type: string, enum: [off, observe, block] }
    BehaviourHit:
      type: object
      additionalProperties: false
      required: [id, time, kind, count, threshold, window_s, mode, action, active, released]
      description: "One hit. The UI explains it in plain German from these fields, e.g. \"37 falsche Anmeldungen in 2 Minuten an wp-login.php von 198.51.100.7\"."
      properties:
        id: { $ref: "../common.schema.json#/$defs/uuid", description: Id of the local event. }
        time: { $ref: "#/components/schemas/Timestamp" }
        kind: { $ref: "#/components/schemas/BehaviourHitKind" }
        scenario: { $ref: "#/components/schemas/ScenarioId" }
        scope: { type: string, enum: [client, site] }
        limit_id: { type: string, maxLength: 64 }
        limit_label: { type: string, maxLength: 64 }
        ip: { type: string, description: Full visitor IP (local only); missing for site-wide hits. }
        key_bits: { type: integer, enum: [24, 32, 64] }
        geo: { $ref: "#/components/schemas/Geo" }
        host: { type: string }
        route: { type: string }
        preset: { $ref: "#/components/schemas/BehaviourPreset" }
        count: { type: integer, minimum: 0 }
        threshold: { type: integer, minimum: 1 }
        window_s: { type: integer, minimum: 1 }
        per_s: { type: integer, minimum: 1, description: Rate limits only. }
        mode: { type: string, enum: [observe, block] }
        action: { $ref: "#/components/schemas/BehaviourAction" }
        would_action: { $ref: "#/components/schemas/BehaviourAction" }
        reason: { $ref: "#/components/schemas/BehaviourReason" }
        level: { type: integer, minimum: 1 }
        duration_s: { type: integer, minimum: 1, maximum: 604800, description: "Ladder step of level for the client's net class (geo.net_class)." }
        until: { $ref: "#/components/schemas/NullableTimestamp" }
        incident: { $ref: "#/components/schemas/IncidentNumber" }
        active: { type: boolean, description: The block of this hit is still running. }
        released: { type: boolean, description: The operator released this client after the hit. }
    BehaviourHitPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BehaviourHit" } }
        next_cursor: { type: [string, "null"] }
    BehaviourBlock:
      type: object
      additionalProperties: false
      required: [source, until, level]
      description: >-
        A running HTTP-level block of one client key. Gateway-wide - it applies to every website on this
        gateway, not only the one that triggered it. The duration comes from the ladder of
        the client's net class; the UI says how long and why, e.g. "7 Tage, weil Rechenzentrum und wiederholt" (level >= 4,
        net_class hosting) or "15 Minuten, erster Verstoß".
      properties:
        source: { type: string, description: "behaviour:<scenario>, ratelimit:<id>, agent:<token id> or (D88) dashboard" }
        until: { $ref: "#/components/schemas/Timestamp" }
        level: { type: integer, minimum: 1 }
        net_class: { $ref: "../common.schema.json#/$defs/netClass" }
        duration_s: { type: integer, minimum: 1, maximum: 604800 }
        persisted: { type: boolean, description: "Kept in schild.db (blocks over 24 h): a restart does not end it." }
        ended_at: { $ref: "#/components/schemas/Timestamp", description: "Set once the block is no longer in force: until when it ran out, the time it was lifted (unblock), or the time of the schild start that ended a block not kept across restarts (persisted false). Absent while it runs. Clients show a block as running exactly when ended_at is absent and never compare until with their own clock." }
        incident: { $ref: "#/components/schemas/IncidentNumber" }
        set_by: { $ref: "#/components/schemas/BlockSetBy" }
        agent_reason: { type: string, maxLength: 300, x-untrusted: true, description: "Why the agent set this block, only with set_by. Text from an agent, which may have read visitor text: render as text." }
    BlockSetBy:
      description: >-
        The agent token that set a block. Present exactly on blocks an agent set (source agent:<token id>);
        the UI marks them "Von Agent <label> gesetzt". Stored with the block, so the name stays after the token is
        revoked. level is 1 on these blocks: an agent chooses the duration, the ladder does not.
      type: object
      additionalProperties: false
      required: [token_id, token_label]
      properties:
        token_id: { $ref: "#/components/schemas/AgentTokenId" }
        token_label: { type: string, minLength: 1, maxLength: 64 }
    BehaviourHitDetail:
      type: object
      additionalProperties: false
      required: [hit, requests, blocks]
      properties:
        hit: { $ref: "#/components/schemas/BehaviourHit" }
        requests: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/EventSummary" }, description: Recent stored requests of this IP around the hit. }
        blocks: { type: array, items: { $ref: "#/components/schemas/BehaviourBlock" }, description: Blocks of this client key that run now. }
        allowlisted: { type: boolean }
    ScenarioThresholds:
      type: object
      additionalProperties: false
      required: [count, window_s]
      properties:
        count: { type: integer, minimum: 1 }
        window_s: { type: integer, minimum: 1 }
        slow_count: { type: integer, minimum: 1 }
        slow_window_s: { type: integer, minimum: 1 }
        baseline_factor: { type: number, minimum: 1 }
    ScenarioSetting:
      type: object
      additionalProperties: false
      required: [id, mode, effective_mode, recommended, thresholds, defaults, hits_24h, would_block_24h, blocks_active]
      properties:
        id: { $ref: "#/components/schemas/ScenarioId" }
        mode: { $ref: "#/components/schemas/BehaviourMode" }
        effective_mode: { $ref: "#/components/schemas/BehaviourMode", description: "observe in the test profile, else mode." }
        recommended: { $ref: "#/components/schemas/BehaviourMode", description: "D92: the recommended mode, also the default when schild.yaml sets none. block for login_bruteforce, credential_stuffing, path_probing and waf_repeat, observe for aggressive_crawl." }
        thresholds: { $ref: "#/components/schemas/ScenarioThresholds" }
        defaults: { $ref: "#/components/schemas/ScenarioThresholds" }
        hits_24h: { type: integer, minimum: 0 }
        would_block_24h: { type: integer, minimum: 0, description: Hits in observe that block mode would have blocked. }
        blocks_active: { type: integer, minimum: 0 }
    BehaviourSettings:
      type: object
      additionalProperties: false
      required: [scenarios, presets, block_steps_s, block_cap_s, learning_until]
      properties:
        scenarios: { type: array, items: { $ref: "#/components/schemas/ScenarioSetting" } }
        presets: { type: array, items: { $ref: "#/components/schemas/BehaviourPreset" } }
        block_steps_s: { type: array, items: { type: integer, minimum: 1 }, description: "Block durations of the ladder for repeat offenders (every net class but hosting): 900, 3600, 14400, 86400." }
        block_cap_s: { type: integer, maximum: 86400 }
        hosting_block_steps_s: { type: array, items: { type: integer, minimum: 1 }, description: "Ladder for data-centre addresses (net_class hosting): 900, 3600, 86400, 604800." }
        hosting_block_cap_s: { type: integer, maximum: 604800, description: "7 days for repeat offenders from data centres; blocks over 24 h survive a restart." }
        installed_at: { $ref: "#/components/schemas/NullableTimestamp" }
        learning_until: { $ref: "#/components/schemas/NullableTimestamp", description: "D94: end of the learning period of this installation, as in DistributedSettings. Before it a scenario on block only records what it would have blocked (ScenarioSetting.effective_mode does not show that); limits act from the first day. Null when the first start is unknown (keeps learning)." }
    BehaviourSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        scenarios:
          type: object
          additionalProperties: false
          properties:
            login_bruteforce: { $ref: "#/components/schemas/BehaviourMode" }
            credential_stuffing: { $ref: "#/components/schemas/BehaviourMode" }
            path_probing: { $ref: "#/components/schemas/BehaviourMode" }
            aggressive_crawl: { $ref: "#/components/schemas/BehaviourMode" }
            waf_repeat: { $ref: "#/components/schemas/BehaviourMode" }
        thresholds:
          type: object
          additionalProperties: false
          description: "D93: thresholds per scenario. Each entry replaces what the dashboard set for that scenario before."
          properties:
            login_bruteforce: { $ref: "#/components/schemas/ScenarioThresholdsPatch" }
            credential_stuffing: { $ref: "#/components/schemas/ScenarioThresholdsPatch" }
            path_probing: { $ref: "#/components/schemas/ScenarioThresholdsPatch" }
            aggressive_crawl: { $ref: "#/components/schemas/ScenarioThresholdsPatch" }
            waf_repeat: { $ref: "#/components/schemas/ScenarioThresholdsPatch" }
        preset_limit_modes:
          type: object
          maxProperties: 128
          description: "D95: the mode of preset limits by id (RateLimit.id with source preset), written to behaviour.preset_limit_modes. An id that is no preset limit answers 400 with the pointer /preset_limit_modes/<id>."
          additionalProperties: { $ref: "#/components/schemas/LimitMode" }
    ScenarioThresholdsPatch:
      type: object
      additionalProperties: false
      description: "D93: the thresholds of one scenario, validated like behaviour.scenarios.<id>.thresholds of schild.yaml. A field left out falls back to schild.yaml or the built-in default (ScenarioSetting.defaults); an empty object removes everything the dashboard set. aggressive_crawl takes count from 10 and window_s from 10 to 3600. A refused value answers 400 with the pointer /thresholds/<id>/<field>."
      properties:
        count: { type: integer, minimum: 2, maximum: 100000 }
        window_s: { type: integer, minimum: 1, maximum: 86400 }
        slow_count: { type: integer, minimum: 2, maximum: 100000, description: login_bruteforce only. }
        slow_window_s: { type: integer, minimum: 60, maximum: 86400, description: login_bruteforce only. }
        baseline_factor: { type: number, minimum: 2, maximum: 1000, description: aggressive_crawl only. }
    RateLimitDraft:
      type: object
      additionalProperties: false
      required: [route, limit, per]
      properties:
        route: { type: string, minLength: 1, maxLength: 256, description: "Path pattern; `*` within one segment, `**` across segments." }
        methods: { type: array, maxItems: 7, items: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS] } }
        limit: { type: integer, minimum: 1, maximum: 100000 }
        per: { type: string, pattern: "^(([1-9]|[1-5][0-9])[sm]|([1-9]|1[0-9]|2[0-4])h)$" }
        burst: { type: integer, minimum: 1, maximum: 100000 }
        site: { type: string, maxLength: 253 }
    RateLimitInput:
      type: object
      additionalProperties: false
      required: [route, limit, per]
      properties:
        route: { type: string, minLength: 1, maxLength: 256 }
        methods: { type: array, maxItems: 7, items: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS] } }
        limit: { type: integer, minimum: 1, maximum: 100000 }
        per: { type: string, pattern: "^(([1-9]|[1-5][0-9])[sm]|([1-9]|1[0-9]|2[0-4])h)$" }
        burst: { type: integer, minimum: 1, maximum: 100000 }
        mode: { $ref: "#/components/schemas/LimitMode" }
        site: { type: string, maxLength: 253 }
        label: { type: string, minLength: 1, maxLength: 64 }
        confirm_site_wide: { type: boolean }
    RateLimitDryRun:
      type: object
      additionalProperties: false
      required: [window_h, requests, would_limit, clients, sampled]
      properties:
        window_h: { type: integer, minimum: 1 }
        requests: { type: integer, minimum: 0, description: Stored requests that match the route. }
        would_limit: { type: integer, minimum: 0, description: Of these, requests over the limit. }
        clients: { type: integer, minimum: 0, description: Client keys that would have been limited. }
        sampled: { type: boolean, description: Unremarkable requests are stored as a sample, so the counts are a lower bound. }
    RateLimit:
      type: object
      additionalProperties: false
      required: [id, route, limit, per, burst, mode, source, matched_24h, exceeded_24h, clients_24h]
      properties:
        id: { $ref: "../common.schema.json#/$defs/id" }
        label: { type: string, maxLength: 64 }
        route: { type: string }
        methods: { type: array, items: { type: string } }
        limit: { type: integer, minimum: 1 }
        per: { type: string }
        burst: { type: integer, minimum: 1 }
        mode: { $ref: "#/components/schemas/LimitMode" }
        site: { type: string }
        preset: { $ref: "#/components/schemas/BehaviourPreset", description: "The system whose route this is; generic for a route several systems share (D95)." }
        recommended: { $ref: "#/components/schemas/LimitMode", description: "D95, preset limits only: the recommended mode, also the default when schild.yaml sets none. block for login, password reset and xmlrpc, observe for search, contact forms and API writes." }
        confirm_site_wide: { type: boolean }
        source: { type: string, enum: [preset, config, dashboard] }
        matched_24h: { type: integer, minimum: 0, description: "D96: requests that fell under the limit in the last 24 h, over it or not; 0 for a limit that is off. Shows whether the route exists on this server at all." }
        exceeded_24h: { type: integer, minimum: 0, description: Requests over the limit in the last 24 h (in observe "hätte begrenzt"). }
        clients_24h: { type: integer, minimum: 0 }
    RateLimitPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RateLimit" } }
        next_cursor: { type: [string, "null"] }
    ReleaseRequest:
      type: object
      additionalProperties: false
      required: [ip]
      properties:
        ip: { type: string, maxLength: 64 }
        scenario: { $ref: "#/components/schemas/ScenarioId", description: "With allow exception: the exception covers only this scenario." }
        limit_id: { type: string, maxLength: 64, description: "With allow exception: the exception covers only this rate limit." }
        allow: { type: string, enum: [none, exception, permanent], default: none, description: "none: end blocks and reset counters; exception: plus a narrow exception for ttl; permanent: plus an allowlist entry (\"dauerhaft erlauben\")." }
        ttl: { type: string, enum: [24h, 7d, 30d], default: 7d }
        label: { type: string, minLength: 1, maxLength: 64 }
    ReleaseResult:
      type: object
      additionalProperties: false
      required: [ip, blocks_ended]
      properties:
        ip: { type: string }
        blocks_ended: { type: integer, minimum: 0 }
        exception_until: { $ref: "#/components/schemas/NullableTimestamp" }
        exception_sources: { type: array, items: { type: string } }
        allowlist_entry: { type: [string, "null"] }

    # ---- distributed attacks (address-free)
    DetectorId: { type: string, enum: [route_wave, account_wave, shape_wave, fingerprint_cluster, inconsistency] }
    DistributedMode: { type: string, enum: [off, observe, respond] }
    Wave:
      type: object
      additionalProperties: false
      required: [id, time, detector, route, senders, count, threshold, window_s, response, mode, action, active]
      description: "One wave. The UI explains it in plain German, e.g. \"Verteilter Login-Angriff: 380 Adressen, gleicher Fingerabdruck. Login 20 Minuten nur eingeschränkt.\""
      properties:
        id: { $ref: "../common.schema.json#/$defs/uuid", description: Wave id. }
        time: { $ref: "#/components/schemas/Timestamp" }
        detector: { $ref: "#/components/schemas/DetectorId" }
        host: { type: string }
        route: { type: string }
        senders: { type: integer, minimum: 0, description: Estimated distinct client keys in the window. }
        count: { type: integer, minimum: 0, description: "What triggered: route_wave failures on the route in window_s; inconsistency failed attempts with contradicting headers; account_wave failures on one account; fingerprint_cluster and shape_wave distinct senders." }
        threshold: { type: integer, minimum: 1 }
        window_s: { type: integer, minimum: 1 }
        baseline: { type: number, minimum: 0 }
        fingerprint: { type: string, pattern: "^[0-9a-f]{12}$" }
        fingerprint_kind: { type: string, enum: [ja4, headers] }
        user_agents: { type: integer, minimum: 0 }
        request_sig: { type: string }
        waf_rules: { type: array, items: { type: integer } }
        response: { type: string, enum: [route_tighten, account_slowdown, shape_block] }
        mode: { type: string, enum: [observe, respond] }
        action: { type: string, enum: [observe, respond] }
        reason: { type: string, enum: [learning, gateway_observe] }
        until: { $ref: "#/components/schemas/NullableTimestamp" }
        active: { type: boolean, description: The response is running now. }
        ended_at: { $ref: "#/components/schemas/NullableTimestamp" }
        end_reason: { type: string, enum: [expired, operator] }
        stopped: { type: integer, minimum: 0, description: Requests answered with 429 or 403 by the response so far. }
        suggest_second_factor: { type: boolean, description: "A login is attacked: suggest passkeys or two-factor login for the app." }
    WavePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Wave" } }
        next_cursor: { type: [string, "null"] }
    WaveDetail:
      type: object
      additionalProperties: false
      required: [wave, requests]
      properties:
        wave: { $ref: "#/components/schemas/Wave" }
        requests: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/EventSummary" }, description: Recent stored requests on the attacked route (local, with addresses like any event). }
    DetectorThresholds:
      type: object
      additionalProperties: false
      required: [count, window_s]
      properties:
        count: { type: integer, minimum: 1 }
        window_s: { type: integer, minimum: 1 }
        factor: { type: number, minimum: 1 }
    DetectorSetting:
      type: object
      additionalProperties: false
      required: [id, mode, effective_mode, thresholds, defaults, waves_24h]
      properties:
        id: { $ref: "#/components/schemas/DetectorId" }
        mode: { $ref: "#/components/schemas/DistributedMode" }
        effective_mode: { $ref: "#/components/schemas/DistributedMode", description: "observe while learning or while the gateway observes." }
        thresholds: { $ref: "#/components/schemas/DetectorThresholds" }
        defaults: { $ref: "#/components/schemas/DetectorThresholds" }
        waves_24h: { type: integer, minimum: 0 }
    DistributedSettings:
      type: object
      additionalProperties: false
      required: [detectors, learning_days, learning_until, gateway_observe, route_tighten, account_slowdown, fingerprint_kind]
      properties:
        detectors: { type: array, items: { $ref: "#/components/schemas/DetectorSetting" } }
        learning_days: { type: integer, minimum: 14 }
        learning_until: { $ref: "#/components/schemas/NullableTimestamp", description: "End of the learning period of this installation (first start + learning_days); before it no detector responds. Null when the first start is unknown (keeps learning)." }
        gateway_observe: { type: boolean }
        route_tighten:
          type: object
          additionalProperties: false
          required: [minutes, max_minutes, limit_per_minute]
          properties:
            minutes: { type: integer, minimum: 1, maximum: 120 }
            max_minutes: { type: integer, minimum: 1, maximum: 120 }
            limit_per_minute: { type: integer, minimum: 1 }
        account_slowdown:
          type: object
          additionalProperties: false
          required: [start_s, max_s]
          properties:
            start_s: { type: integer, minimum: 1 }
            max_s: { type: integer, minimum: 1, maximum: 300 }
        routes: { type: array, items: { type: string } }
        fingerprint_kind: { type: string, enum: [ja4, headers], description: "ja4 when a JA4 header of a trusted TLS terminator is configured, else the low-entropy header set." }
    DistributedSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        detectors:
          type: object
          additionalProperties: false
          properties:
            route_wave: { $ref: "#/components/schemas/DistributedMode" }
            account_wave: { $ref: "#/components/schemas/DistributedMode" }
            shape_wave: { $ref: "#/components/schemas/DistributedMode" }
            fingerprint_cluster: { $ref: "#/components/schemas/DistributedMode" }
            inconsistency: { $ref: "#/components/schemas/DistributedMode" }
        thresholds:
          type: object
          additionalProperties: false
          description: "D97: thresholds per detector. Each entry replaces what the dashboard set for that detector before."
          properties:
            route_wave: { $ref: "#/components/schemas/DetectorThresholdsPatch" }
            account_wave: { $ref: "#/components/schemas/DetectorThresholdsPatch" }
            shape_wave: { $ref: "#/components/schemas/DetectorThresholdsPatch" }
            fingerprint_cluster: { $ref: "#/components/schemas/DetectorThresholdsPatch" }
            inconsistency: { $ref: "#/components/schemas/DetectorThresholdsPatch" }
    DetectorThresholdsPatch:
      type: object
      additionalProperties: false
      description: "D97: the thresholds of one detector, validated like behaviour.distributed.detectors.<id>.thresholds of schild.yaml. A field left out falls back to schild.yaml or the built-in default (DetectorSetting.defaults); an empty object removes everything the dashboard set. A refused value answers 400 with the pointer /thresholds/<id>/<field>."
      properties:
        count: { type: integer, minimum: 3, maximum: 100000 }
        window_s: { type: integer, minimum: 30, maximum: 3600 }
        factor: { type: number, minimum: 2, maximum: 1000, description: route_wave only. }

    # ---------------------------------------------------------------- monitoring
    Ratio: { type: number, minimum: 0, maximum: 1 }
    NullableRatio: { type: [number, "null"], minimum: 0, maximum: 1 }
    NullableMs: { type: [number, "null"], minimum: 0 }
    Resolution:
      description: "The three fixed rings: 10 s (default 6 h), 1 min (default 48 h), 10 min (default 14 d); kept as configured in monitoring.keep."
      type: string
      enum: [10s, 1m, 10m]
    MetricId:
      description: >-
        Fixed metric ids (getMetricCatalogue describes each). traffic.* count every request that reaches
        the schild handler (proxy mode, ingress mode and schild front; not the health paths, not sites listed in
        ingress.unprotected_sites, not requests Caddy refuses before the handler). Invariant per bucket:
        requests = forwarded + stopped + fail_closed; stopped = blocked_waf + blocked_behaviour + rate_limited +
        rejected_limit + challenged + blocked_crawler. traffic.clients_unique and traffic.clients_new are visitors: distinct clients with a browser request schild forwarded (contract/monitoring.Visitor); bots,
        tools, requests without User-Agent and likely automated clients are in MetricBucket clients.bots instead.
        server.* are host values, container.* cgroup values of schild's own container,
        process.* the schild process, schild.* its internal queues and stores.
      type: string
      enum:
        - traffic.requests
        - traffic.forwarded
        - traffic.stopped
        - traffic.blocked_waf
        - traffic.blocked_behaviour
        - traffic.rate_limited
        - traffic.rejected_limit
        - traffic.challenged
        - traffic.fail_closed
        - traffic.fail_closed_waf_busy
        - traffic.fail_closed_waf_timeout
        - traffic.would_block
        - traffic.would_rate_limit
        - traffic.page_views
        - traffic.detections
        - traffic.waiting_page_shown
        - traffic.blocked_crawler
        - traffic.status_1xx
        - traffic.status_2xx
        - traffic.status_3xx
        - traffic.status_4xx
        - traffic.status_5xx
        - traffic.upstream_errors
        - traffic.upstream_timeouts
        - traffic.bytes_in
        - traffic.bytes_out
        - traffic.latency_total
        - traffic.latency_overhead
        - traffic.latency_upstream
        - traffic.clients_unique
        - traffic.clients_new
        - server.cpu_usage
        - server.cpu_iowait
        - server.cpu_steal
        - server.load1
        - server.load5
        - server.load15
        - server.memory_used
        - server.memory_available
        - server.swap_used
        - server.disk_used
        - server.disk_used_ratio
        - server.disk_inodes_used_ratio
        - server.disk_read_bytes
        - server.disk_write_bytes
        - server.disk_busy
        - server.net_rx_bytes
        - server.net_tx_bytes
        - server.net_errors
        - server.net_drops
        - server.tcp_established
        - server.tcp_syn_recv
        - server.tcp_time_wait
        - server.tcp_close_wait
        - server.tcp_listen_drops
        - server.tcp_retransmits
        - server.conntrack_used_ratio
        - server.files_open_ratio
        - container.cpu_usage
        - container.cpu_throttled
        - container.memory_used
        - process.cpu_usage
        - process.rss
        - process.heap
        - process.goroutines
        - process.gc_pause_p99
        - process.open_files
        - schild.event_queue_fill
        - schild.events_dropped
        - schild.eval_slots_used
        - schild.store_bytes
        - schild.sampler_ms
    MetricStat:
      description: "rate: per second over the step (counters; over the seconds the step actually covers - the current bucket up to now, a bucket after a restart from the start - never the full step for a partial bucket); sum: total per step (counters); avg/min/max: of the 10 s samples in the step (gauges); p50/p95/p99: from the merged histogram (histograms); value: the estimate for the step (estimates)."
      type: string
      enum: [rate, sum, avg, min, max, p50, p95, p99, value]
    MetricKind: { type: string, enum: [counter, gauge, histogram, estimate] }
    MetricUnit: { type: string, enum: [requests, bytes, ms, ratio, count, packets, segments, clients] }
    MetricScope: { type: string, enum: [traffic, host, container, process, schild] }
    MetricQuery:
      type: string
      maxLength: 64
      pattern: "^(traffic|server|container|process|schild)\\.[a-z0-9_]{1,40}(:(rate|sum|avg|min|max|p50|p95|p99|value))?$"
    MetricObject:
      description: "Mount point (per mount metrics), block device name (I/O) or interface name. Local names only, never an address."
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.:@/-]{1,128}$"
    UnavailableReason:
      description: "not_linux: no /proc (development on macOS); host_off: monitoring.host false; container_hidden: not visible from this container (e.g. conntrack or host interfaces without network_mode host); no_permission: file not readable; not_present: kernel or module does not provide it (e.g. nf_conntrack not loaded); cgroup_v1: only cgroup v2 is read for limits."
      type: string
      enum: [not_linux, host_off, container_hidden, no_permission, not_present, cgroup_v1]
    MetricInfo:
      type: object
      additionalProperties: false
      required: [id, kind, unit, scope, exact, stats, default_stat, per_object, site_aware, available]
      properties:
        id: { $ref: "#/components/schemas/MetricId" }
        kind: { $ref: "#/components/schemas/MetricKind" }
        unit: { $ref: "#/components/schemas/MetricUnit" }
        scope: { $ref: "#/components/schemas/MetricScope" }
        exact: { type: boolean, description: "true: counted from every request or read from a kernel counter; false: an estimate with error_bound." }
        error_bound: { type: number, minimum: 0, description: "Relative error bound of an estimate (0.25 for latency quantiles: the upper bucket bound; 0.033 for client counts)." }
        stats: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/MetricStat" } }
        default_stat: { $ref: "#/components/schemas/MetricStat" }
        per_object: { type: string, enum: [none, mount, device, interface] }
        site_aware: { type: boolean, description: "Accepts the site filter (traffic metrics)." }
        available: { type: boolean }
        reason: { $ref: "#/components/schemas/UnavailableReason" }
    RingInfo:
      type: object
      additionalProperties: false
      required: [resolution, step_s, keep_s, slots]
      properties:
        resolution: { $ref: "#/components/schemas/Resolution" }
        step_s: { type: integer, enum: [10, 60, 600] }
        keep_s: { type: integer, minimum: 3600 }
        slots: { type: integer, minimum: 1, maximum: 12960 }
        oldest: { $ref: "#/components/schemas/NullableTimestamp" }
    MetricCatalogue:
      type: object
      additionalProperties: false
      required: [resolutions, max_points, max_series, metrics]
      properties:
        resolutions: { type: array, minItems: 3, maxItems: 3, items: { $ref: "#/components/schemas/RingInfo" } }
        max_points: { const: 1000 }
        max_series: { const: 16 }
        metrics: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/MetricInfo" } }
    MetricSeries:
      type: object
      additionalProperties: false
      required: [metric, stat, kind, unit, exact, values]
      properties:
        metric: { $ref: "#/components/schemas/MetricId" }
        stat: { $ref: "#/components/schemas/MetricStat" }
        kind: { $ref: "#/components/schemas/MetricKind" }
        unit: { $ref: "#/components/schemas/MetricUnit" }
        exact: { type: boolean }
        error_bound: { type: number, minimum: 0 }
        object: { $ref: "#/components/schemas/MetricObject" }
        values:
          description: "One value per step from `from`; null = no data for that step."
          type: array
          maxItems: 1000
          items: { type: [number, "null"] }
    ClusterScope:
      type: object
      additionalProperties: false
      required: [node, nodes, partial_nodes, clients_at_least]
      description: >-
        In a group of gateways: which nodes the numbers of an answer cover (contracts/cluster.md section 9a). Absent
        on a single gateway. Every gateway keeps the metric buckets of every other gateway and asks for new ones every
        10 s, so the numbers of another node end up to that long, plus the step of the ring, before the present.
      properties:
        node: { type: string, pattern: "^(all|n-[0-9a-f]{32})$", description: "all, or the id of the one node asked for." }
        nodes:
          type: array
          maxItems: 33
          description: "The nodes whose numbers the answer holds: this gateway first when it is among them, then the others by id."
          items: { $ref: "#/components/schemas/ClusterNode" }
        partial_nodes:
          type: array
          maxItems: 32
          description: >-
            Nodes of `nodes` whose history on this gateway ends before the span of the answer does: they were not
            reached, or they were down. From `until` on the answer lacks their part, so its sums are lower bounds.
          items: { $ref: "#/components/schemas/ClusterPartialNode" }
        clients_at_least:
          type: boolean
          description: >-
            true when the answer adds up several nodes. Counters, latency histograms and top lists add. Estimates of
            distinct clients (visitors, unique and new clients) do not, because a visitor may have reached several
            nodes: the answer carries the largest estimate of the nodes, a lower bound of the group's (UI "mindestens").
            Gauges and host values (CPU, memory, disk, network) are never added: an answer over several nodes carries
            those of this gateway, ask for one node to see another's.
    ClusterNode:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, pattern: "^n-[0-9a-f]{32}$" }
        name: { type: string, maxLength: 63 }
        self: { type: boolean, description: "This gateway." }
    ClusterPartialNode:
      type: object
      additionalProperties: false
      required: [node, name]
      properties:
        node: { type: string, pattern: "^n-[0-9a-f]{32}$" }
        name: { type: string, maxLength: 63 }
        until: { $ref: "#/components/schemas/Timestamp", description: "End of what this gateway holds of the node; absent: nothing yet." }
    SeriesResult:
      type: object
      additionalProperties: false
      required: [from, to, resolution, step_s, points, series, restarts]
      properties:
        cluster: { $ref: "#/components/schemas/ClusterScope" }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        resolution: { $ref: "#/components/schemas/Resolution" }
        step_s: { type: integer, enum: [10, 60, 600, 1800, 3600, 10800, 21600, 43200, 86400], description: "Seconds per point: the ring step times buckets_per_point." }
        buckets_per_point:
          type: integer
          enum: [1, 3, 6, 18, 36, 72, 144]
          description: >-
            Ring buckets merged into one point (absent = 1). resolution auto over the coarsest ring merges
            instead of answering too_many_points (contract/monitoring Plan): 14 days at 10 min become 672 points of
            30 min. Counters and histograms merge exactly, gauges as avg of averages, min of minima, max of maxima,
            estimates as the mean per ring step.
        points: { type: integer, minimum: 1, maximum: 1000 }
        partial:
          type: array
          maxItems: 1000
          items: { type: boolean }
          description: >-
            One flag per point, true when the point is not a complete step (the current bucket, a bucket with
            a schild start or a skipped sample); the chart draws it dashed. Absent: no partial point.
        filters: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/FilterExpr" }, description: "The filters applied (traffic.requests, stopped, would_block and detections only)." }
        source: { type: string, enum: [rings, requests], description: "Requests when a filter was answered from the request ring." }
        site: { $ref: "#/components/schemas/WebsiteId" }
        series: { type: array, maxItems: 128, items: { $ref: "#/components/schemas/MetricSeries" } }
        restarts: { type: array, maxItems: 100, description: "schild starts within the range (partial buckets, counters restart).", items: { $ref: "#/components/schemas/Timestamp" } }
    StatusClasses:
      type: object
      additionalProperties: false
      required: [s1xx, s2xx, s3xx, s4xx, s5xx]
      properties:
        s1xx: { type: integer, minimum: 0 }
        s2xx: { type: integer, minimum: 0 }
        s3xx: { type: integer, minimum: 0 }
        s4xx: { type: integer, minimum: 0 }
        s5xx: { type: integer, minimum: 0 }
    TrafficCounters:
      description: >-
        Exact counts of one interval (a second, a bucket). requests = forwarded + stopped + fail_closed;
        stopped = blocked_waf + blocked_behaviour + rate_limited + rejected_limit + challenged + blocked_crawler. would_block and
        would_rate_limit are forwarded requests that a stricter mode would have stopped. status counts the status sent
        to the client (schild's own answers included). upstream_errors: the proxy got no response (connection refused or
        reset, 502); upstream_timeouts: the backend did not answer in time (504). bytes_in/bytes_out: request and
        response body bytes (exact; headers, TLS and HTTP/2 framing excluded - the wire total is server.net_*).
        page_views and detections, both exact, with the invariants
        page_views <= forwarded, page_views <= status.s2xx and blocked_waf <= detections <= blocked_waf + would_block.
        Optional waiting_page_shown <= fail_closed_by.waf_busy + fail_closed_by.waf_timeout +
        fail_closed_by.body_busy.
        One HTTP request counts once in every counter, also when schild evaluated it more
        than once (e.g. again in handle_errors); optional rechecked <= requests counts those requests.
      type: object
      additionalProperties: false
      required: [requests, forwarded, stopped, blocked_waf, blocked_behaviour, rate_limited, rejected_limit, challenged, fail_closed, fail_closed_by, would_block, would_rate_limit, page_views, detections, status, upstream_errors, upstream_timeouts, bytes_in, bytes_out]
      properties:
        requests: { type: integer, minimum: 0 }
        forwarded: { type: integer, minimum: 0 }
        stopped: { type: integer, minimum: 0 }
        blocked_waf: { type: integer, minimum: 0, description: "403 from CRS, local or CrowdSec Hub rules (incl. shape_block)." }
        blocked_behaviour: { type: integer, minimum: 0, description: "403 from a running behaviour block." }
        rate_limited: { type: integer, minimum: 0, description: "429 from rate limits, route_tighten and account_slowdown." }
        rejected_limit: { type: integer, minimum: 0, description: "400/413/415 from hard limits (body size, encoding, arguments, JSON depth, multipart); also 429 body_client_share, 429 body_waiting_share and a client_gone abort; neither is a rate limit (contracts/body-limits.md)." }
        challenged: { type: integer, minimum: 0, description: "Reserved, always 0: schild has no browser check (D92)." }
        blocked_crawler: { type: integer, minimum: 0, description: "Optional, absent = 0: 403 from the crawler policy of a website (a crawler that names itself, or an impersonator). No incident." }
        fail_closed: { type: integer, minimum: 0, description: "503 from schild: the request could not be inspected and was never passed." }
        fail_closed_by:
          type: object
          additionalProperties: false
          required: [waf_timeout, waf_busy, not_ready, panic]
          properties:
            waf_timeout: { type: integer, minimum: 0 }
            waf_busy: { type: integer, minimum: 0, description: "No free evaluation slot within the queue wait (saturation)." }
            not_ready: { type: integer, minimum: 0 }
            panic: { type: integer, minimum: 0 }
            body_busy: { type: integer, minimum: 0, description: "Optional, absent = 0: a body was refused because the gateway-wide body limits are full, or the client of a shared address (cgnat, mobile, tor) is over its share. contracts/body-limits.md." }
        would_block: { type: integer, minimum: 0 }
        would_rate_limit: { type: integer, minimum: 0 }
        page_views:
          type: integer
          minimum: 0
          description: >-
            Forwarded GET requests answered 2xx that ask for a document (Sec-Fetch-Dest: document,
            or without Sec-Fetch-Dest an Accept header naming text/html) from a client that is not a bot or tool (bot
            category likely_browser). Assets, API calls, prefetches, bots and tools are no page views.
        detections:
          type: integer
          minimum: 0
          description: >-
            Requests on which the WAF (CRS, local or CrowdSec Hub rules) reached its blocking decision,
            enforced (also in blocked_waf) or in observe (also in would_block). Behaviour and rate limit decisions are no
            detections. Per path template and per rule id in MetricBucket.top (path, rule).
        waiting_page_shown:
          type: integer
          minimum: 0
          description: >-
            Optional, absent = 0: an overlay of fail_closed, the fail-closed 503s answered
            with the waiting page (document navigations with reason waf_busy, waf_timeout or body_busy while
            waiting_page.enabled; contracts/waiting-page.md). Invariant: waiting_page_shown <= fail_closed_by.waf_busy +
            fail_closed_by.waf_timeout + fail_closed_by.body_busy.
            Metric id traffic.waiting_page_shown, Prometheus schild_http_waiting_page_shown_total.
        rechecked:
          type: integer
          minimum: 0
          description: >-
            Optional, absent = 0: an overlay of requests, the requests schild
            evaluated more than once (the site block's schild, then schild in handle_errors after the URI changed, e.g. a
            handle_path prefix strip). Each counts once in requests, in exactly one class (the combined outcome of
            contract/monitoring.Recheck: the last evaluation's stop, else would_block when any evaluation was
            would_block, else passed), once in detections, breakdowns, top lists, visitors and the request ring, and
            writes one event with checked_paths. Invariant: rechecked <= requests.
        status: { $ref: "#/components/schemas/StatusClasses" }
        upstream_errors: { type: integer, minimum: 0 }
        upstream_timeouts: { type: integer, minimum: 0 }
        bytes_in: { type: integer, minimum: 0 }
        bytes_out: { type: integer, minimum: 0 }
    LatencyHistogram:
      description: >-
        Sparse histogram in milliseconds. Bucket i (0..56) counts values <= 0.05 * 1.25^i ms (above the
        previous bound); bucket 57 counts everything above 0.05 * 1.25^56 ms (about 13.9 s). Quantiles report the upper
        bound of their bucket, so they are at most 25 % above the true value. Requests answered with 101 or as an event
        stream are counted but not timed.
      type: object
      additionalProperties: false
      required: [scheme, counts]
      properties:
        scheme: { const: "exp1.25-0.05ms" }
        counts:
          type: object
          maxProperties: 58
          propertyNames: { pattern: "^([0-9]|[1-4][0-9]|5[0-7])$" }
          additionalProperties: { type: integer, minimum: 1 }
    BreakdownDimension:
      description: >-
        path (path template), country, asn, net_class, ua_class (UAClass), method, status_class, site, referrer
        (ReferrerKey), browser (BrowserFamily), os
        (OSFamily), device (DeviceClass), bot_category (BotCategory, from the user agent) and rule (rule ids; items count
        the detections in which the rule matched). ip (client address, IPv4 dotted or IPv6 compressed) and
        user_agent (the User-Agent as stored, cut at 512 bytes; requests without one are in other), from the
        request ring only.
      type: string
      enum: [path, country, asn, net_class, ua_class, method, status_class, site, referrer, browser, os, device, bot_category, rule, ip, user_agent]
    UAClass:
      description: "browser: a browser user agent that claims no bot; bot_verified: a bot whose address the gateway verified (published address ranges of its operator, optionally FCrDNS), 0 while bot verification is off (TrafficBreakdown.bot_verification false); bot_unverified: claims to be a bot or crawler, not verified; tool: HTTP libraries and command line tools (curl, wget, python-requests, Go-http-client, ...); none: no User-Agent; other: anything else."
      type: string
      enum: [browser, bot_verified, bot_unverified, tool, none, other]
    BrowserFamily:
      description: "Browser family from the User-Agent, no versions. samsung = Samsung Internet; other = a browser not listed; none = no browser (bots, tools, no User-Agent)."
      type: string
      enum: [chrome, edge, firefox, safari, opera, samsung, ie, other, none]
    OSFamily:
      description: "Operating system family from the User-Agent, no versions (iPadOS reports itself as macos or ios). none = no operating system named (bots, tools, no User-Agent)."
      type: string
      enum: [windows, macos, ios, android, linux, chromeos, other, none]
    DeviceClass:
      description: "Device class from the User-Agent (client hints are never requested). unknown for bots, tools and user agents without a device hint."
      type: string
      enum: [desktop, mobile, tablet, other, unknown]
    BotCategory:
      description: >-
        The first eleven values are the categories of
        bot-catalogue.schema.json (UI: Suchmaschine, KI-Training, KI-Suche, KI-Assistent, Vorschau/Social, Feed-Reader,
        Monitoring, SEO-Werkzeug, Archiv/Forschung, Sicherheitsscanner, Werkzeug/Bibliothek). likely_automated
        ("Wahrscheinlich automatisiert"): no catalogue entry matches and the user agent is no browser (empty, generic bot,
        crawler or spider tokens, HTTP libraries not in the catalogue). likely_browser ("Wahrscheinlich Browser"):
        everything else. The category comes from the user agent; whether the address belongs to the claimed operator is
        the verification state, not the category.
      type: string
      enum: [search_engine, ai_training, ai_search, ai_assistant, preview_social, feed_reader, monitoring, seo_tool, archive_research, security_scanner, tool_library, likely_automated, likely_browser]
    ReferrerKey:
      description: >-
        Where a request came from, derived from the Referer header (never stored or returned in
        full). _direct: no Referer; _intern: the request's own host or its registrable domain, or a host of any website of this gateway, protected or not - an exact or wildcard host of a website
        (contract/websites Set.OwnHost, vectors website-derive own_hosts; proxy mode: upstream.site_hosts), never
        through the host-less catch-all - so a visitor moving from one app to another on the same gateway is internal,
        not a referral; ai:<assistant>: a known AI
        assistant with all of its hosts grouped (contract/monitoring AIAssistants, e.g. ai:chatgpt for chatgpt.com and
        chat.openai.com); _other: an unparsable Referer, an IP address as host or a host without a registrable domain
        (localhost, a bare public suffix); otherwise the registrable domain (public suffix plus one label, lower case,
        punycode), e.g. google.com or example.co.uk. No path, query, port or further subdomain is kept, and never an IP
        address (the last label starts with a letter).
      type: string
      maxLength: 253
      pattern: "^(_direct|_intern|_other|ai:[a-z0-9][a-z0-9-]{0,31}|([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?)$"
    TopEntry:
      type: object
      additionalProperties: false
      required: [key, requests, stopped, would_block, error]
      properties:
        key: { type: string, maxLength: 512, description: "Path template, ISO country (ZZ unknown), AS number as decimal string, net_class, UAClass, method (OTHER for unknown), status class (2xx), site id, ReferrerKey, BrowserFamily, OSFamily, DeviceClass, BotCategory, rule id, client address or User-Agent. A gateway may cut longer keys below this limit at a UTF-8 boundary, ending them with \"…\" (informative: the gateway cuts at 128 bytes including the marker, gateway/internal/monitoring MaxTopKeyBytes, to bound metrics.db); keys that agree up to the cut count as one entry. Cut keys are valid keys. The metrics.db size bound as a function of the website count is documented in gateway/README.md (Size of metrics.db, monitoring.MetricsBoundBytes)." }
        label: { type: string, maxLength: 256, description: "AS organisation for asn; the assistant's name for a referrer ai:<assistant> (e.g. ChatGPT); absent otherwise. Cut like key." }
        requests: { type: integer, minimum: 0, description: "Requests of this entry; for rule: the detections in which the rule matched." }
        stopped: { type: integer, minimum: 0 }
        would_block: { type: integer, minimum: 0 }
        detections: { type: integer, minimum: 0, description: "Path entries only: detections on this path template (TrafficCounters.detections), so the alert rate of a page is detections / requests. Absent = 0." }
        error: { type: integer, minimum: 0, description: "Maximum overcount of requests for estimated lists (path, asn, referrer, rule); 0 when exact." }
    BreakdownCounts:
      type: object
      additionalProperties: false
      required: [requests, stopped, would_block]
      properties:
        requests: { type: integer, minimum: 0 }
        stopped: { type: integer, minimum: 0 }
        would_block: { type: integer, minimum: 0 }
    TrafficBreakdown:
      type: object
      additionalProperties: false
      required: [by, from, to, resolution, exact, total, items, other]
      properties:
        cluster: { $ref: "#/components/schemas/ClusterScope" }
        by: { $ref: "#/components/schemas/BreakdownDimension" }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        resolution: { type: string, enum: [1m, 10m] }
        site: { $ref: "#/components/schemas/WebsiteId" }
        exact: { type: boolean, description: "How the numbers are made, never the coverage of the window. false for path, asn, referrer and rule (bounded top lists, see TopEntry.error), for country per website when several websites share the gateway (K = 16), and for a sampled request ring (source requests); true otherwise. A gap or restart in the range no longer turns exact false; that is partial." }
        gap_kind: { type: string, enum: [restart, lost], description: "Only with partial true, why the window is incomplete. restart: every uncounted part is time in which schild was stopped in an orderly way (SIGTERM, a deploy: the running buckets were written at shutdown), so every request schild answered is counted; requests sent while it was down never reached it. lost: some part may miss requests schild did answer: a hard stop (SIGKILL, OOM, crash: at most the minute before it, see the minute checkpoint in MetricBucket), a skipped sample or a bucket that could not be written; lost wins when both occur. Absent with partial true: unknown. The UI may say \"Neustart\" for restart and \"Messlücke\" for lost." }
        partial: { type: boolean, description: "The window is incomplete - schild did not count every second of [from, to) up to now: a bucket marked partial (a schild start or a skipped sample inside it), a missing bucket (a gap: schild down or a write skipped) or a schild start inside the range. Counts then miss the seconds that were not counted. A range ending at now is not partial because of the running bucket alone. Absent = false. Independent of exact: exact says whether the number is counted or estimated, partial says whether the window was fully covered; all four combinations occur. The UI shows partial as a gap hint (e.g. \"Messlücke im Zeitraum\", linked to the monitoring_gap and restart annotations), never as \"Näherungswert\"." }
        source: { type: string, enum: [rings, requests], description: "rings = monitoring rings (default, per-website top lists of the 10 min ring with site); requests = the request ring (a breakdown under a filter)." }
        filters: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/FilterExpr" }, description: "The filters applied." }
        bot_verification: { type: boolean, description: "Only for by=bot_category and by=ua_class: whether bot verification ran. false: bot categories are claims of the user agent and ua_class bot_verified is 0; the UI says \"Überprüfung noch nicht verfügbar\"." }
        total: { $ref: "#/components/schemas/BreakdownCounts" }
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/TopEntry" } }
        other: { $ref: "#/components/schemas/BreakdownCounts" }
    HealthHintCode:
      description: >-
        Plain-language hints on the first screen; the UI renders German text by code. Thresholds:
        cpu_high usage >= 0.9 for 5 min; cpu_throttled container throttled in >= 10 % of periods over 5 min; load_high
        load5 > 2 x cores; memory_low available < 10 %; swap_active swap-in over 1 MiB/s for 5 min; oom_kill an OOM kill
        in 24 h; disk_full_soon a mount >= 90 % (blocks or inodes); disk_io_busy a device busy >= 90 % for 5 min;
        net_errors errors or drops >= 0.1 % of packets over 5 min; conntrack_high >= 80 %; fd_high process or system open
        files >= 80 % of the limit; listen_drops listen queue drops in 5 min; upstream_errors >= 1 % of forwarded
        requests (and >= 10) over 5 min; upstream_slow upstream p95 >= 2 s over 5 min; fail_closed a fail-closed 503 in
        5 min; waf_saturated a waf_busy 503 in 5 min; events_dropped events dropped in 1 h; store_near_cap store >= 90 %
        of retention.max_size_mb; traffic_spike requests over the last 5 min >= 5 x the mean of the previous hour (and
        >= 10/s); monitoring_degraded the sampler skipped a sample or exceeded its budget in 10 min. Storage (contracts/storage-bounds.md): store_cap_unreachable (warning) the size cap of schild.db could not get below
        retention.max_size_mb without deleting the newest rows every class keeps (value = used bytes, threshold = the
        cap); storage_budget (notice; object = storage.path) the
        configured bounds (cap + 10 %, two WAL limits, metrics.db bound, request ring) would leave less than the reserve max(1 GiB,
        min(5 % of the file system, 20 GiB)) free when they fill up (threshold = the reserve in bytes); disk_fill_projection (notice under 14 days, warning under 3; object =
        mount, value = days left) the mount fills up at the steady growth of the last 7 days (Theil-Sen slope of the daily
        minima of server.disk_used). store_near_cap, store_cap_unreachable and storage_budget are about schild's own
        event store: they mark only the server, never its websites.
      type: string
      enum: [cpu_high, cpu_throttled, load_high, memory_low, swap_active, oom_kill, disk_full_soon, disk_io_busy, net_errors, conntrack_high, fd_high, listen_drops, upstream_errors, upstream_slow, fail_closed, waf_saturated, events_dropped, store_near_cap, traffic_spike, monitoring_degraded, store_cap_unreachable, storage_budget, disk_fill_projection]
    HealthHint:
      type: object
      additionalProperties: false
      required: [code, level, since]
      properties:
        code: { $ref: "#/components/schemas/HealthHintCode" }
        level: { type: string, enum: [info, notice, warning], description: "Calm levels only; there is no alarm level." }
        since: { $ref: "#/components/schemas/Timestamp" }
        value: { type: [number, "null"] }
        threshold: { type: [number, "null"] }
        object: { $ref: "#/components/schemas/MetricObject" }
        site:
          $ref: "#/components/schemas/WebsiteId"
          description: >-
            The website of a website-scoped hint (codes upstream_errors, upstream_slow, fail_closed,
            traffic_spike, computed from that website's own counters). Absent: a server-wide hint (host codes and
            schild's shared resources), shown at every website on this server as a short hint ("web-1: Platte fast
            voll"). getMonitoringNow with site returns that website's hints and the server-wide ones.
    TrafficNow:
      type: object
      additionalProperties: false
      required: [window_s, requests_per_s, requests_per_s_10s, stopped_share, would_block_share, fail_closed, upstream_error_share, latency_total_p50_ms, latency_total_p95_ms, latency_overhead_p95_ms, latency_upstream_p95_ms, bytes_in_per_s, bytes_out_per_s]
      properties:
        window_s: { const: 60 }
        requests_per_s: { type: number, minimum: 0 }
        requests_per_s_10s: { type: number, minimum: 0 }
        stopped_share: { $ref: "#/components/schemas/NullableRatio" }
        would_block_share: { $ref: "#/components/schemas/NullableRatio" }
        fail_closed: { type: integer, minimum: 0 }
        upstream_error_share: { $ref: "#/components/schemas/NullableRatio" }
        latency_total_p50_ms: { $ref: "#/components/schemas/NullableMs" }
        latency_total_p95_ms: { $ref: "#/components/schemas/NullableMs" }
        latency_overhead_p95_ms: { $ref: "#/components/schemas/NullableMs" }
        latency_upstream_p95_ms: { $ref: "#/components/schemas/NullableMs" }
        bytes_in_per_s: { type: number, minimum: 0 }
        bytes_out_per_s: { type: number, minimum: 0 }
        clients_unique: { type: [integer, "null"], minimum: 0, description: "Estimate of the visitors in the window (distinct client keys with a browser request schild forwarded; bots and tools not counted)." }
    ServerNow:
      description: "The latest 10 s sample in brief. Fields are null when not visible here (see ServerSnapshot.unavailable)."
      type: object
      additionalProperties: false
      required: [sampled_at, scope, cpu_usage, cores, load1, memory_used_ratio, memory_available_bytes, swap_used_bytes, disk, net_rx_bytes_per_s, net_tx_bytes_per_s]
      properties:
        sampled_at: { $ref: "#/components/schemas/Timestamp" }
        scope: { type: string, enum: [host, container, process], description: "What CPU and memory describe: host (/proc), container (lxcfs or cgroup limits shown instead), process (host off or not Linux)." }
        cpu_usage: { $ref: "#/components/schemas/NullableRatio" }
        cores: { type: [integer, "null"], minimum: 1 }
        load1: { type: [number, "null"], minimum: 0 }
        memory_used_ratio: { $ref: "#/components/schemas/NullableRatio" }
        memory_available_bytes: { type: [integer, "null"], minimum: 0 }
        swap_used_bytes: { type: [integer, "null"], minimum: 0 }
        disk:
          description: "The fullest shown mount (blocks or inodes, whichever is higher)."
          oneOf:
            - { type: "null" }
            - type: object
              additionalProperties: false
              required: [mount, used_ratio]
              properties:
                mount: { $ref: "#/components/schemas/MetricObject" }
                used_ratio: { $ref: "#/components/schemas/Ratio" }
        net_rx_bytes_per_s: { type: [number, "null"], minimum: 0 }
        net_tx_bytes_per_s: { type: [number, "null"], minimum: 0 }
        uptime_s: { type: [integer, "null"], minimum: 0 }
    SiteKey:
      description: "A WebsiteId, or _other for the sum of all websites beyond the first 32."
      type: string
      maxLength: 253
      pattern: "^(_other|_any|(_|[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)(\\.(_|[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?))*)$"
    SiteNow:
      type: object
      additionalProperties: false
      required: [site, requests_per_s, stopped_share]
      properties:
        site: { $ref: "#/components/schemas/SiteKey" }
        label: { type: string, maxLength: 64 }
        requests_per_s: { type: number, minimum: 0 }
        stopped_share: { $ref: "#/components/schemas/NullableRatio" }
    MonitoringNow:
      type: object
      additionalProperties: false
      required: [generated_at, started_at, traffic, server, hints]
      properties:
        cluster: { $ref: "#/components/schemas/ClusterScope" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp", description: "Start of this schild process (counters before it are in the rings, not in TrafficNow)." }
        site: { $ref: "#/components/schemas/WebsiteId" }
        traffic: { $ref: "#/components/schemas/TrafficNow" }
        server: { oneOf: [{ $ref: "#/components/schemas/ServerNow" }, { type: "null" }] }
        hints: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/HealthHint" } }
        sites: { type: array, maxItems: 33, description: "Up to 32 sites, the rest as site _other; absent with one site.", items: { $ref: "#/components/schemas/SiteNow" } }
    LiveTick:
      type: object
      additionalProperties: false
      required: [t, traffic]
      properties:
        t: { $ref: "#/components/schemas/Timestamp" }
        traffic: { $ref: "#/components/schemas/TrafficCounters" }
        latency_total_p95_ms: { $ref: "#/components/schemas/NullableMs" }
        latency_overhead_p95_ms: { $ref: "#/components/schemas/NullableMs" }
        sites:
          type: array
          maxItems: 33
          items:
            type: object
            additionalProperties: false
            required: [site, requests, stopped]
            properties:
              site: { $ref: "#/components/schemas/SiteKey" }
              requests: { type: integer, minimum: 0 }
              stopped: { type: integer, minimum: 0 }
        schild:
          type: object
          additionalProperties: false
          required: [event_queue_fill, eval_slots_used, eval_slots_max]
          properties:
            event_queue_fill: { $ref: "#/components/schemas/Ratio" }
            eval_slots_used: { type: integer, minimum: 0 }
            eval_slots_max: { type: integer, minimum: 1 }
        server: { $ref: "#/components/schemas/ServerNow" }
    GaugeStats:
      type: object
      additionalProperties: false
      required: [avg, min, max]
      properties:
        avg: { type: number }
        min: { type: number }
        max: { type: number }
    MetricValues:
      description: "Server, container, process and schild values of one bucket by metric id: counters as the sum over the step, gauges as GaugeStats of the 10 s samples. Absent ids were not available."
      type: object
      additionalProperties: false
      properties:
        counters:
          type: object
          maxProperties: 64
          propertyNames: { $ref: "#/components/schemas/MetricId" }
          additionalProperties: { type: number, minimum: 0 }
        gauges:
          type: object
          maxProperties: 64
          propertyNames: { $ref: "#/components/schemas/MetricId" }
          additionalProperties: { $ref: "#/components/schemas/GaugeStats" }
    MetricBucket:
      description: >-
        One row of a ring - the unit stored locally and read by an export. Aggregates only:
        no IP address, client key or hash. top lists exist in the 1 min and 10 min rings only. Top
        lists referrer, browser, os, device, bot_category and rule; path entries carry detections. Minute checkpoint:
        every 60 s the gateway writes the running 10 min bucket into its
        slot as it stands - gateway-wide counters, histograms, top lists, clients estimates and every sites[] entry with
        its own top lists and clients - with partial true and gap_kind lost; the write at the end of the bucket replaces
        it (partial and gap_kind as the bucket really was), and the write at an orderly shutdown sets gap_kind restart.
        After a hard stop the checkpoint row stays, so a hard stop loses at most the last minute of the 10 min ring too,
        per website and in the top lists. When schild starts again inside the same bucket it resumes from the checkpoint
        row: counters, histograms and space-saving lists (count and error per entry) continue from it; clients estimates
        are the checkpoint's plus those counted after the start (registers are never stored, so a client seen before and
        after may count twice; the bucket is partial anyway). The meaning of partial is unchanged; the 10 s and 1 min
        rings are written per bucket as before.
      type: object
      additionalProperties: false
      required: [t, resolution, step_s, partial, traffic, latency, clients, sites, values]
      properties:
        t: { $ref: "#/components/schemas/Timestamp", description: "Start of the bucket." }
        resolution: { $ref: "#/components/schemas/Resolution" }
        step_s: { type: integer, enum: [10, 60, 600] }
        partial: { type: boolean, description: "schild started or stopped or the sampler skipped within the bucket, or the row is a minute checkpoint of a 10 min bucket that was never completed (a hard stop)." }
        gap_kind: { type: string, enum: [restart, lost], description: "Only with partial true, as KpiValue.gap_kind for this bucket: restart = its gaps are an orderly stop and start; lost = a hard stop (a checkpoint row never completed), a skipped sample or a failed write. Queries derive KpiValue.gap_kind and TrafficBreakdown.gap_kind from it (lost wins) and from missing buckets: a missing bucket between an orderly shutdown and the next start is restart, any other missing bucket lost." }
        traffic: { $ref: "#/components/schemas/TrafficCounters" }
        latency:
          type: object
          additionalProperties: false
          required: [total, overhead, upstream]
          properties:
            total: { $ref: "#/components/schemas/LatencyHistogram" }
            overhead: { $ref: "#/components/schemas/LatencyHistogram" }
            upstream: { $ref: "#/components/schemas/LatencyHistogram" }
        clients:
          type: object
          additionalProperties: false
          required: [unique, new]
          description: >-
            Estimates for this bucket only (not additive across buckets); null when unknown. unique_day =
            distinct clients since 00:00 UTC up to the end of the bucket (sum the last value of each UTC day for
            "Besucher" over several days). unique, new and unique_day count visitors only -
            clients with a browser request schild forwarded (ua_class browser, bot_category likely_browser, outcome
            passed or would_block; contract/monitoring.Visitor, vectors website-visitor); bots = distinct clients with a
            request that is no browser request (verified and unverified bots, tools, no User-Agent, likely automated),
            whatever schild did with it ("Bot-Clients"); a client may be in both (two user agents behind one address).
          properties:
            unique: { type: [integer, "null"], minimum: 0 }
            new: { type: [integer, "null"], minimum: 0 }
            unique_day: { type: [integer, "null"], minimum: 0 }
            bots: { type: [integer, "null"], minimum: 0, description: "Distinct bot clients in the bucket (estimate)." }
        top:
          type: object
          additionalProperties: false
          properties:
            path: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/TopEntry" } }
            asn: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/TopEntry" } }
            country: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/TopEntry" } }
            net_class: { type: array, maxItems: 11, items: { $ref: "#/components/schemas/TopEntry" } }
            ua_class: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/TopEntry" } }
            method: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/TopEntry" } }
            referrer: { type: array, maxItems: 64, description: "Space-saving top list of ReferrerKey (K = 64); entries carry error.", items: { $ref: "#/components/schemas/TopEntry" } }
            browser: { type: array, maxItems: 9, description: "Exact, one entry per BrowserFamily seen.", items: { $ref: "#/components/schemas/TopEntry" } }
            os: { type: array, maxItems: 8, description: "Exact, one entry per OSFamily seen.", items: { $ref: "#/components/schemas/TopEntry" } }
            device: { type: array, maxItems: 5, description: "Exact, one entry per DeviceClass seen.", items: { $ref: "#/components/schemas/TopEntry" } }
            bot_category: { type: array, maxItems: 13, description: "Exact, one entry per BotCategory seen.", items: { $ref: "#/components/schemas/TopEntry" } }
            rule: { type: array, maxItems: 64, description: "Space-saving top list of rule ids by the detections in which they matched (K = 64), so alert rates per rule cover the whole 10 min ring (14 d by default). requests = those detections.", items: { $ref: "#/components/schemas/TopEntry" } }
        sites:
          type: array
          maxItems: 33
          description: >-
            Per-website traffic for up to 32 websites, the rest summed as _other. Lists every tracked
            website with requests in the bucket, also a single one, with its own latency histograms, so the same website can be merged across gateways exactly (counters and
            histograms add up). An empty list with one site means all traffic belongs to the gateway's one website.
          items:
            type: object
            additionalProperties: false
            required: [site, traffic]
            properties:
              site: { $ref: "#/components/schemas/SiteKey" }
              traffic: { $ref: "#/components/schemas/TrafficCounters" }
              clients:
                description: "Estimates for this website (HyperLogLog per tracked website, registers in memory only): unique and new clients in the bucket, unique_day = distinct clients since 00:00 UTC up to the end of the bucket. unique, new and unique_day count visitors only (browser requests schild forwarded), bots the bot clients, as in MetricBucket.clients."
                type: object
                additionalProperties: false
                required: [unique, new]
                properties:
                  unique: { type: [integer, "null"], minimum: 0 }
                  new: { type: [integer, "null"], minimum: 0 }
                  unique_day: { type: [integer, "null"], minimum: 0 }
                  bots: { type: [integer, "null"], minimum: 0 }
              top:
                description: >-
                  Per-website top lists, 10 min ring only: path (with detections), asn, country, referrer
                  and rule space-saving with K = 16 (entries carry error), net_class, ua_class, method, browser, os,
                  device and bot_category exact. Bound: about 1.5 KiB compressed per tracked website and bucket (about
                  3 MiB per website at 14 days); the builder measures it.
                type: object
                additionalProperties: false
                properties:
                  path: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/TopEntry" } }
                  asn: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/TopEntry" } }
                  country: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/TopEntry" } }
                  net_class: { type: array, maxItems: 11, items: { $ref: "#/components/schemas/TopEntry" } }
                  ua_class: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/TopEntry" } }
                  method: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/TopEntry" } }
                  referrer: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/TopEntry" } }
                  browser: { type: array, maxItems: 9, items: { $ref: "#/components/schemas/TopEntry" } }
                  os: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/TopEntry" } }
                  device: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/TopEntry" } }
                  bot_category: { type: array, maxItems: 13, items: { $ref: "#/components/schemas/TopEntry" } }
                  rule: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/TopEntry" } }
              latency:
                type: object
                additionalProperties: false
                required: [total, overhead, upstream]
                properties:
                  total: { $ref: "#/components/schemas/LatencyHistogram" }
                  overhead: { $ref: "#/components/schemas/LatencyHistogram" }
                  upstream: { $ref: "#/components/schemas/LatencyHistogram" }
        values: { $ref: "#/components/schemas/MetricValues" }
        objects:
          type: array
          maxItems: 48
          items:
            type: object
            additionalProperties: false
            required: [object, kind, values]
            properties:
              object: { $ref: "#/components/schemas/MetricObject" }
              kind: { type: string, enum: [mount, device, interface] }
              values: { $ref: "#/components/schemas/MetricValues" }
    MetricBucketPage:
      type: object
      additionalProperties: false
      required: [resolution, items, next_cursor]
      properties:
        resolution: { $ref: "#/components/schemas/Resolution" }
        items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/MetricBucket" } }
        next_cursor: { type: [string, "null"] }
    MonitoringEnvironment:
      type: object
      additionalProperties: false
      required: [os_family, container, cgroup, net_namespace, lxcfs]
      properties:
        os_family: { type: string, enum: [linux, other] }
        container: { type: boolean, description: "Detected from /.dockerenv, /run/.containerenv or the cgroup path." }
        cgroup: { type: string, enum: [v2, v1, none] }
        net_namespace: { type: string, enum: [host, own, unknown], description: "host: network_mode host (host interfaces, sockets and conntrack visible); own: the container's own network only." }
        lxcfs: { type: boolean, description: "/proc/meminfo, /proc/stat or /proc/loadavg are lxcfs views of the container." }
    CPUSnapshot:
      type: object
      additionalProperties: false
      required: [scope, cores, usage, user, system, iowait, steal]
      properties:
        scope: { type: string, enum: [host, container] }
        cores: { type: integer, minimum: 1 }
        usage: { $ref: "#/components/schemas/Ratio" }
        user: { $ref: "#/components/schemas/Ratio" }
        system: { $ref: "#/components/schemas/Ratio" }
        iowait: { $ref: "#/components/schemas/Ratio" }
        steal: { $ref: "#/components/schemas/Ratio" }
        per_core: { type: array, maxItems: 1024, description: "Usage per core (snapshot and live only, not stored).", items: { $ref: "#/components/schemas/Ratio" } }
        load1: { type: number, minimum: 0 }
        load5: { type: number, minimum: 0 }
        load15: { type: number, minimum: 0 }
    MemorySnapshot:
      type: object
      additionalProperties: false
      required: [scope, total_bytes, available_bytes, used_bytes, swap_total_bytes, swap_used_bytes]
      properties:
        scope: { type: string, enum: [host, container] }
        total_bytes: { type: integer, minimum: 0 }
        available_bytes: { type: integer, minimum: 0 }
        used_bytes: { type: integer, minimum: 0 }
        cached_bytes: { type: integer, minimum: 0 }
        swap_total_bytes: { type: integer, minimum: 0 }
        swap_used_bytes: { type: integer, minimum: 0 }
        oom_kills_24h: { type: [integer, "null"], minimum: 0 }
    ContainerSnapshot:
      description: "cgroup v2 of schild's own container (cpu.max, cpu.stat, memory.current, memory.max, memory.events)."
      type: object
      additionalProperties: false
      required: [cpu_limit_cores, cpu_usage, cpu_throttled, memory_used_bytes, memory_limit_bytes]
      properties:
        cpu_limit_cores: { type: [number, "null"], minimum: 0, description: "null = no limit (max)." }
        cpu_usage: { $ref: "#/components/schemas/Ratio", description: "Share of the limit, or of all host cores without a limit." }
        cpu_throttled: { $ref: "#/components/schemas/Ratio", description: "Share of periods throttled since the last sample." }
        memory_used_bytes: { type: integer, minimum: 0 }
        memory_limit_bytes: { type: [integer, "null"], minimum: 0 }
        oom_kills: { type: integer, minimum: 0 }
    MountSnapshot:
      type: object
      additionalProperties: false
      required: [mount, fs_type, size_bytes, used_bytes, avail_bytes, used_ratio]
      properties:
        mount: { $ref: "#/components/schemas/MetricObject" }
        device: { $ref: "#/components/schemas/MetricObject" }
        fs_type: { type: string, maxLength: 32, pattern: "^[a-z0-9._-]{1,32}$" }
        size_bytes: { type: integer, minimum: 0 }
        used_bytes: { type: integer, minimum: 0 }
        avail_bytes: { type: integer, minimum: 0 }
        used_ratio: { $ref: "#/components/schemas/Ratio" }
        inodes_total: { type: integer, minimum: 0 }
        inodes_used: { type: integer, minimum: 0 }
        read_bytes_per_s: { type: [number, "null"], minimum: 0 }
        write_bytes_per_s: { type: [number, "null"], minimum: 0 }
        reads_per_s: { type: [number, "null"], minimum: 0 }
        writes_per_s: { type: [number, "null"], minimum: 0 }
        busy: { $ref: "#/components/schemas/NullableRatio" }
    InterfaceSnapshot:
      type: object
      additionalProperties: false
      required: [name, rx_bytes_per_s, tx_bytes_per_s, rx_packets_per_s, tx_packets_per_s, errors_per_s, drops_per_s]
      properties:
        name: { $ref: "#/components/schemas/MetricObject" }
        rx_bytes_per_s: { type: number, minimum: 0 }
        tx_bytes_per_s: { type: number, minimum: 0 }
        rx_packets_per_s: { type: number, minimum: 0 }
        tx_packets_per_s: { type: number, minimum: 0 }
        errors_per_s: { type: number, minimum: 0 }
        drops_per_s: { type: number, minimum: 0 }
    TCPSnapshot:
      type: object
      additionalProperties: false
      required: [source, established, syn_sent, syn_recv, fin_wait, time_wait, close_wait, last_ack, closing, listen]
      properties:
        source: { type: string, enum: [netlink, proc, sockstat], description: "netlink: sock_diag state counts; proc: /proc/net/tcp{,6}, used only while the socket count (from sockstat) is at most a cap and the measured cost per socket predicts a scan within a time budget (both gateway-tuned; informative: 5000 sockets, 10 ms); sockstat: totals only, used when proc is not cheap enough (established = inuse, time_wait = tw), the other states are 0 and listen is null (not counted)." }
        established: { type: integer, minimum: 0 }
        syn_sent: { type: integer, minimum: 0 }
        syn_recv: { type: integer, minimum: 0 }
        fin_wait: { type: integer, minimum: 0 }
        time_wait: { type: integer, minimum: 0 }
        close_wait: { type: integer, minimum: 0 }
        last_ack: { type: integer, minimum: 0 }
        closing: { type: integer, minimum: 0 }
        listen: { type: [integer, "null"], minimum: 0, description: "Listening sockets. null = unknown (source sockstat, used when a /proc/net/tcp scan is not cheap enough, has no listen count); the UI shows \"unbekannt\", never 0." }
        inuse: { type: integer, minimum: 0 }
        orphan: { type: integer, minimum: 0 }
        listen_drops_per_s: { type: number, minimum: 0 }
        retransmits_per_s: { type: number, minimum: 0 }
    ProcessSnapshot:
      type: object
      additionalProperties: false
      required: [started_at, cpu_usage, rss_bytes, heap_bytes, goroutines, threads, gc_pause_p99_ms, open_files, open_files_limit]
      properties:
        started_at: { $ref: "#/components/schemas/Timestamp" }
        version: { type: string, maxLength: 64 }
        cpu_usage: { $ref: "#/components/schemas/Ratio", description: "Share of all cores." }
        rss_bytes: { type: integer, minimum: 0 }
        heap_bytes: { type: integer, minimum: 0 }
        goroutines: { type: integer, minimum: 0 }
        threads: { type: integer, minimum: 0 }
        gc_pause_p99_ms: { type: number, minimum: 0 }
        open_files: { type: integer, minimum: 0 }
        open_files_limit: { type: integer, minimum: 0 }
    SchildInternals:
      type: object
      additionalProperties: false
      required: [event_queue_used, event_queue_capacity, events_dropped_1h, eval_slots_used, eval_slots_max, store_bytes, store_max_bytes, metrics_store_bytes, sampler_ms, sampler_budget_ms]
      properties:
        event_queue_used: { type: integer, minimum: 0 }
        event_queue_capacity: { type: integer, minimum: 1 }
        events_dropped_1h: { type: integer, minimum: 0 }
        eval_slots_used: { type: integer, minimum: 0 }
        eval_slots_max: { type: integer, minimum: 1 }
        store_bytes: { type: integer, minimum: 0, description: "schild.db in use (pages minus free list)." }
        store_max_bytes: { type: integer, minimum: 0, description: "retention.max_size_mb in bytes." }
        metrics_store_bytes: { type: integer, minimum: 0, description: "metrics.db (fixed after the rings filled)." }
        sampler_ms: { type: number, minimum: 0, description: "CPU time of the last host sample." }
        sampler_budget_ms: { type: number, minimum: 0 }
    HostOS:
      type: object
      additionalProperties: false
      required: [source, name, kernel, arch]
      properties:
        source: { type: string, enum: [host_report, uname], description: "host_report: the latest local host report (with EOL); uname: kernel and arch only, the name is the kernel's in a container (os-release there is the image's)." }
        name: { type: string, maxLength: 128 }
        kernel: { type: string, maxLength: 64 }
        arch: { type: string, maxLength: 16 }
        eol: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        report_at: { $ref: "#/components/schemas/NullableTimestamp" }
    ServerSnapshot:
      type: object
      additionalProperties: false
      required: [generated_at, sampled_at, interval_s, environment, os, cpu, memory, container, mounts, interfaces, tcp, conntrack, files, process, schild, unavailable]
      properties:
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        sampled_at: { $ref: "#/components/schemas/NullableTimestamp" }
        interval_s: { const: 10 }
        environment: { $ref: "#/components/schemas/MonitoringEnvironment" }
        os: { oneOf: [{ $ref: "#/components/schemas/HostOS" }, { type: "null" }] }
        uptime_s: { type: [integer, "null"], minimum: 0, description: "Host uptime (/proc/uptime)." }
        cpu: { oneOf: [{ $ref: "#/components/schemas/CPUSnapshot" }, { type: "null" }] }
        memory: { oneOf: [{ $ref: "#/components/schemas/MemorySnapshot" }, { type: "null" }] }
        container: { oneOf: [{ $ref: "#/components/schemas/ContainerSnapshot" }, { type: "null" }] }
        mounts: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/MountSnapshot" } }
        interfaces: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/InterfaceSnapshot" } }
        tcp: { oneOf: [{ $ref: "#/components/schemas/TCPSnapshot" }, { type: "null" }] }
        conntrack:
          oneOf:
            - { type: "null" }
            - type: object
              additionalProperties: false
              required: [count, max]
              properties:
                count: { type: integer, minimum: 0 }
                max: { type: integer, minimum: 1 }
        files:
          oneOf:
            - { type: "null" }
            - type: object
              additionalProperties: false
              required: [open, max]
              description: "System-wide /proc/sys/fs/file-nr."
              properties:
                open: { type: integer, minimum: 0 }
                max: { type: integer, minimum: 1 }
        process: { $ref: "#/components/schemas/ProcessSnapshot" }
        schild: { $ref: "#/components/schemas/SchildInternals" }
        unavailable:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [area, reason]
            properties:
              area: { type: string, enum: [cpu, memory, load, container, mounts, disk_io, interfaces, tcp, conntrack, files, os] }
              reason: { $ref: "#/components/schemas/UnavailableReason" }

    # ---------------------------------------------------------------- requests and bots
    VisitorKey:
      description: >-
        Pseudonymous visitor key of the request ring: HMAC-SHA256 of the client key (IPv4 address, IPv6
        /64) with a random key that lives in memory only and is replaced every day at 00:00 UTC (and at every restart),
        first 8 bytes as hex. Links the requests of one client within one day; never across days, never back to an
        address. Local only; the agent API re-keys it as a p1- pseudonym.
      type: string
      pattern: "^v1-[0-9a-f]{16}$"
    BotId: { description: "Id of a bot-catalogue.schema.json entry.", type: string, pattern: "^[a-z0-9][a-z0-9-]{1,47}$" }
    BotVerification:
      description: >-
        verified = the address is in a fresh published range of the operator, or FCrDNS confirmed it
        (bots.verify.fcrdns); claimed = the operator publishes nothing or the check is off ("nicht überprüfbar");
        mismatch = the operator publishes fresh ranges and the address is outside them ("gibt sich als ... aus");
        unknown_stale = the range snapshot is older than 30 days ("Adressliste veraltet").
      type: string
      enum: [verified, claimed, mismatch, unknown_stale]
    RequestOutcome:
      description: >-
        What schild did with the request (the classes of TrafficCounters): passed (forwarded; also
        forwarded requests a stricter rate limit mode would have stopped), would_block (forwarded, the WAF or behaviour
        would have blocked it in a stricter mode; UI "hätte gesperrt"), blocked_waf, blocked_behaviour, rate_limited,
        rejected_limit (hard limits), fail_closed (503, never passed uninspected). blocked_crawler (403 from
        the crawler policy of the website); a crawler the policy would block in the test profile or from an allowlisted
        address is would_block.
      type: string
      enum: [passed, would_block, blocked_waf, blocked_behaviour, rate_limited, rejected_limit, fail_closed, blocked_crawler]
    RequestRecord:
      description: >-
        One request of the ring. Valid requests and WAF alerts sit in one stream: every record carries
        its outcome, anomaly score, up to 3 matched rule ids and the event id when an event was written, so an alert
        joins its event without a second lookup. ip is the client address. user_agent is the header as sent (D85). Never contained: query string, cookies, full
        referrer, city or region, Accept-Language, client hints, header-order or TLS fingerprints.
      type: object
      additionalProperties: false
      required: [t, site, host, path, path_kind, method, status, outcome, anomaly_score, country, asn, browser, os, device, bot_category, referrer, duration_ms, bytes_out, page_view, visitor]
      properties:
        t: { $ref: "#/components/schemas/Timestamp" }
        ip: { type: string, maxLength: 64, description: "Client address; absent after privacy/delete." }
        user_agent: { type: string, maxLength: 1024, pattern: "^[^\\x00-\\x1F\\x7F]*$", description: "The User-Agent as sent (D85), at most 1024 bytes, visitor-controlled; absent when none was sent and after privacy/delete." }
        site: { $ref: "#/components/schemas/WebsiteId", description: "Website id." }
        host: { type: string, maxLength: 253, pattern: "^[^\\x00-\\x1F\\x7F]*$", description: "Normalised Host of the request (visitor-controlled)." }
        path: { type: string, maxLength: 512, pattern: "^[^\\x00-\\x1F\\x7F]*$", description: "The real path, redacted (path_kind redacted), or the path template (path_kind template). Never a query string." }
        path_kind: { type: string, enum: [template, redacted] }
        method: { type: string, pattern: "^[A-Z]{1,16}$", description: "OTHER for unknown methods." }
        status: { type: integer, minimum: 100, maximum: 599 }
        outcome: { $ref: "#/components/schemas/RequestOutcome" }
        anomaly_score: { type: integer, minimum: 0, maximum: 10000, description: "CRS inbound anomaly score (0 without a WAF match)." }
        rules: { type: array, maxItems: 3, description: "Up to 3 matched rule ids, highest severity first; absent without a match.", items: { type: string, maxLength: 32 } }
        event_id: { $ref: "../common.schema.json#/$defs/uuid", description: "The event written for this request (alerts, sampled clean events)." }
        country: { $ref: "../common.schema.json#/$defs/country" }
        asn: { type: integer, minimum: 0, maximum: 4294967295, description: "0 = unknown." }
        net_class: { $ref: "../common.schema.json#/$defs/netClass" }
        browser: { $ref: "#/components/schemas/BrowserFamily" }
        os: { $ref: "#/components/schemas/OSFamily" }
        device: { $ref: "#/components/schemas/DeviceClass" }
        bot: { $ref: "#/components/schemas/BotId" }
        bot_category: { $ref: "#/components/schemas/BotCategory" }
        verification: { $ref: "#/components/schemas/BotVerification", description: "With bot only." }
        referrer: { $ref: "#/components/schemas/ReferrerKey" }
        duration_ms: { type: number, minimum: 0, description: "Total time, stored on the exp1.25-0.05ms scale: the upper bound of its bucket (at most 25 % above the true value)." }
        bytes_out: { type: integer, minimum: 0, description: "Response body bytes (capped at 4294967295)." }
        page_view: { type: boolean, description: "Counted in TrafficCounters.page_views." }
        visitor: { $ref: "#/components/schemas/VisitorKey" }
    RequestPage:
      type: object
      additionalProperties: false
      required: [from, to, items, next_cursor, scanned, scan_capped, sample_rate]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/RequestRecord" } }
        next_cursor: { type: [string, "null"] }
        scanned: { type: integer, minimum: 0, description: "Records read for this page." }
        scan_capped: { type: boolean, description: "The read cap was reached; continue with next_cursor." }
        sample_rate: { type: number, exclusiveMinimum: 0, maximum: 1, description: "Lowest sample rate of the segments read; below 1 the UI shows \"Näherungswert\" (consistent sampling by visitor key above max_size_mb)." }
        keep_hours: { type: integer, minimum: 1, maximum: 720, description: "The hours the ring keeps, min(monitoring.requests.keep_hours, retention.raw_ip_days x 24). Filters, combined filters and the ip and user_agent breakdowns work for ranges within it." }
        kept_from: { $ref: "#/components/schemas/Timestamp", description: "Start of the oldest segment kept; later than now - keep_hours when the ring started later or the size cap removed older segments. Absent when the ring is empty." }
    SiteStripPoint:
      description: "One 10 s step of the site-wide strip in RequestContext (from the monitoring 10 s ring, exact)."
      type: object
      additionalProperties: false
      required: [t, requests, stopped, would_block, detections]
      properties:
        t: { $ref: "#/components/schemas/Timestamp" }
        requests: { type: integer, minimum: 0 }
        stopped: { type: integer, minimum: 0 }
        would_block: { type: integer, minimum: 0 }
        detections: { type: integer, minimum: 0 }
    VisitorPattern:
      description: >-
        alert_only = every request of the visitor in the window raised an alert (scanner pattern); in_session =
        the alerts sit inside otherwise normal requests (page views, 2xx, a browser; possible false positive pattern);
        no_alert = no alert in the window. Counts only; visitor keys stay daily and pseudonymous.
      type: string
      enum: [alert_only, in_session, no_alert]
    RequestContext:
      type: object
      additionalProperties: false
      required: [event_id, state, from, to, anchor, visitor_requests, truncated, site_strip]
      properties:
        event_id: { $ref: "../common.schema.json#/$defs/uuid" }
        state: { type: string, enum: [complete, sampled, expired], description: "complete: pinned or unsampled; sampled: from a sampled segment (\"Näherungswert\"); expired: the window left the ring." }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        anchor: { oneOf: [{ $ref: "#/components/schemas/RequestRecord" }, { type: "null" }], description: "The request of the event; null when expired." }
        visitor_requests: { type: array, maxItems: 1000, description: "Requests of the same visitor key in [from, to], oldest first, the anchor included.", items: { $ref: "#/components/schemas/RequestRecord" } }
        truncated: { type: boolean, description: "More than 1000 requests of the visitor in the window." }
        visitor_summary:
          type: object
          additionalProperties: false
          required: [requests, page_views, status_2xx, alerts, pattern]
          properties:
            requests: { type: integer, minimum: 0 }
            page_views: { type: integer, minimum: 0 }
            status_2xx: { type: integer, minimum: 0 }
            alerts: { type: integer, minimum: 0 }
            pattern: { $ref: "#/components/schemas/VisitorPattern" }
        site_strip: { type: array, maxItems: 61, items: { $ref: "#/components/schemas/SiteStripPoint" } }
        sites_affected: { $ref: "#/components/schemas/SitesAffected" }
    BotCounts:
      type: object
      additionalProperties: false
      required: [verified, claimed, mismatch, unknown_stale]
      properties:
        verified: { type: integer, minimum: 0 }
        claimed: { type: integer, minimum: 0 }
        mismatch: { type: integer, minimum: 0 }
        unknown_stale: { type: integer, minimum: 0 }
    BotOverview:
      type: object
      additionalProperties: false
      required: [from, to, catalogue_version, verification, ranges, categories, bots, sample_rate]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        site: { $ref: "#/components/schemas/WebsiteId" }
        catalogue_version: { type: string, pattern: "^20[0-9]{2}-[0-9]{2}-[0-9]{2}\\.[0-9]{1,3}$" }
        verification:
          type: object
          additionalProperties: false
          required: [ranges, fcrdns, ranges_fetch]
          description: "bots in schild.yaml as running."
          properties:
            ranges: { type: boolean }
            fcrdns: { type: boolean }
            ranges_fetch: { type: boolean }
        ranges:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [id, operator, fetched_at, stale, source]
            properties:
              id: { $ref: "#/components/schemas/BotId" }
              operator: { type: string, maxLength: 64 }
              fetched_at: { $ref: "#/components/schemas/Timestamp" }
              stale: { type: boolean, description: "Older than 30 days: its bots are unknown_stale." }
              source: { type: string, enum: [release, fetch], description: "Shipped with the release or fetched directly (bots.ranges_fetch)." }
        categories:
          type: array
          maxItems: 13
          items:
            type: object
            additionalProperties: false
            required: [category, requests, bytes_out, bots]
            properties:
              category: { $ref: "#/components/schemas/BotCategory" }
              requests: { type: integer, minimum: 0 }
              bytes_out: { type: integer, minimum: 0 }
              bots: { type: integer, minimum: 0, description: "Distinct catalogue bots seen." }
        bots:
          type: array
          maxItems: 1024
          items:
            type: object
            additionalProperties: false
            required: [id, name, operator, category, requests, bytes_out, last_seen, verification]
            properties:
              id: { $ref: "#/components/schemas/BotId" }
              name: { type: string, maxLength: 64 }
              operator: { type: string, maxLength: 64 }
              category: { $ref: "#/components/schemas/BotCategory" }
              requests: { type: integer, minimum: 0 }
              bytes_out: { type: integer, minimum: 0 }
              last_seen: { $ref: "#/components/schemas/Timestamp" }
              verification: { $ref: "#/components/schemas/BotCounts" }
              blocked: { type: integer, minimum: 0, description: "Optional, absent = 0: requests the crawler policy of the website blocked (blocked_crawler)." }
              would_block: { type: integer, minimum: 0, description: "Optional, absent = 0: requests the crawler policy would have blocked, passed because the gateway observes or the address is allowlisted." }
              robots:
                type: object
                additionalProperties: false
                required: [token, read_at, disallowed_requests, respects]
                description: "robots.txt view (observation only, nothing enforced): when the bot last read /robots.txt, how many requests went to paths its group disallows, and the verdict (\"hält sich daran: ja / nein / unklar\")."
                properties:
                  token: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
                  read_at: { $ref: "#/components/schemas/NullableTimestamp" }
                  disallowed_requests: { type: integer, minimum: 0 }
                  respects: { type: string, enum: ["yes", "no", unclear] }
        sample_rate: { type: number, exclusiveMinimum: 0, maximum: 1 }
    RuleAlert:
      type: object
      additionalProperties: false
      required: [rule_id, detections, blocked, would_block, error, pages, clients, possible_false_positive]
      properties:
        rule_id: { type: string, maxLength: 32 }
        detections: { type: integer, minimum: 0, description: "From the monitoring rings over the whole range." }
        blocked: { type: integer, minimum: 0 }
        would_block: { type: integer, minimum: 0 }
        error: { type: integer, minimum: 0, description: "Maximum overcount (space-saving top list)." }
        pages:
          type: array
          maxItems: 20
          description: "Inside the request ring window: pages the rule fires on."
          items:
            type: object
            additionalProperties: false
            required: [path, detections, requests, rate]
            properties:
              path: { type: string, maxLength: 512, pattern: "^[^\\x00-\\x1F\\x7F]*$" }
              detections: { type: integer, minimum: 0 }
              requests: { type: integer, minimum: 0 }
              rate: { $ref: "#/components/schemas/Ratio", description: "Share of the page's requests the rule hits." }
        clients:
          type: object
          additionalProperties: false
          required: [hit, alert_only, in_session]
          description: "Inside the request ring window: visitor keys the rule hit, split by VisitorPattern."
          properties:
            hit: { type: integer, minimum: 0 }
            alert_only: { type: integer, minimum: 0 }
            in_session: { type: integer, minimum: 0 }
        possible_false_positive: { type: boolean, description: "UI \"möglicher Fehlalarm\"; details in listFalsePositiveHints." }
    RuleAlerts:
      type: object
      additionalProperties: false
      required: [from, to, resolution, ring_from, items]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        site: { $ref: "#/components/schemas/WebsiteId" }
        resolution: { type: string, enum: [1m, 10m], description: "Monitoring ring the detections come from." }
        ring_from: { $ref: "#/components/schemas/NullableTimestamp", description: "Start of the part of the range inside the request ring (pages, clients); null when none is." }
        items: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/RuleAlert" } }
    PageAlert:
      type: object
      additionalProperties: false
      required: [path, requests, detections, rate, blocked, would_block, error, review]
      properties:
        path: { type: string, maxLength: 512, pattern: "^[^\\x00-\\x1F\\x7F]*$", description: "Path template." }
        requests: { type: integer, minimum: 0 }
        detections: { type: integer, minimum: 0 }
        rate: { $ref: "#/components/schemas/Ratio", description: "detections / requests." }
        blocked: { type: integer, minimum: 0 }
        would_block: { type: integer, minimum: 0 }
        error: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/StatusClasses", description: "Inside the request ring window." }
        latency_p95_ms: { $ref: "#/components/schemas/NullableMs", description: "Inside the request ring window." }
        observe_followed_by_2xx: { type: integer, minimum: 0, description: "Alerts in observe whose request was answered 2xx (inside the request ring window)." }
        rules:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [rule_id, detections]
            properties:
              rule_id: { type: string, maxLength: 32 }
              detections: { type: integer, minimum: 0 }
        review: { type: boolean, description: "Highlighted for review: alerts in observe followed by 2xx answers." }
    PageAlerts:
      type: object
      additionalProperties: false
      required: [from, to, resolution, ring_from, items]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        site: { $ref: "#/components/schemas/WebsiteId" }
        resolution: { type: string, enum: [1m, 10m] }
        ring_from: { $ref: "#/components/schemas/NullableTimestamp" }
        items: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/PageAlert" } }
    FalsePositiveHint:
      description: >-
        One rule on one page (and, when the events name it, one field) that mostly hits otherwise
        normal visitors. exception is a narrow local rule for rules.d (SecLang, ctl:ruleRemoveTargetById for that rule,
        that page and that field) to copy into the operator's repository; schild never applies it. Hints are per website (site) and the exception carries a Host condition with that website's hosts, so an
        exception for one app never relaxes the others (contract/websites.ExceptionSnippet, vectors
        website-exception); scope gateway only for a website without hosts (proxy default, _any).
      type: object
      additionalProperties: false
      required: [rule_id, path, detections, clients_hit, clients_in_session, since, exception]
      properties:
        rule_id: { type: string, maxLength: 32 }
        path: { type: string, maxLength: 512, pattern: "^[^\\x00-\\x1F\\x7F]*$" }
        target: { type: string, maxLength: 256, pattern: "^[A-Z_]+(:[^\\x00-\\x1F\\x7F]{1,200})?$", description: "Matched variable as recorded in the events, e.g. ARGS:comment." }
        detections: { type: integer, minimum: 1 }
        clients_hit: { type: integer, minimum: 1 }
        clients_in_session: { type: integer, minimum: 0 }
        since: { $ref: "#/components/schemas/Timestamp" }
        site: { $ref: "#/components/schemas/WebsiteId", description: "The website of the page." }
        exception:
          type: object
          additionalProperties: false
          required: [language, file, snippet]
          properties:
            language: { const: seclang }
            scope: { type: string, enum: [website, gateway], description: "website = the snippet is limited to the hosts of `site`; gateway = it applies to every website (only for a website without hosts)." }
            file: { type: string, pattern: "^rules\\.d/[a-z0-9._-]{1,64}\\.conf$", description: "Suggested file in the operator's repository." }
            snippet: { type: string, maxLength: 2048, description: "One SecRule with a fresh local id; never applied by schild." }
    FalsePositiveHintList:
      type: object
      additionalProperties: false
      required: [from, to, items]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/FalsePositiveHint" } }

    # ---------------------------------------------------------------- websites
    CrawlerAction: { type: string, enum: [allow, block] }
    CrawlerCategory:
      description: "The catalogue categories (the first eleven of BotCategory). likely_automated and likely_browser are no crawlers."
      type: string
      enum: [search_engine, ai_training, ai_search, ai_assistant, preview_social, feed_reader, monitoring, seo_tool, archive_research, security_scanner, tool_library]
    CrawlerPreset:
      description: "block_ai_training blocks the category ai_training and allows every other category; rules for single crawlers are dropped, impersonators stays."
      type: string
      enum: [block_ai_training]
    CrawlerPolicy:
      description: >-
        What one website lets crawlers do (contracts/crawler-policy.schema.json). A rule for a crawler
        overrides the rule of its category; a category or crawler not named is allowed. A block applies to every request
        whose User-Agent names that crawler, verified or not. impersonators block: a request that names a crawler whose
        operator publishes address ranges, from outside them (verification mismatch), is blocked whatever the other
        rules say.
      type: object
      additionalProperties: false
      required: [categories, bots, impersonators]
      properties:
        categories:
          type: object
          propertyNames: { $ref: "#/components/schemas/CrawlerCategory" }
          additionalProperties: { $ref: "#/components/schemas/CrawlerAction" }
        bots:
          type: object
          maxProperties: 512
          propertyNames: { $ref: "#/components/schemas/BotId" }
          additionalProperties: { $ref: "#/components/schemas/CrawlerAction" }
        impersonators: { $ref: "#/components/schemas/CrawlerAction" }
    CrawlerCatalogueEntry:
      type: object
      additionalProperties: false
      required: [id, name, operator, category, verifiable]
      properties:
        id: { $ref: "#/components/schemas/BotId" }
        name: { type: string, maxLength: 64 }
        operator: { type: string, maxLength: 64 }
        category: { $ref: "#/components/schemas/CrawlerCategory" }
        verifiable: { type: boolean, description: "The operator publishes address ranges: an impersonator of this crawler can be told apart." }
    CrawlerPolicyState:
      type: object
      additionalProperties: false
      required: [website, policy, updated_at, actor, catalogue_version, crawlers, presets]
      properties:
        website: { $ref: "#/components/schemas/WebsiteId" }
        policy: { $ref: "#/components/schemas/CrawlerPolicy" }
        updated_at: { $ref: "#/components/schemas/NullableTimestamp" }
        actor:
          description: Who changed it last; null while the policy was never set.
          oneOf:
            - { type: string, enum: [dashboard, agent] }
            - { type: "null" }
        catalogue_version: { type: string, pattern: "^20[0-9]{2}-[0-9]{2}-[0-9]{2}\\.[0-9]{1,3}$" }
        crawlers: { type: array, maxItems: 1024, items: { $ref: "#/components/schemas/CrawlerCatalogueEntry" } }
        presets: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/CrawlerPreset" } }
    CrawlerPolicyInput:
      description: "The whole policy (absent keys allow), or preset (alone or with impersonators) applied to the stored policy."
      type: object
      additionalProperties: false
      properties:
        categories:
          type: object
          propertyNames: { $ref: "#/components/schemas/CrawlerCategory" }
          additionalProperties: { $ref: "#/components/schemas/CrawlerAction" }
        bots:
          type: object
          maxProperties: 512
          propertyNames: { $ref: "#/components/schemas/BotId" }
          additionalProperties: { $ref: "#/components/schemas/CrawlerAction" }
        impersonators: { $ref: "#/components/schemas/CrawlerAction" }
        preset: { $ref: "#/components/schemas/CrawlerPreset" }
    AccessProtection:
      description: >-
        The access lock of a website, on until removed. scope site: the whole website
        needs a way in, everyone else gets the maintenance page (503); scope paths: only these paths need a way in (403
        with the login page, or "Kein Zugriff" without a form). Every condition set must hold: the client
        address, when addresses or own networks are set (either list is enough), and the shared password, when one is
        set. Only a matching address gets the login form. Paths: start with /, * only as /* at the end (covers
        the path itself and everything below); compared after percent-decoding, dot segments, ';' parameters, trailing
        dots and in lower case (contract/access, vectors access-gate). Except paths (scope site only) stay reachable
        for everyone and are compared exactly as written.
      type: object
      additionalProperties: false
      required: [scope, password, own_networks, updated_at, actor]
      properties:
        scope: { type: string, enum: [site, paths] }
        paths: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/AccessPath" } }
        except: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/AccessPath" } }
        password: { type: boolean, description: A shared password is set. }
        addresses: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/AccessAddress" } }
        own_networks: { type: boolean }
        message: { type: string, maxLength: 500, description: Text of the maintenance page; empty = the default text. }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        actor: { type: string, enum: [dashboard, cli] }
    AccessProtectionState:
      type: object
      additionalProperties: false
      required: [website, protection, maintenance]
      properties:
        website: { $ref: "#/components/schemas/WebsiteId" }
        protection:
          oneOf:
            - { $ref: "#/components/schemas/AccessProtection" }
            - { type: "null" }
        maintenance: { $ref: "#/components/schemas/MaintenanceMode" }
    MaintenanceMode:
      description: "D98: the maintenance mode of a website, a switch of its own next to the access lock."
      type: object
      additionalProperties: false
      required: [on, message]
      properties:
        on: { type: boolean }
        message: { type: string, maxLength: 500, description: Text of the maintenance page; empty = the default text. }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        actor: { type: string, enum: [dashboard, cli] }
    MaintenanceInput:
      type: object
      additionalProperties: false
      required: [on]
      properties:
        on: { type: boolean }
        message: { type: string, maxLength: 500 }
    AccessProtectionInput:
      type: object
      additionalProperties: false
      required: [scope, own_networks]
      properties:
        scope: { type: string, enum: [site, paths] }
        paths: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/AccessPath" } }
        except: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/AccessPath" } }
        password: { type: string, minLength: 8, maxLength: 128, description: New shared password; absent keeps the stored one. }
        remove_password: { type: boolean }
        addresses: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/AccessAddress" } }
        own_networks: { type: boolean }
        message: { type: string, maxLength: 500 }
    AccessPath: { type: string, minLength: 1, maxLength: 255, pattern: "^/" }
    AccessAddress:
      description: An IP or a network with zero host bits; IPv4 up to /16, IPv6 up to /32.
      type: string
      maxLength: 64
      pattern: "^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$"
    WebsiteId:
      description: >-
        Stable id of a website, derived by contract/websites from its first host: lower case, punycode
        A-labels, no port; a wildcard label written _ (*.example.org -> _.example.org); an IPv4 literal as is; an IPv6
        literal as ipv6-<canonical form with - for :>; _any for site blocks without a host; default for a proxy-mode
        gateway without upstream.site_hosts (local to that gateway, never merged across gateways).
      type: string
      maxLength: 253
      pattern: "^(_any|(_|[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)(\\.(_|[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?))*)$"
    WebsiteStatus:
      description: 'ok ("läuft"), attention ("bitte ansehen"), disrupted ("gestört"), unknown ("keine Messwerte"). Rules in contract/websites.Status and the website-status vectors.'
      type: string
      enum: [ok, attention, disrupted, unknown]
    WebsiteStatusReason:
      description: >-
        Why a website has its status, deciding reasons first. code: not_ready, baseline_off, unreachable
        (a gateway it runs on is down; all down: disrupted, some: attention), fail_closed (>= 5 % answered 503 by schild),
        upstream_unreachable (>= 20 % of forwarded requests without an answer or timed out), errors_5xx (>= 20 % 5xx),
        each over 5 minutes with at least 10 requests (disrupted); site_hint, baseline_degraded, server_hint
        (attention); unprotected, no_server, monitoring_off, untracked, no_data (unknown). node names the gateway, hint
        the HealthHintCode, object its mount, device or interface. server_hint is never store_near_cap,
        store_cap_unreachable or storage_budget: those mark only the server (ServerHealth.status attention), not its
        websites.
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, enum: [unprotected, no_server, not_ready, baseline_off, unreachable, fail_closed, upstream_unreachable, errors_5xx, site_hint, baseline_degraded, server_hint, monitoring_off, untracked, no_data] }
        node: { $ref: "../common.schema.json#/$defs/id" }
        hint: { $ref: "#/components/schemas/HealthHintCode" }
        object: { $ref: "#/components/schemas/MetricObject" }
    ServerHealth:
      description: >-
        One server (gateway) a website runs on. status: disrupted when the gate is not ready or baseline protection
        is off, attention with degraded baseline protection or any server-wide hint, else ok (contract/websites.ServerStatus).
        hints are the server-wide hints only (HealthHint without site); the website shows each as one short line
        "<node>: <short text>" and links to the server.
      type: object
      additionalProperties: false
      required: [node, this, status, hints]
      properties:
        node: { $ref: "../common.schema.json#/$defs/id" }
        this: { type: boolean, description: "This gateway (always true on the built-in dashboard)." }
        status: { $ref: "#/components/schemas/WebsiteStatus" }
        baseline_protection: { type: string, enum: [active, degraded, "off"] }
        hints: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/HealthHint" } }
    WebsiteSummary:
      description: >-
        One website card. hosts are the normalised hosts (A-labels, * for a wildcard label), at most 100
        (hosts_total says how many). now is null without numbers (unprotected, untracked, monitoring off). runs_on lists
        the servers it runs on (exactly this gateway on the built-in dashboard: "läuft auf: diesem Server").
      type: object
      additionalProperties: false
      required: [id, label, hosts, hosts_total, source, protection, tracked, status, reasons, now, runs_on]
      properties:
        id: { $ref: "#/components/schemas/WebsiteId" }
        label: { type: string, minLength: 1, maxLength: 253, description: "First host in Unicode (bücher.example), *.example.org for a wildcard, _any or default; the UI renders _any as \"Alle anderen Adressen\" and default as \"Deine Website\"." }
        hosts: { type: array, maxItems: 100, items: { type: string, maxLength: 253, pattern: "^[a-z0-9*:.-]{1,253}$" } }
        hosts_total: { type: integer, minimum: 0 }
        source: { type: string, enum: [caddyfile, proxy] }
        protection: { type: string, enum: [protected, partial, unprotected], description: "partial: some site blocks of it run schild, others are listed in ingress.unprotected_sites." }
        tracked: { type: boolean, description: "Own series in the monitoring rings (the first 32 websites schild sees); false: counted in _other." }
        status: { $ref: "#/components/schemas/WebsiteStatus" }
        reasons: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/WebsiteStatusReason" } }
        now: { oneOf: [{ $ref: "#/components/schemas/TrafficNow" }, { type: "null" }], description: "Last 60 s of this website: requests_per_s, stopped_share, latency_total_p95_ms and the rest of TrafficNow." }
        runs_on: { type: array, minItems: 1, maxItems: 64, items: { $ref: "#/components/schemas/ServerHealth" } }
    WebsiteList:
      type: object
      additionalProperties: false
      required: [generated_at, node, websites]
      properties:
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        node: { $ref: "../common.schema.json#/$defs/id", description: "node_name of this gateway." }
        server: { $ref: "#/components/schemas/ServerHealth" }
        websites: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/WebsiteSummary" } }
        other:
          description: "Websites beyond the first 32 (their sum, site _other); absent when every website is tracked."
          type: object
          additionalProperties: false
          required: [websites, now]
          properties:
            websites: { type: integer, minimum: 1 }
            now: { oneOf: [{ $ref: "#/components/schemas/TrafficNow" }, { type: "null" }] }
    WebsiteDetail:
      type: object
      additionalProperties: false
      required: [generated_at, website, traffic_24h, incidents_24h]
      properties:
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        website: { $ref: "#/components/schemas/WebsiteSummary" }
        traffic_24h: { oneOf: [{ $ref: "#/components/schemas/TrafficCounters" }, { type: "null" }], description: "Exact counters of the last 24 h from the rings; null without numbers." }
        traffic_24h_partial: { type: boolean, description: "traffic_24h does not cover the full 24 h (a schild start, a gap or a bucket marked partial inside the window), as KpiValue.partial. Absent = false. The UI shows \"seit <traffic_24h_since>\" or a gap hint, never \"Näherungswert\"." }
        traffic_24h_since: { $ref: "#/components/schemas/Timestamp", description: "Start of the counted window when it begins later than now - 24 h (the first bucket after a schild start or the oldest bucket the ring still holds). Absent = the full 24 h." }
        incidents_24h: { type: integer, minimum: 0 }
    SitesAffected:
      description: >-
        Which websites of this gateway one client touched ("betrifft 3 von 4 Websites"), so a scanner that
        hits every app stands out. From the client's events and, while it holds them, the request ring (same visitor key)
        in the 24 h before the incident or event; always includes the website of the event itself.
      type: object
      additionalProperties: false
      required: [sites, count, total]
      properties:
        sites: { type: array, maxItems: 32, description: "Website ids, the event's own first; at most 32 listed.", items: { $ref: "#/components/schemas/WebsiteId" } }
        count: { type: integer, minimum: 1, description: "Websites touched (may exceed the listed 32)." }
        total: { type: integer, minimum: 1, description: "Protected websites of this gateway." }
    IncidentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/Incident" } }
        next_cursor: { type: [string, "null"] }

    # ---------------------------------------------------------------- agent API call log
    AgentTokenId: { type: string, pattern: "^tok_[0-9a-f]{12}$" }
    AgentTokenInfo:
      description: "A token of the agent API as stored on the host: never the token itself or its hash."
      type: object
      additionalProperties: false
      required: [id, scope, created_at, expires_at, revoked_at, last_used_at]
      properties:
        id: { $ref: "#/components/schemas/AgentTokenId" }
        scope: { type: string, enum: ["agent:read", "export:read", "rules:write", "blocks:write", "exceptions:write", "crawlers:write", "firewall:sync"] }
        label: { type: string, maxLength: 64 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/NullableTimestamp" }
        last_used_at: { $ref: "#/components/schemas/NullableTimestamp" }
    AgentCall:
      type: object
      additionalProperties: false
      required: [token_id, time, op, status, rows, bytes]
      properties:
        token_id: { $ref: "#/components/schemas/AgentTokenId" }
        time: { $ref: "#/components/schemas/Timestamp" }
        op: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$", description: "operationId or MCP tool name (schild_*)." }
        status: { type: integer, minimum: 100, maximum: 599 }
        rows: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
    AgentAPIState:
      description: D103, the switch of the agent API.
      type: object
      additionalProperties: false
      required: [enabled, config_enabled, state_source, listen, listening, active_tokens, firewall_tokens, updated_at, actor]
      properties:
        enabled: { type: boolean, description: "What holds: false when agent_api.enabled of schild.yaml is false, else the value set in the dashboard, else true." }
        config_enabled: { type: boolean, description: "agent_api.enabled of schild.yaml (on by default), what a reset gives back. false: nothing can be switched in the dashboard." }
        state_source: { type: string, enum: [config, dashboard], description: "config: schild.yaml or its default decides, always so with config_enabled false. dashboard: the switch was set here." }
        listen: { type: string, maxLength: 64, description: "agent_api.listen, e.g. 127.0.0.1:8789." }
        listening: { type: boolean, description: "The listener is open. false with enabled true: it did not open (error), or this process serves no listeners." }
        error: { type: string, maxLength: 300, description: "Why the listener is not open while enabled: the port is in use, or the address names every interface outside a container. Absent otherwise." }
        active_tokens: { type: integer, minimum: 0, description: "Tokens that are neither revoked nor expired." }
        firewall_tokens: { type: integer, minimum: 0, description: "Of those, tokens with scope firewall:sync: `schild firewall run` depends on the agent API, so the UI warns before switching off." }
        updated_at: { $ref: "#/components/schemas/NullableTimestamp", description: "When the switch was set in the dashboard; null with state_source config." }
        actor: { type: [string, "null"], maxLength: 64, description: "The dashboard user who set it; null with state_source config." }
    AgentAPIInput:
      description: Exactly one of enabled and reset.
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        enabled: { type: boolean }
        reset: { type: boolean, const: true, description: "Drop the value of the dashboard: agent_api.enabled of schild.yaml decides again." }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, maxItems: 500, items: { $ref: "../audit-entry.schema.json" } }
        next_cursor: { type: [string, "null"] }
    AgentCallLog:
      type: object
      additionalProperties: false
      required: [enabled, log_days, tokens, items, next_cursor]
      properties:
        enabled: { type: boolean, description: "The agent API is on (AgentAPIState.enabled)." }
        log_days: { type: integer, minimum: 1, maximum: 90 }
        tokens: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/AgentTokenInfo" } }
        items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/AgentCall" } }
        next_cursor: { type: [string, "null"] }

    # ---------------------------------------------------------------- website overview (Plausible-style)
    FilterExpr:
      description: "`<dimension>:<value>` of the website overview, e.g. country:DE, path:/kontakt/, referrer:ai:chatgpt, net_class:hosting, asn:64496, rule:942100, and ip:192.0.2.10, user_agent:bingbot (request ring only)."
      type: string
      maxLength: 600
      pattern: "^(path|country|asn|net_class|ua_class|method|status_class|referrer|browser|os|device|bot_category|rule|ip|user_agent):[^\\x00-\\x1F\\x7F]{1,512}$"
    KpiValue:
      type: object
      additionalProperties: false
      required: [value, exact]
      properties:
        value: { type: [number, "null"], minimum: 0, description: "null when not available (see unavailable)." }
        exact: { type: boolean, description: "How the number is made, never the coverage of the window. true: counted from every request in the window (counters such as requests, stopped, would_block, page_views, error_rate). false: Näherungswert (error_bound when known) - an estimate (visitors, latency p95), a bounded top list (a filter on path, asn, referrer or rule, or on country per website with several websites), stopped split under a status_class filter, or a sampled request ring. A gap or restart in the range no longer turns exact false; that is partial." }
        gap_kind: { type: string, enum: [restart, lost], description: "Only with partial true, why the window is incomplete. restart: every uncounted part is time in which schild was stopped in an orderly way (SIGTERM, a deploy: the running buckets were written at shutdown), so every request schild answered is counted; requests sent while it was down never reached it. lost: some part may miss requests schild did answer: a hard stop (SIGKILL, OOM, crash: at most the minute before it, see the minute checkpoint in MetricBucket), a skipped sample or a bucket that could not be written; lost wins when both occur. Absent with partial true: unknown. The UI may say \"Neustart\" for restart and \"Messlücke\" for lost." }
        partial: { type: boolean, description: "The window is incomplete - schild did not count every second of its period (current: [from, to), previous: [previous_from, previous_to)) up to now: a bucket marked partial (a schild start or a skipped sample inside it), a missing bucket (a gap: schild down or a write skipped) or a schild start inside the range. Counts then miss the seconds that were not counted. A range ending at now is not partial because of the running bucket alone. Absent = false. Independent of exact: exact says whether the number is counted or estimated, partial says whether the window was fully covered; all four combinations occur. The UI shows partial as a gap hint (e.g. \"Messlücke im Zeitraum\", linked to the monitoring_gap and restart annotations), never as \"Näherungswert\"." }
        error_bound: { type: number, minimum: 0 }
        unavailable: { type: string, enum: [no_data, filter_needs_requests, monitoring_off], description: "Why value is null." }
    KpiSet:
      type: object
      additionalProperties: false
      required: [visitors, page_views, requests, stopped, would_block, latency_p95_ms, error_rate]
      properties:
        visitors: { $ref: "#/components/schemas/KpiValue", description: "Besucher ohne erkannte Bots: distinct clients with a browser request schild forwarded, per UTC day summed over the days; always an estimate." }
        page_views: { $ref: "#/components/schemas/KpiValue" }
        requests: { $ref: "#/components/schemas/KpiValue" }
        stopped: { $ref: "#/components/schemas/KpiValue" }
        would_block: { $ref: "#/components/schemas/KpiValue" }
        latency_p95_ms: { $ref: "#/components/schemas/KpiValue" }
        error_rate: { $ref: "#/components/schemas/KpiValue", description: "5xx answers per request (ratio)." }
    WebsiteKpis:
      type: object
      additionalProperties: false
      required: [site, from, to, previous_from, previous_to, source, current, previous]
      properties:
        cluster: { $ref: "#/components/schemas/ClusterScope" }
        site: { $ref: "#/components/schemas/WebsiteId" }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        previous_from: { $ref: "#/components/schemas/Timestamp" }
        previous_to: { $ref: "#/components/schemas/Timestamp" }
        filters: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/FilterExpr" } }
        source: { type: string, enum: [rings, requests] }
        current: { $ref: "#/components/schemas/KpiSet" }
        previous: { $ref: "#/components/schemas/KpiSet" }
    RealtimePoint:
      type: object
      additionalProperties: false
      required: [t, requests, stopped, would_block, visitors, partial]
      properties:
        t: { $ref: "#/components/schemas/Timestamp" }
        requests: { type: integer, minimum: 0 }
        stopped: { type: integer, minimum: 0 }
        would_block: { type: integer, minimum: 0 }
        visitors: { type: [integer, "null"], minimum: 0, description: "Estimate (distinct visitors in the minute: browser requests schild forwarded, bots not counted)." }
        partial: { type: boolean }
    WebsiteRealtime:
      type: object
      additionalProperties: false
      required: [site, generated_at, visitors_5m, requests_5m, stopped_5m, would_block_5m, points]
      properties:
        cluster: { $ref: "#/components/schemas/ClusterScope" }
        site: { $ref: "#/components/schemas/WebsiteId" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        visitors_5m: { type: [integer, "null"], minimum: 0, description: "Visitors of the last 5 minutes (estimate, ±3.3 %): distinct clients with a browser request schild forwarded; bots, tools and stopped clients are not counted (UI \"≈ N Besucher · letzte 5 Min.\")." }
        requests_5m: { type: integer, minimum: 0 }
        stopped_5m: { type: integer, minimum: 0 }
        would_block_5m: { type: integer, minimum: 0 }
        points: { type: array, maxItems: 31, items: { $ref: "#/components/schemas/RealtimePoint" } }
    Annotation:
      description: >-
        One marker on the main chart. The UI writes the German label from kind and the detail fields, e.g.
        wave_detected "Verteilter Login-Angriff erkannt", block_long "7 Tage gesperrt: Rechenzentrum, wiederholt",
        config_changed "Konfiguration geändert", restart "Neustart von Schild", monitoring_gap "Messlücke". ref is the
        link target (wave id, incident number, event id) for kinds that have one. Incidents may
        be grouped into one marker per chart bin (kind incident, t = bin start, until = bin end, count = number of
        incidents in the bin, ref = the newest incident of the bin); count 1 or an ungrouped incident is one incident.
      type: object
      additionalProperties: false
      required: [t, kind]
      properties:
        t: { $ref: "#/components/schemas/Timestamp" }
        until: { $ref: "#/components/schemas/Timestamp", description: "End of a wave, a gap or a block; for a grouped incident marker the end of its bin." }
        kind: { type: string, enum: [wave_detected, wave_ended, incident, block_long, mode_changed, config_changed, restart, monitoring_gap, rule_repository_changed, agent_block_set, agent_block_lifted] }
        ref: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.:-]{1,64}$" }
        detector: { $ref: "#/components/schemas/DetectorId" }
        count: { type: integer, minimum: 0, description: "Senders of a wave; for kind incident: the number of incidents in the bin of a grouped marker (1 or absent = a single incident); for kind block_long: the ladder step (BehaviourBlock.level, 1 = first block), so \"wiederholt\" means count >= 2." }
        net_class: { $ref: "../common.schema.json#/$defs/netClass" }
        duration_s: { type: integer, minimum: 0 }
        mode_from: { $ref: "#/components/schemas/Mode" }
        mode_to: { $ref: "#/components/schemas/Mode" }
        config_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        repository: { $ref: "#/components/schemas/RuleRepositoryId", description: "Kind rule_repository_changed." }
        state_from: { $ref: "#/components/schemas/RuleRepositoryState" }
        state_to: { $ref: "#/components/schemas/RuleRepositoryState" }
        actor: { type: string, enum: [dashboard, agent], description: "Who changed the state of the repository." }
        token_label: { type: string, maxLength: 64, description: "With actor agent: the name of the token. UI: \"Über Agent <label>\". Also on agent_block_set and agent_block_lifted (always with a label); ref is the incident number, or the event id of a would_block record." }
        effect: { type: string, enum: [block, would_block], description: "Only on agent_block_set. would_block: the gateway observes, nothing was blocked." }
    AnnotationList:
      type: object
      additionalProperties: false
      required: [site, from, to, items, truncated]
      properties:
        site: { $ref: "#/components/schemas/WebsiteId" }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Annotation" } }
        truncated: { type: boolean, description: "More than 200 markers in the range (the oldest are cut)." }
    RuleCategory:
      description: >-
        Short label source of a rule id for "Letzte Alarme" (contract/websites.RuleCategory), from the CRS id
        range: 913 scanner, 920 protocol, 921 protocol_attack, 930 lfi, 931 rfi, 932 rce, 933 php, 934 generic, 941 xss,
        942 sqli, 943 session_fixation, 944 java, 949/959/980 anomaly; other ids local. German in the UI (e.g. sqli "SQL-Injection", lfi "Dateizugriff").
      type: string
      enum: [scanner, protocol, protocol_attack, lfi, rfi, rce, php, generic, xss, sqli, session_fixation, java, anomaly, local, behaviour, rate_limit]
    AlertItem:
      type: object
      additionalProperties: false
      required: [t, event_id, kind, outcome, category]
      properties:
        t: { $ref: "#/components/schemas/Timestamp" }
        event_id: { $ref: "../common.schema.json#/$defs/uuid" }
        kind: { type: string, enum: [waf, behaviour, rate_limit] }
        outcome: { type: string, enum: [blocked, would_block, rate_limited, would_rate_limit] }
        category: { $ref: "#/components/schemas/RuleCategory" }
        rules: { type: array, maxItems: 3, items: { type: string, maxLength: 32 } }
        scenario: { $ref: "#/components/schemas/ScenarioId" }
        path: { type: string, maxLength: 512, pattern: "^[^\\x00-\\x1F\\x7F]*$", description: "Path template or redacted path." }
        country: { $ref: "../common.schema.json#/$defs/country" }
        net_class: { $ref: "../common.schema.json#/$defs/netClass" }
        client_pseudonym: { type: string, pattern: "^p1-[0-9a-f]{16}$", description: "Keyed pseudonym (as in the agent API); the event shows the address." }
        incident: { $ref: "#/components/schemas/IncidentNumber" }
        would_block_reason: { $ref: "#/components/schemas/WouldBlockReason", description: "Only with outcome would_block or would_rate_limit." }
        possible_false_positive:
          type: boolean
          description: >-
            True when listFalsePositiveHints over the same website and the request ring
            holds a hint ("möglicher Fehlalarm") for one of rules on this path, so the UI marks the alert without joining
            the hints by rule and page. Absent = false; always absent for behaviour and rate-limit alerts and outside
            the 48 h request ring.
    AlertFeed:
      type: object
      additionalProperties: false
      required: [site, items]
      properties:
        site: { $ref: "#/components/schemas/WebsiteId" }
        filters: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/FilterExpr" } }
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AlertItem" } }
