# lab.yaml for lab-a in the local test lab. TEST ONLY (test keys).
config_version: 0
profile: test
identity: { operator: op-test-a, lab: lab-a }
listen:
  ingest: "0.0.0.0:7443"
  feed: "0.0.0.0:7444"
  dashboard: "0.0.0.0:8789"
  metrics: "0.0.0.0:9102"
tls:
  cert_file: /etc/schild-lab/tls/cert.pem
  key_file: /etc/schild-lab/tls/key.pem
channel: schild-main
keys:
  - keyid: test-lab-a
    private_key_file: /etc/schild-lab/keys/lab.key
    purposes: [ack, rules, checkpoint]
issuers:
  - id: issuer-test-1
  - id: issuer-test-2
clients:
  - keyid: test-site-a
    public_key: "ed25519:4HDXCYuKTC7or+jY5cfx0frqJsA5bTxnc1Ftu0gjb5w="
    issuer: issuer-test-1
  - keyid: test-site-b
    public_key: "ed25519:LcTU1BywmLDy/Lt/hKg+ws/QBJgTvg5dk3YPOiBLpns="
    issuer: issuer-test-1
  - keyid: test-site-c
    public_key: "ed25519:kvgubTf561NxFRt6siZ7/yZx/rl/ZOv2gRyRTlfCybs="
    issuer: issuer-test-2
scoring: { min_issuers: 3, max_issuer_share: 0.34 }
publish: { bundle_validity_hours: 168, checkpoint_interval_s: 60, checkpoint_ttl_s: 180 }
retention: { signals_days: 30 }
