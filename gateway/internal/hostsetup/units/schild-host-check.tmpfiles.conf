# /etc/tmpfiles.d/schild-host-check.conf (MVP-11)
# Report dir of `schild check`: owned by root, group 65532 (the uid/gid the
# schild container runs as; `schild check install` writes the group of
# schild.service instead when schild runs as a service), setgid so every
# report inherits the group.
# Mode 2750: root writes, the container reads, nobody else sees anything.
d /var/lib/schild/host-check 2750 root 65532 -
# Request dir of "Jetzt prüfen" (optional, schild-check.path): the container
# (65532) writes /run/schild-check/request, the check removes it.
d /run/schild-check 0770 root 65532 -
