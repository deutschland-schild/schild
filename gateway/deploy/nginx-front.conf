# nginx in front of schild (inner mode): fail-open ONLY when schild refuses
# the connection (process down), 503 on timeout, never pass on timeout.
#
#   visitor -> nginx :443 (TLS) -> schild 127.0.0.1:8080 -> app 127.0.0.1:8081
#
# How it works: nginx answers 502 when the upstream refuses the connection
# and 504 when it times out. Only 502 from the connect phase is mapped to the
# bypass location; 504 becomes 503. proxy_next_upstream is off, so nginx never
# retries a request that schild may already have inspected or blocked.
# schild itself never returns 502 for its own decisions (blocks are 403/413/
# 400/415/503); an application error behind schild is passed through as-is
# by intercept_errors off for the app's own 5xx (see below).
#
# Client address: schild uses X-Forwarded-For only from a peer in
# ingress.trusted_proxies (default 127.0.0.1/32 and ::1/128, so nginx on the
# same host). If nginx runs elsewhere, add its address there, never a broad
# range. On one host bind schild to loopback (listen.proxy "127.0.0.1:8080";
# the default 0.0.0.0:8080 is meant for containers), so nobody reaches it
# around nginx.

upstream schild {
    server 127.0.0.1:8080 max_fails=0;
    keepalive 64;
}

upstream app_direct {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name shop.example;
    # ssl_certificate ...; ssl_certificate_key ...;

    location / {
        proxy_pass http://schild;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # replace, do not append untrusted chains
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never pass a client's own address headers on (they count if
        # ingress.client_ip_headers names them).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 1s;      # refused connections fail fast
        proxy_read_timeout 35s;        # > schild upstream timeout (30 s default)
        proxy_send_timeout 35s;
        proxy_next_upstream off;       # never retry elsewhere
        proxy_request_buffering on;    # the body can be replayed to app_direct after a refused connect

        # Only nginx's own errors are intercepted (the upstream's responses
        # pass unchanged because they are not 502/504 generated by nginx).
        proxy_intercept_errors off;
        error_page 502 = @schild_down;     # connect refused / schild not running
        error_page 504 = @schild_timeout;  # schild did not answer in time
    }

    location @schild_down {
        # Access lock (D56): while a website or some of its paths need a
        # password or an allowed address, schild keeps <storage>/access/active. Then nothing
        # may reach the app unchecked, so no fail-open. nginx needs read
        # access to that path (mount the storage read-only if schild runs in
        # a container). D71: schild writes <storage>/access/active.json at
        # every start; while nginx cannot see it the lock state is unknown,
        # which counts as a lock.
        default_type text/plain;   # for the 503 below; the app sends its own type
        set $schild_lock "";
        if (!-f /var/lib/schild/access/active.json) {
            set $schild_lock "unknown";
        }
        if (-f /var/lib/schild/access/active) {
            set $schild_lock "on";
        }
        if ($schild_lock) {
            add_header Retry-After 60 always;
            add_header Cache-Control no-store always;
            return 503 "Wir sind gleich wieder da. Bitte versuch es später noch einmal.\n";
        }
        # Fail-open: the site stays reachable without inspection while schild
        # is down (T12). Log it and alert on it.
        access_log /var/log/nginx/schild-bypass.log;
        proxy_pass http://app_direct;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header X-Schild-Bypass "1" always;
    }

    location @schild_timeout {
        # Never pass on timeout.
        add_header Retry-After 5 always;
        default_type text/plain;
        return 503 "Die Prüfung dauert gerade zu lange. Bitte versuch es gleich noch einmal.\n";
    }
}

# Caveat: nginx also answers 502 when schild closes a connection without a
# response (crash mid-request). That case is passed to app_direct too; it is
# rare and equivalent to "schild down". If you need strictly "refused only",
# use `schild front` (client/internal/failopen), which classifies the error
# itself.
