# Local rules of the operator: the rule repository local (full SecLang, not
# the subset that rules fetched from outside must use). Files in
# rules.local.dir of schild.yaml
# (default /etc/schild/rules.d/*.conf) are loaded in name order after the CRS;
# `schild rules sync local` or SIGHUP loads them again without a restart.
# Ids belong to the other repositories and are refused here: 200000-200099 and
# 900000-999999 (crs), 1900000-1999999 (agent exceptions), 7700000-7799999
# (reserved for the network), 60000000-99999999 (crowdsec). A rule with
# deny/block blocks while "Eigene & Ausnahmen" (rules.local.state) is on block;
# on detect, and in the test profile, it shows as "Erkannt" (would_block).
SecRule REQUEST_FILENAME "@endsWith /xmlrpc.php" "id:1000001,phase:1,deny,status:403,log,severity:WARNING,msg:'Example: XML-RPC is not used on this site',t:none"
