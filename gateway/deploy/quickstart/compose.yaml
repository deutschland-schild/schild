# Schild Gateway quickstart: one container in front of your application.
#
#   1. Put this file and schild.yaml into one folder.
#   2. Set upstream.url in schild.yaml to your application.
#   3. docker compose up -d
#   4. docker compose exec schild schild dashboard setup-code
#      (one-time code for the first login; the log has it too: setup_code)
#   5. Open http://127.0.0.1:8788 on the server itself, or from your machine
#      through a tunnel: ssh -N -L 8788:127.0.0.1:8788 you@your-server
#
# The OWASP CRS and your own rules block known attacks from the start, and
# the limits for login, password reset and xmlrpc.php limit. Four of five
# scenarios block after 14 days of learning. CrowdSec rules and the other
# limits only record. Switch them in the dashboard under Regeln.
# Remove it again with: docker compose down (add -v to delete its data too).
#
# Docs: https://deutschland-schild.de/doku
name: schild
services:
  schild:
    # A fixed version, never "latest": you decide when to update.
    image: ${SCHILD_IMAGE:-ghcr.io/deutschland-schild/schild:0.1.0-alpha.6}
    restart: unless-stopped
    # Time for a stop: in a cluster schild leaves traffic for
    # cluster.drain.delay_s and gives running requests grace_s (15 + 30 s)
    # before it ends. Docker's default of 10 s would cut that short.
    stop_grace_period: 90s
    # Locked down: read-only root file system, no capabilities, no new
    # privileges. schild runs as an unprivileged user (65532) and writes only
    # to the volume below.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # Requests from visitors, from your web server on this host (nginx,
      # Apache) only. schild trusts its X-Forwarded-For through the Docker
      # networks listed in schild.yaml (ingress.trusted_proxies). Keep
      # 127.0.0.1: published on every address, anyone could send that header.
      # A load balancer on another machine: see ingress.trusted_proxies.
      - "127.0.0.1:8080:8080"
      # The dashboard, on this host's loopback only. Do not remove 127.0.0.1.
      - "127.0.0.1:8788:8788"
      # The agent API for your AI agent, on this host's loopback only. Do not
      # remove 127.0.0.1, and keep the port number: schild refuses calls that
      # name another port.
      - "127.0.0.1:8789:8789"
    extra_hosts:
      # Lets schild reach an application that listens on the Docker host.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./schild.yaml:/etc/schild/schild.yaml:ro
      - schild-data:/var/lib/schild
      # Server check (after "sudo schild check install" on the host): the
      # reports, read only, and the request directory of "Jetzt prüfen".
      # - /var/lib/schild/host-check:/var/lib/schild/host-check:ro
      # - /run/schild-check:/run/schild-check
    # environment:
    #   SCHILD_HOST_CHECK_TRIGGER: /run/schild-check/request
    # Container logs stay bounded: at most 5 files of 10 MB.
    logging:
      options:
        max-size: 10m
        max-file: "5"
volumes:
  schild-data: {}
