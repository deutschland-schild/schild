# Vulnerabilities osv-scanner (and OpenSSF Scorecard) reports for gateway/go.mod that are reviewed and accepted
# for a time. Every entry has a reason and an end date; after it the finding counts again.

# go-jose v3 has no fixed release (last affected: 3.0.5). It comes in through Caddy's PKI modules
# (smallstep/certificates -> go.step.sm/crypto v0.91). go.step.sm/crypto v0.92 moves to go-jose v4, but
# smallstep/certificates v0.30.2 does not build with it. The flawed code parses keys and tokens that ACME
# clients send, which only Caddy's acme_server does; schild refuses acme_server in an operator's Caddyfile
# (caddymod.PrepareIngress), so no configuration reaches it. Drop these entries
# with the Caddy update that brings smallstep/certificates on go-jose v4.
[[IgnoredVulns]]
id = "GHSA-4w3g-jfj2-cw2q"
ignoreUntil = 2027-02-20T00:00:00Z
reason = "go-jose v3 via Caddy PKI, no fixed v3; reached only by acme_server, which schild refuses."

[[IgnoredVulns]]
